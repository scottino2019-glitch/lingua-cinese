            {id: 61, character: "心", strokes: 4, meaning: "cuore", pinyin: "xīn", examples: ["思", "想"], category: "emozioni",
             explanation: "Rappresenta il cuore umano, centro delle emozioni e dei pensieri. Nel carattere 思 (pensare), simboleggia l'attività mentale ed emotiva. È uno dei radicali più importanti per esprimere sentimenti, emozioni e stati mentali. Appare in centinaia di caratteri psicologici."},
            {id: 62, character: "戈", strokes: 4, meaning: "alabarda", pinyin: "gē", examples: ["我", "战"], category: "armi",
             explanation: "Rappresenta un'alabarda o lancia da guerra, simboleggiando conflitto e protezione. Nel carattere 我 (io), originariamente indicava 'la mia arma', evolvendosi nel pronome personale. È legato ai concetti di guerra, difesa e identità personale."},
            {id: 63, character: "戶", strokes: 4, meaning: "porta", pinyin: "hù", examples: ["房", "所"], category: "edifici",
             explanation: "Rappresenta una porta o ingresso di casa, simboleggiando dimora e famiglia. Nel carattere 房 (stanza), indica uno spazio abitativo. È fondamentale per esprimere concetti domestici, familiari e di appartenenza a un luogo."},
            {id: 64, character: "手", strokes: 4, meaning: "mano", pinyin: "shǒu", examples: ["打", "拿"], category: "corpo",
             explanation: "Rappresenta una mano umana, simboleggiando azione, abilità e manipolazione. Nel carattere 打 (colpire), mostra l'azione diretta della mano. È presente in tutti i caratteri che esprimono azioni manuali, abilità e interazione fisica con il mondo."},
            {id: 65, character: "支", strokes: 4, meaning: "ramo", pinyin: "zhī", examples: ["技", "收"], category: "piante",
             explanation: "Rappresenta un ramo che si dirama da un tronco, simboleggiando ramificazione e supporto. Nel carattere 技 (abilità), indica le diverse competenze che si sviluppano. È legato ai concetti di specializzazione, supporto e crescita organica."},
            {id: 66, character: "攴", strokes: 4, meaning: "colpire", pinyin: "pū", examples: ["教", "救"], category: "azioni",
             explanation: "Rappresenta una mano che tiene un bastone per colpire, simboleggiando azione educativa o correttiva. Nel carattere 教 (insegnare), indica l'azione di guidare attraverso la disciplina. È presente in caratteri che esprimono azioni decisive e educative."},
            {id: 67, character: "文", strokes: 4, meaning: "scrittura", pinyin: "wén", examples: ["斋", "斌"], category: "cultura",
             explanation: "Rappresenta decorazioni incrociate o tatuaggi, evolvendosi nel concetto di scrittura e cultura. Simboleggia civilizzazione, educazione e raffinatezza. È fondamentale per esprimere concetti legati alla letteratura, all'arte e alla cultura intellettuale."},
            {id: 68, character: "斗", strokes: 4, meaning: "misura", pinyin: "dǒu", examples: ["料", "斜"], category: "misure",
             explanation: "Rappresenta un contenitore per misurare cereali, simboleggiando quantità e valutazione. Nel carattere 料 (materiale), indica la misurazione e classificazione di sostanze. È legato ai concetti di misurazione, commercio e organizzazione."},
            {id: 69, character: "斤", strokes: 4, meaning: "ascia", pinyin: "jīn", examples: ["新", "断"], category: "strumenti",
             explanation: "Rappresenta un'ascia per tagliare legna, simboleggiando taglio e trasformazione. Nel carattere 新 (nuovo), indica il processo di rinnovamento attraverso il taglio del vecchio. È presente in caratteri che esprimono cambiamento e lavorazione."},
            {id: 70, character: "方", strokes: 4, meaning: "quadrato", pinyin: "fāng", examples: ["放", "旅"], category: "forme",
             explanation: "Rappresenta una forma quadrata o rettangolare, simboleggiando ordine e direzione. Nel carattere 放 (mettere/rilasciare), indica l'azione di posizionare in modo ordinato. È legato ai concetti di direzione, metodo e organizzazione spaziale."},
            {id: 71, character: "无", strokes: 4, meaning: "non avere", pinyin: "wú", examples: ["既", "旡"], category: "negazione",
             explanation: "Rappresenta l'assenza o la mancanza di qualcosa, simboleggiando il vuoto e la negazione. È una forma alternativa di 無, usata per esprimere concetti di assenza, mancanza e negazione. È fondamentale nella filosofia e logica cinese."},
            {id: 72, character: "日", strokes: 4, meaning: "sole", pinyin: "rì", examples: ["时", "明"], category: "natura",
             explanation: "Rappresenta il sole, originariamente disegnato come un cerchio con un punto centrale. Nel carattere 明 (luminoso), combinato con 月 (luna), simboleggia la luce completa. È uno dei radicali più importanti per esprimere tempo, luce e chiarezza."},
            {id: 73, character: "曰", strokes: 4, meaning: "dire", pinyin: "yuē", examples: ["更", "曾"], category: "comunicazione",
             explanation: "Rappresenta una bocca che parla, simile a 口 ma più largo, simboleggiando discorso formale o antico. È usato in caratteri che esprimono comunicazione solenne o tradizionale. Si distingue da 口 per il suo uso più letterario e formale."},
            {id: 74, character: "月", strokes: 4, meaning: "luna", pinyin: "yuè", examples: ["有", "朋"], category: "natura",
             explanation: "Rappresenta la luna crescente, simboleggiando ciclicità e tempo. Nel carattere 有 (avere), indica possesso e presenza. È anche usato per rappresentare la carne nei caratteri anatomici. È fondamentale per esprimere tempo, corpo e possesso."},
            {id: 75, character: "木", strokes: 4, meaning: "albero", pinyin: "mù", examples: ["林", "森"], category: "piante",

        ];

        let favorites = JSON.parse(localStorage.getItem('radicalFavorites') || '[]');
        let currentFilter = 'all';
        let currentQuiz = null;

        // Initialize the app
        document.addEventListener('DOMContentLoaded', function() {
            displayRadicals();
            setupSearch();
            updateFavoritesList();
        });

        // Tab switching
        function showTab(tabName) {
            // Hide all tab contents
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.add('hidden');
            });
            
            // Remove active class from all tabs
            document.querySelectorAll('nav button').forEach(tab => {
                tab.classList.remove('active-tab');
                tab.classList.add('text-gray-600', 'hover:text-blue-600');
            });
            
            // Show selected tab content
            document.getElementById(tabName + 'Content').classList.remove('hidden');
            
            // Add active class to selected tab
            const activeTab = document.getElementById(tabName + 'Tab');
            activeTab.classList.add('active-tab');
            activeTab.classList.remove('text-gray-600', 'hover:text-blue-600');
        }

        // Display radicals in grid
        function displayRadicals(radicalsToShow = radicals) {
            const grid = document.getElementById('radicalsGrid');
            grid.innerHTML = '';
            
            radicalsToShow.forEach(radical => {
                const card = createRadicalCard(radical);
                grid.appendChild(card);
            });
        }

        // Create radical card
        function createRadicalCard(radical) {
            const card = document.createElement('div');
            card.className = 'radical-card bg-white rounded-lg shadow-sm p-4 text-center border hover:border-blue-300 fade-in';
            
            const isFavorite = favorites.includes(radical.id);
            
            card.innerHTML = `
                <div class="flex justify-between items-start mb-2">
                    <span class="text-xs text-gray-500 font-medium">#${radical.id}</span>
                    <button onclick="toggleFavorite(${radical.id})" class="text-lg hover:scale-110 transition-transform">
                        ${isFavorite ? '❤️' : '🤍'}
                    </button>
                </div>
                <div class="chinese-font text-4xl mb-2 text-gray-800">${radical.character}</div>
                <div class="text-sm font-medium text-gray-700 mb-1">${radical.meaning}</div>
                <div class="text-xs text-gray-500 mb-2">${radical.pinyin}</div>
                <div class="text-xs text-blue-600 bg-blue-50 px-2 py-1 rounded-full">
                    ${radical.strokes} tratt${radical.strokes === 1 ? 'o' : 'i'}
                </div>
            `;
            
            card.addEventListener('click', () => showRadicalDetail(radical));
            return card;
        }

        // Filter by strokes
        function filterByStrokes(strokes) {
            // Update filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active', 'bg-blue-600', 'text-white');
                btn.classList.add('bg-gray-100', 'hover:bg-gray-200');
            });
            
            event.target.classList.add('active', 'bg-blue-600', 'text-white');
            event.target.classList.remove('bg-gray-100', 'hover:bg-gray-200');
            
            currentFilter = strokes;
            
            let filteredRadicals;
            if (strokes === 'all') {
                filteredRadicals = radicals;
            } else if (strokes === 4) {
                filteredRadicals = radicals.filter(r => r.strokes >= 4);
            } else {
                filteredRadicals = radicals.filter(r => r.strokes === strokes);
            }
            
            displayRadicals(filteredRadicals);
        }

        // Setup search functionality
        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', performSearch);
        }

        // Perform search
        function performSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const resultsContainer = document.getElementById('searchResults');
            
            if (query.length === 0) {
                resultsContainer.innerHTML = '<div class="col-span-full text-center text-gray-500 py-8">Inserisci un termine di ricerca</div>';
                return;
            }
            
            const results = radicals.filter(radical => 
                radical.character.includes(query) ||
                radical.meaning.toLowerCase().includes(query) ||
                radical.pinyin.toLowerCase().includes(query) ||
                radical.id.toString().includes(query) ||
                radical.category.toLowerCase().includes(query) ||
                radical.examples.some(example => example.includes(query))
            );
            
            if (results.length === 0) {
                resultsContainer.innerHTML = '<div class="col-span-full text-center text-gray-500 py-8">Nessun risultato trovato</div>';
                return;
            }
            
            resultsContainer.innerHTML = '';
            results.forEach(radical => {
                const card = createSearchResultCard(radical, query);
                resultsContainer.appendChild(card);
            });
        }

        // Create search result card
        function createSearchResultCard(radical, query) {
            const card = document.createElement('div');
            card.className = 'bg-white rounded-lg shadow-sm p-4 border hover:border-blue-300 cursor-pointer transition-all fade-in';
            
            const isFavorite = favorites.includes(radical.id);
            
            // Highlight search terms
            const highlightText = (text, query) => {
                if (!query) return text;
                const regex = new RegExp(`(${query})`, 'gi');
                return text.replace(regex, '<span class="search-highlight">$1</span>');
            };
            
            card.innerHTML = `
                <div class="flex justify-between items-start mb-3">
                    <span class="text-xs text-gray-500 font-medium">#${radical.id}</span>
                    <button onclick="toggleFavorite(${radical.id})" class="text-lg hover:scale-110 transition-transform">
                        ${isFavorite ? '❤️' : '🤍'}
                    </button>
                </div>
                <div class="text-center mb-3">
                    <div class="chinese-font text-3xl mb-2 text-gray-800">${radical.character}</div>
                    <div class="text-sm font-medium text-gray-700">${highlightText(radical.meaning, query)}</div>
                    <div class="text-xs text-gray-500">${highlightText(radical.pinyin, query)}</div>
                </div>
                <div class="text-xs text-gray-600">
                    <div class="mb-1"><strong>Categoria:</strong> ${highlightText(radical.category, query)}</div>
                    <div class="mb-1"><strong>Tratti:</strong> ${radical.strokes}</div>
                    <div><strong>Esempi:</strong> ${radical.examples.map(ex => highlightText(ex, query)).join(', ')}</div>
                </div>
            `;
            
            card.addEventListener('click', () => showRadicalDetail(radical));
            return card;
        }

                        <button onclick="toggleFavorite(${radical.id})" class="text-2xl hover:scale-110 transition-transform">
                            ${isFavorite ? '❤️' : '🤍'}

                    </div>
                    <div class="text-lg text-gray-600 mb-2">${radical.pinyin}</div>
                    <div class="inline-block bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm font-medium">

                    </div>

        function closeModal() {
            const modal = document.getElementById('radicalModal');

        // Toggle favorite
        function toggleFavorite(radicalId) {
            const index = favorites.indexOf(radicalId);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(radicalId);
            }
            
            localStorage.setItem('radicalFavorites', JSON.stringify(favorites));
            
            // Update displays
            displayRadicals();
            updateFavoritesList();
            
            // Update search results if search is active
            const searchInput = document.getElementById('searchInput');
            if (searchInput.value) {
                performSearch();
            }
        }

        // Update favorites list
        function updateFavoritesList() {
            const container = document.getElementById('favoritesList');
            
            if (favorites.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-gray-500 col-span-full py-8">
                        <div class="text-4xl mb-2">💝</div>
                        <p>Nessun radicale nei preferiti ancora</p>
                        <p class="text-sm">Clicca sul cuore per aggiungere radicali ai preferiti</p>
                    </div>
                `;
                return;
            }
            
            const favoriteRadicals = radicals.filter(r => favorites.includes(r.id));
            container.innerHTML = '';
            
            favoriteRadicals.forEach(radical => {
                const card = createRadicalCard(radical);
                container.appendChild(card);

        // Start quiz
        function startQuiz(type) {
            currentQuiz = {
                type: type,
                questions: generateQuizQuestions(type),
                currentQuestion: 0,
                score: 0
            };
            
            showQuizQuestion();
        }

        // Generate quiz questions
        function generateQuizQuestions(type) {
            const shuffled = [...radicals].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, 10).map(radical => {
                const options = generateOptions(radical, type);
                return {
                    radical: radical,
                    options: options,
                    correct: type === 'meaning' ? radical.meaning : radical.character
                };
            });
        }

        // Generate quiz options
        function generateOptions(correct, type) {
            const options = [type === 'meaning' ? correct.meaning : correct.character];
            const otherRadicals = radicals.filter(r => r.id !== correct.id);
            
            while (options.length < 4) {
                const random = otherRadicals[Math.floor(Math.random() * otherRadicals.length)];
                const option = type === 'meaning' ? random.meaning : random.character;
                if (!options.includes(option)) {
                    options.push(option);
                }
            }
            
            return options.sort(() => 0.5 - Math.random());
        }

        // Show quiz question
        function showQuizQuestion() {
            const container = document.getElementById('quizContainer');
            const question = currentQuiz.questions[currentQuiz.currentQuestion];
            
            container.classList.remove('hidden');
            container.innerHTML = `
                <div class="text-center mb-6">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-sm text-gray-500">Domanda ${currentQuiz.currentQuestion + 1} di ${currentQuiz.questions.length}</span>
                        <span class="text-sm text-blue-600 font-medium">Punteggio: ${currentQuiz.score}/${currentQuiz.questions.length}</span>
                    </div>
                    
                    <div class="mb-6">
                        ${currentQuiz.type === 'meaning' ? `
                            <div class="chinese-font text-5xl mb-4 text-gray-800">${question.radical.character}</div>
                            <p class="text-lg text-gray-700">Qual è il significato di questo radicale?</p>
                        ` : `
                            <p class="text-lg text-gray-700 mb-4">Quale radicale significa "${question.radical.meaning}"?</p>
                        `}
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3">
                        ${question.options.map((option, index) => `
                            <button onclick="selectAnswer('${option}')" 
                                    class="quiz-option p-4 border-2 border-gray-200 rounded-lg hover:border-blue-300 hover:bg-blue-50 transition-all">
                                ${currentQuiz.type === 'meaning' ? option : `<span class="chinese-font text-2xl">${option}</span>`}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // Select quiz answer
        function selectAnswer(answer) {
            const question = currentQuiz.questions[currentQuiz.currentQuestion];
            const isCorrect = answer === question.correct;
            
            if (isCorrect) {
                currentQuiz.score++;
            }
            
            // Show feedback
            const buttons = document.querySelectorAll('.quiz-option');
            buttons.forEach(btn => {
                btn.disabled = true;
                if (btn.textContent.trim() === question.correct || 
                    (currentQuiz.type === 'character' && btn.querySelector('.chinese-font')?.textContent === question.correct)) {
                    btn.classList.add('bg-green-100', 'border-green-500', 'text-green-800');
                } else if (btn.textContent.trim() === answer || 
                          (currentQuiz.type === 'character' && btn.querySelector('.chinese-font')?.textContent === answer)) {
                    if (!isCorrect) {
                        btn.classList.add('bg-red-100', 'border-red-500', 'text-red-800');
                    }
                }
            });
            
            // Continue to next question after delay
            setTimeout(() => {
                currentQuiz.currentQuestion++;
                if (currentQuiz.currentQuestion < currentQuiz.questions.length) {
                    showQuizQuestion();
                } else {
                    showQuizResults();
                }
            }, 1500);
        }

        // Show quiz results
        function showQuizResults() {
            const container = document.getElementById('quizContainer');
            const percentage = Math.round((currentQuiz.score / currentQuiz.questions.length) * 100);
            
            let message = '';
            let emoji = '';
            if (percentage >= 90) {
                message = 'Eccellente! Sei un esperto di radicali!';
                emoji = '🏆';
            } else if (percentage >= 70) {
                message = 'Molto bene! Continua così!';
                emoji = '🎉';
            } else if (percentage >= 50) {
                message = 'Buon lavoro! C\'è ancora spazio per migliorare.';
                emoji = '👍';
            } else {
                message = 'Continua a studiare, migliorerai!';
                emoji = '💪';
            }
            
            container.innerHTML = `
                <div class="text-center">
                    <div class="text-6xl mb-4">${emoji}</div>
                    <h3 class="text-2xl font-bold text-gray-800 mb-2">Quiz Completato!</h3>
                    <p class="text-lg text-gray-600 mb-4">${message}</p>
                    
                    <div class="bg-blue-50 rounded-lg p-6 mb-6">
                        <div class="text-3xl font-bold text-blue-600 mb-2">${currentQuiz.score}/${currentQuiz.questions.length}</div>
                        <div class="text-lg text-blue-800">${percentage}% Corretto</div>
                    </div>
                    
                    <div class="space-x-4">
                        <button onclick="startQuiz(currentQuiz.type)"

                        <button onclick="document.getElementById('quizContainer').classList.add('hidden')"

                            Chiudi
                        </button>
                    </div>
                </div>
            `;
        }

        // Close modal when clicking outside
        document.getElementById('radicalModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
