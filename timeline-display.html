<!doctype html>
<html lang="it">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline Eventi - Cinese</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: white;
      font-size: 2.5rem;
      margin-bottom: 50px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    .timeline {
      position: relative;
      padding: 20px 0;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 100%;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
    }

    .timeline-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 50px;
      position: relative;
    }

    .timeline-item:nth-child(odd) .timeline-content {
      margin-left: auto;
    }

    .timeline-content {
      width: 45%;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .timeline-content:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    }

    .timeline-dot {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: white;
      border: 4px solid #667eea;
      z-index: 1;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2);
    }

    .event-date {
      display: inline-block;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .event-title {
      font-size: 1.5rem;
      color: #333;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .event-description {
      color: #666;
      line-height: 1.6;
      font-size: 1rem;
    }

    .category-badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 10px;
      text-transform: uppercase;
    }

    .category-esercizi {
      background: #a29bfe;
      color: #6c5ce7;
    }

    .category-giochi {
      background: #ffeaa7;
      color: #fdcb6e;
    }

    .category-video {
      background: #ff7675;
      color: #d63031;
    }

    .category-vocabolario {
      background: #55efc4;
      color: #00b894;
    }

    .category-grammatica {
      background: #74b9ff;
      color: #0984e3;
    }

    .category-app {
      background: #fd79a8;
      color: #e84393;
    }

    .event-link {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-decoration: none;
      border-radius: 25px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }

    .event-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    .empty-state {
      text-align: center;
      color: white;
      font-size: 1.2rem;
      padding: 60px 20px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      backdrop-filter: blur(10px);
    }

    .empty-state p {
      margin-bottom: 15px;
    }

    @media (max-width: 768px) {
      .timeline::before {
        left: 30px;
      }

      .timeline-dot {
        left: 30px;
      }

      .timeline-item {
        flex-direction: column;
        align-items: flex-start;
        padding-left: 60px;
      }

      .timeline-content {
        width: 100%;
        margin-left: 0 !important;
      }

      h1 {
        font-size: 2rem;
      }
    }

    .loading {
      text-align: center;
      color: white;
      font-size: 1.2rem;
      padding: 40px;
    }

    .error {
      text-align: center;
      color: white;
      background: rgba(231, 76, 60, 0.3);
      padding: 20px;
      border-radius: 10px;
      margin: 20px 0;
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="/_sdk/element_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
 </head>
 <body>
  <div class="container">
   <h1>📚 Timeline Eventi Cinese</h1>
   <div id="loading" class="loading">
    ⏳ Caricamento eventi...
   </div>
   <div id="error" class="error" style="display:none;">
    ❌ Errore nel caricamento. Verifica che il file events.json sia presente.
   </div>
   <div id="emptyState" class="empty-state" style="display:none;">
    <p>📭 Nessun evento presente</p>
    <p>Aggiungi eventi nel file events.json</p>
   </div>
   <div id="timeline" class="timeline" style="display:none;"></div>
  </div>
  <script>
    async function loadEvents() {
      const loadingEl = document.getElementById('loading');
      const errorEl = document.getElementById('error');
      const timelineEl = document.getElementById('timeline');
      const emptyStateEl = document.getElementById('emptyState');

      try {
        // Carica il file JSON
        const response = await fetch('events.json');

        if (!response.ok) {
          throw new Error('File non trovato');
        }

        const events = await response.json();

        loadingEl.style.display = 'none';

        if (events.length === 0) {
          emptyStateEl.style.display = 'block';
          return;
        }

        // Ordina gli eventi per data (dal più recente al più vecchio)
        events.sort((a, b) => new Date(b.date) - new Date(a.date));

        // Mostra la timeline
        timelineEl.style.display = 'block';

        // Genera HTML per ogni evento
        events.forEach(event => {
          const item = document.createElement('div');
          item.className = 'timeline-item';

          const formattedDate = new Date(event.date + 'T00:00:00').toLocaleDateString('it-IT', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
          });

          const linkButton = event.link ? `<a href="${escapeHtml(event.link)}" target="_blank" rel="noopener noreferrer" class="event-link">🔗 Approfondisci</a>` : '';

          item.innerHTML = `
            <div class="timeline-content">
              <span class="event-date">${formattedDate}</span>
              <h3 class="event-title">${escapeHtml(event.title)}</h3>
              <p class="event-description">${escapeHtml(event.description)}</p>
              <span class="category-badge category-${event.category}">${getCategoryLabel(event.category)}</span>
              ${linkButton}
            </div>
            <div class="timeline-dot"></div>
          `;

          timelineEl.appendChild(item);
        });

      } catch (error) {
        console.error('Errore:', error);
        loadingEl.style.display = 'none';
        errorEl.style.display = 'block';
      }
    }

    function getCategoryLabel(category) {
      const labels = {
        'esercizi': '📝 Esercizi',
        'giochi': '🎮 Giochi',
        'video': '🎬 Video',
        'vocabolario': '📖 Vocabolario',
        'grammatica': '✍️ Grammatica',
         'pdf': '📚 Pdf',
        'app': '📱 App',
         'flashcards': '🎴 Flashcards'
      };
      return labels[category] || category;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Carica gli eventi quando la pagina è pronta
    loadEvents();
  </script>
