<!doctype html>
<html lang="it">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    body {
      box-sizing: border-box;
    }
    * {
      font-family: 'Outfit', sans-serif;
    }
    .timeline-line {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 100%;
      background: linear-gradient(180deg, #6366f1 0%, #1e293b 100%);
    }
    @media (max-width: 768px) {
      .timeline-line {
        left: 20px;
      }
    }
    .timeline-item {
      animation: slideIn 0.5s ease-out forwards;
      opacity: 0;
    }
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .timeline-dot {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #6366f1;
      border: 3px solid #0f172a;
      z-index: 10;
    }
    @media (max-width: 768px) {
      .timeline-dot {
        left: 20px;
      }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="/_sdk/element_sdk.js" type="text/javascript"></script>
 </head>
 <body class="min-h-screen bg-slate-900">
  <div id="app" class="min-h-screen p-6 md:p-8"><!-- Timeline Container -->
   <div class="max-w-4xl mx-auto relative">
    <div class="timeline-line"></div>
    <div id="timeline-container" class="relative"><!-- Events will be rendered here -->
    </div>
   </div><!-- Empty State -->
   <div id="empty-state" class="text-center py-16 hidden">
    <div class="text-5xl mb-3">
     📅
    </div>
    <p class="text-lg text-slate-400">Nessun evento da visualizzare</p>
   </div>
  </div>
  <script>
    let timelineData = [];

    // Load data from localStorage
    function loadData() {
      const stored = localStorage.getItem('timeline_events');
      if (stored) {
        try {
          timelineData = JSON.parse(stored);
        } catch (e) {
          timelineData = [];
        }
      }
      renderTimeline();
    }

    // Format date for display
    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    // Render timeline
    function renderTimeline() {
      const container = document.getElementById('timeline-container');
      const emptyState = document.getElementById('empty-state');

      if (timelineData.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      // Sort by date descending
      const sorted = [...timelineData].sort((a, b) => new Date(b.date) - new Date(a.date));

      container.innerHTML = sorted.map((event, index) => {
        const isLeft = index % 2 === 0;
        return `
          <div class="timeline-item relative mb-8 md:mb-12" style="animation-delay: ${index * 0.1}s">
            <div class="timeline-dot top-6"></div>
            <div class="md:w-5/12 ${isLeft ? 'md:mr-auto md:pr-8' : 'md:ml-auto md:pl-8'} pl-12 md:pl-0">
              <div class="bg-slate-800 rounded-2xl p-5 shadow-lg">
                <div class="flex items-center gap-3 mb-3">
                  <span class="text-3xl">${event.icon || '📅'}</span>
                  <div>
                    <h3 class="font-bold text-lg text-slate-50">${event.title}</h3>
                    <p class="text-sm text-slate-400">${formatDate(event.date)}</p>
                  </div>
                </div>
                ${event.description ? `<p class="text-slate-300 text-sm leading-relaxed">${event.description}</p>` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Auto-refresh every 5 seconds to catch updates from admin panel
    setInterval(loadData, 5000);

    // Initialize
    loadData();
  </script>

</html>
