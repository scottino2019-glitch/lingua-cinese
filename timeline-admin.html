<!doctype html>
<html lang="it">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline Admin - Gestione Eventi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    body {
      box-sizing: border-box;
    }
    * {
      font-family: 'Outfit', sans-serif;
    }
    .timeline-line {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 100%;
      background: linear-gradient(180deg, #6366f1 0%, #1e293b 100%);
    }
    @media (max-width: 768px) {
      .timeline-line {
        left: 20px;
      }
    }
    .timeline-item {
      animation: slideIn 0.5s ease-out forwards;
      opacity: 0;
    }
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .timeline-dot {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #6366f1;
      border: 3px solid #0f172a;
      z-index: 10;
    }
    @media (max-width: 768px) {
      .timeline-dot {
        left: 20px;
      }
    }
    .icon-btn {
      transition: all 0.2s ease;
    }
    .icon-btn:hover {
      transform: scale(1.1);
    }
    .modal-overlay {
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="/_sdk/element_sdk.js" type="text/javascript"></script>
 </head>
 <body class="min-h-screen bg-slate-900">
  <div id="app" class="min-h-screen p-6 md:p-10"><!-- Header -->
   <header class="text-center mb-12">
    <h1 class="text-4xl md:text-5xl font-bold mb-3 text-slate-50">Gestione Timeline</h1>
    <p class="text-lg text-slate-400">Aggiungi e gestisci i tuoi eventi</p>
   </header><!-- Add Event Button -->
   <div class="flex justify-center mb-10"><button id="add-btn" onclick="openModal()" class="flex items-center gap-3 px-6 py-3 rounded-full font-semibold text-lg bg-indigo-500 text-slate-900 transition-all hover:scale-105 hover:shadow-lg">
     <svg width="24" height="24" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line> <line x1="5" y1="12" x2="19" y2="12"></line>
     </svg> Aggiungi Evento </button>
   </div><!-- Timeline Container -->
   <div class="max-w-4xl mx-auto relative">
    <div class="timeline-line"></div>
    <div id="timeline-container" class="relative"><!-- Events will be rendered here -->
    </div>
   </div><!-- Empty State -->
   <div id="empty-state" class="text-center py-20">
    <div class="text-6xl mb-4">
     📅
    </div>
    <p class="text-xl text-slate-400">Nessun evento ancora. Inizia aggiungendo il primo!</p>
   </div>
  </div><!-- Modal -->
  <div id="modal" class="fixed inset-0 z-50 hidden">
   <div class="modal-overlay absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeModal()"></div>
   <div class="absolute inset-0 flex items-center justify-center p-4 pointer-events-none">
    <div class="pointer-events-auto w-full max-w-md bg-slate-800 rounded-2xl p-6 shadow-2xl">
     <h2 id="modal-title" class="text-2xl font-bold mb-6 text-slate-50">Nuovo Evento</h2>
     <form id="event-form" onsubmit="handleSubmit(event)">
      <div class="space-y-4">
       <div><label for="event-title" class="block text-sm font-medium mb-2 text-slate-50">Titolo *</label> <input type="text" id="event-title" required class="w-full px-4 py-3 rounded-xl border-2 border-slate-600 bg-slate-900 text-slate-50 focus:outline-none focus:border-indigo-500 transition-colors" placeholder="Es: Lancio del progetto">
       </div>
       <div><label for="event-date" class="block text-sm font-medium mb-2 text-slate-50">Data *</label> <input type="date" id="event-date" required class="w-full px-4 py-3 rounded-xl border-2 border-slate-600 bg-slate-900 text-slate-50 focus:outline-none focus:border-indigo-500 transition-colors">
       </div>
       <div><label for="event-description" class="block text-sm font-medium mb-2 text-slate-50">Descrizione</label> <textarea id="event-description" rows="3" class="w-full px-4 py-3 rounded-xl border-2 border-slate-600 bg-slate-900 text-slate-50 focus:outline-none focus:border-indigo-500 transition-colors resize-none" placeholder="Descrivi l'evento..."></textarea>
       </div>
       <div><label class="block text-sm font-medium mb-2 text-slate-50">Icona</label>
        <div id="icon-picker" class="flex flex-wrap gap-2"><!-- Icons will be rendered here -->
        </div>
       </div>
      </div>
      <div class="flex gap-3 mt-6"><button type="button" onclick="closeModal()" class="flex-1 px-4 py-3 rounded-xl font-semibold border-2 border-slate-600 text-slate-400 hover:bg-slate-700 transition-colors"> Annulla </button> <button type="submit" id="submit-btn" class="flex-1 px-4 py-3 rounded-xl font-semibold bg-indigo-500 text-slate-900 hover:bg-indigo-600 transition-all"> Salva </button>
      </div>
     </form>
    </div>
   </div>
  </div><!-- Delete Confirmation -->
  <div id="delete-confirm" class="fixed inset-0 z-50 hidden">
   <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="cancelDelete()"></div>
   <div class="absolute inset-0 flex items-center justify-center p-4 pointer-events-none">
    <div class="pointer-events-auto w-full max-w-sm bg-slate-800 rounded-2xl p-6 shadow-2xl text-center">
     <div class="text-5xl mb-4">
      🗑️
     </div>
     <h3 class="text-xl font-bold mb-2 text-slate-50">Eliminare questo evento?</h3>
     <p class="text-slate-400 mb-6">Questa azione non può essere annullata.</p>
     <div class="flex gap-3"><button onclick="cancelDelete()" class="flex-1 px-4 py-3 rounded-xl font-semibold border-2 border-slate-600 text-slate-400 hover:bg-slate-700 transition-colors"> Annulla </button> <button onclick="confirmDelete()" class="flex-1 px-4 py-3 rounded-xl font-semibold bg-red-500 text-white hover:bg-red-600 transition-colors"> Elimina </button>
     </div>
    </div>
   </div>
  </div><!-- Toast -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full font-medium shadow-lg bg-indigo-500 text-slate-900 transition-all duration-300 opacity-0 translate-y-4 pointer-events-none"><span id="toast-message"></span>
  </div>
  <script>
    const icons = ['🚀', '💡', '🎯', '📌', '⭐', '🏆', '📅', '💼', '🎓', '❤️', '🔥', '✨'];
    let selectedIcon = '🚀';
    let editingEvent = null;
    let deleteTarget = null;
    let timelineData = [];

    // Load data from localStorage
    function loadData() {
      const stored = localStorage.getItem('timeline_events');
      if (stored) {
        try {
          timelineData = JSON.parse(stored);
        } catch (e) {
          timelineData = [];
        }
      }
      renderTimeline();
    }

    // Save data to localStorage
    function saveData() {
      localStorage.setItem('timeline_events', JSON.stringify(timelineData));
    }

    // Render icon picker
    function renderIconPicker() {
      const picker = document.getElementById('icon-picker');
      picker.innerHTML = icons.map(icon => `
        <button type="button" onclick="selectIcon('${icon}')" 
          class="w-10 h-10 rounded-lg text-xl flex items-center justify-center bg-slate-900 transition-all ${selectedIcon === icon ? 'ring-2 ring-indigo-500 scale-110' : 'opacity-60 hover:opacity-100'}">
          ${icon}
        </button>
      `).join('');
    }

    function selectIcon(icon) {
      selectedIcon = icon;
      renderIconPicker();
    }

    // Format date for display
    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    // Render timeline
    function renderTimeline() {
      const container = document.getElementById('timeline-container');
      const emptyState = document.getElementById('empty-state');

      if (timelineData.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      // Sort by date descending
      const sorted = [...timelineData].sort((a, b) => new Date(b.date) - new Date(a.date));

      container.innerHTML = sorted.map((event, index) => {
        const isLeft = index % 2 === 0;
        return `
          <div class="timeline-item relative mb-8 md:mb-12" style="animation-delay: ${index * 0.1}s" data-id="${event.id}">
            <div class="timeline-dot top-6"></div>
            <div class="md:w-5/12 ${isLeft ? 'md:mr-auto md:pr-8' : 'md:ml-auto md:pl-8'} pl-12 md:pl-0">
              <div class="bg-slate-800 rounded-2xl p-5 shadow-lg transition-transform hover:scale-[1.02]">
                <div class="flex items-start justify-between gap-3 mb-3">
                  <div class="flex items-center gap-3">
                    <span class="text-3xl">${event.icon || '📅'}</span>
                    <div>
                      <h3 class="font-bold text-lg text-slate-50">${event.title}</h3>
                      <p class="text-sm text-slate-400">${formatDate(event.date)}</p>
                    </div>
                  </div>
                  <div class="flex gap-1">
                    <button onclick="editEvent('${event.id}')" class="icon-btn p-2 rounded-lg text-slate-500 hover:text-slate-300">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                      </svg>
                    </button>
                    <button onclick="requestDelete('${event.id}')" class="icon-btn p-2 rounded-lg text-slate-500 hover:text-red-400">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                      </svg>
                    </button>
                  </div>
                </div>
                ${event.description ? `<p class="text-slate-300 text-sm leading-relaxed">${event.description}</p>` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Modal functions
    function openModal(event = null) {
      editingEvent = event;
      const modal = document.getElementById('modal');
      const form = document.getElementById('event-form');
      const modalTitle = document.getElementById('modal-title');

      if (event) {
        modalTitle.textContent = 'Modifica Evento';
        document.getElementById('event-title').value = event.title;
        document.getElementById('event-date').value = event.date;
        document.getElementById('event-description').value = event.description || '';
        selectedIcon = event.icon || '🚀';
      } else {
        modalTitle.textContent = 'Nuovo Evento';
        form.reset();
        selectedIcon = '🚀';
      }

      renderIconPicker();
      modal.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
      editingEvent = null;
    }

    function editEvent(id) {
      const event = timelineData.find(e => e.id === id);
      if (event) openModal(event);
    }

    // Delete functions
    function requestDelete(id) {
      deleteTarget = timelineData.find(e => e.id === id);
      if (deleteTarget) {
        document.getElementById('delete-confirm').classList.remove('hidden');
      }
    }

    function cancelDelete() {
      document.getElementById('delete-confirm').classList.add('hidden');
      deleteTarget = null;
    }

    function confirmDelete() {
      if (!deleteTarget) return;
      
      timelineData = timelineData.filter(e => e.id !== deleteTarget.id);
      saveData();
      renderTimeline();
      showToast('Evento eliminato');
      cancelDelete();
    }

    // Form submission
    function handleSubmit(e) {
      e.preventDefault();

      const eventData = {
        id: editingEvent ? editingEvent.id : Date.now().toString(),
        title: document.getElementById('event-title').value.trim(),
        date: document.getElementById('event-date').value,
        description: document.getElementById('event-description').value.trim(),
        icon: selectedIcon,
        created_at: new Date().toISOString()
      };

      if (editingEvent) {
        const index = timelineData.findIndex(e => e.id === editingEvent.id);
        if (index !== -1) {
          timelineData[index] = eventData;
        }
        showToast('Evento aggiornato');
      } else {
        timelineData.push(eventData);
        showToast('Evento aggiunto');
      }

      saveData();
      renderTimeline();
      closeModal();
    }

    // Toast notification
    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastMessage = document.getElementById('toast-message');
      toastMessage.textContent = message;
      toast.classList.remove('opacity-0', 'translate-y-4');
      
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-4');
      }, 2500);
    }

    // Initialize
    loadData();
  </script>
