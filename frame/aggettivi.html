<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Oriental Flashcards</title>
    <style>
        body { font-family: sans-serif; background: #f8f7f2; display: flex; flex-wrap: wrap; gap: 30px; padding: 40px; justify-content: center; }
        .card { width: 320px; height: 450px; position: relative; cursor: pointer; perspective: 1000px; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .side { 
          position: absolute; width: 100%; height: 100%; backface-visibility: hidden; 
          display: flex; flex-direction: column; align-items: center; justify-content: center; 
          padding: 30px; box-sizing: border-box; border: 4px solid black; border-radius: 8px;
          box-shadow: 8px 8px 0px 0px rgba(0,0,0,1);
        }
        .front { background: var(--bg); color: var(--text); }
        .back { background: #ffffff; color: #000000; transform: rotateY(180deg); }
        .emoji { position: absolute; top: 20px; left: 20px; font-size: 40px; }
        .topic { position: absolute; top: 0; right: 0; background: black; color: white; padding: 5px 15px; font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.15em; }
        .word { font-size: 4rem; font-weight: 900; line-height: 1.1; text-align: center; }
        .vertical .content { writing-mode: vertical-rl; height: 250px; display: flex; align-items: center; justify-content: center; }
        .pronunciation { font-size: 1.2rem; font-weight: bold; opacity: 0.7; margin-bottom: 15px; letter-spacing: 0.2em; text-transform: uppercase; }
        .vertical .pronunciation { writing-mode: horizontal-tb; margin-bottom: 0; margin-left: 15px; }
        .definition { font-size: 2.5rem; font-weight: 900; font-style: italic; text-align: center; line-height: 1.3; }
        
        .speak-btn {
          position: absolute; top: 20px; right: 20px; background: white; border: 2px solid black;
          width: 40px; height: 40px; border-radius: 8px; cursor: pointer; display: flex;
          align-items: center; justify-content: center; box-shadow: 3px 3px 0px 0px black;
          transition: all 0.1s; z-index: 20;
        }
        .speak-btn:active { transform: translate(2px, 2px); box-shadow: none; }
        
        @media print { .card { break-inside: avoid; } .speak-btn { display: none; } }
    </style>
</head>
<body>
    
      <div class="card " style="--bg: #fee2e2; --text: #991b1b">
        <div class="card-inner" onclick="this.parentElement.classList.toggle('flipped')">

            <div class="topic">Ambiente</div>
            <div class="emoji">🌬️</div>
            <button class="speak-btn" onclick="event.stopPropagation(); speak('通风的', 'zh-CN')">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
            </button>
            <div class="content">
              <div class="pronunciation">tōngfēng de</div>
              <div class="word">通风的</div>
            </div>
          </div>
          <div class="side back">
            <div class="definition">ariosa</div>
          </div>
        </div>
      </div>

    <script>
      function speak(text, lang) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        window.speechSynthesis.speak(utterance);
      }
    </script>
