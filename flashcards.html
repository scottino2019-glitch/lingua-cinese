<!doctype html>
<html lang="it">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcard Ideogrammi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&amp;family=Quicksand:wght@500;700&amp;display=swap" rel="stylesheet">
  <style>
    body { box-sizing: border-box; }
    *, *::before, *::after { box-sizing: inherit; }
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; }

    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #f1c40f 0%, #e74c3c 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .flashcard-container {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem; position: relative;
    }

    .header-section {
      display: flex; flex-direction: column; 
      align-items: center; margin-bottom: 2rem;
    }

    .title {
      font-size: 2.5rem; font-weight: 700; color: white;
      margin-bottom: 1rem; text-align: center;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    /* Stile per il menu a tendina dei gruppi */
    .group-select {
      padding: 0.8rem 1.5rem; font-size: 1.1rem;
      font-family: 'Quicksand', sans-serif; font-weight: 700;
      color: #2d3436; background: rgba(255, 255, 255, 0.95);
      border: none; border-radius: 30px; cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      outline: none; text-align: center;
      transition: transform 0.2s ease;
    }
    .group-select:hover { transform: scale(1.05); }

    .card-wrapper {
      perspective: 1000px; width: 100%;
      max-width: 500px; height: 400px; margin-bottom: 2rem;
    }

    .card {
      width: 100%; height: 100%; position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
      cursor: pointer;
    }

    .card.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute; width: 100%; height: 100%;
      backface-visibility: hidden; border-radius: 20px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }

    .card-front { background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%); }
    .card-back { 
      background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
      transform: rotateY(180deg); 
    }

    .ideogram {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 8rem; font-weight: 700; color: #2d3436;
    }

    .pinyin {
      font-size: 2rem; color: #2d3436; font-weight: 700;
      margin-bottom: 1rem; letter-spacing: 0.05em;
    }

    .explanation {
      font-size: 1.5rem; color: #2d3436; text-align: center;
      line-height: 1.4; font-weight: 500;
    }

    .audio-btn {
      background: #667eea; color: white; border: none;
      padding: 10px 20px; border-radius: 50px;
      margin-top: 15px; cursor: pointer; font-weight: bold;
      transition: transform 0.2s; z-index: 10;
    }
    .audio-btn:hover { transform: scale(1.1); background: #5a6fd6; }

    .flip-hint { font-size: 0.9rem; color: #636e72; margin-top: 15px; opacity: 0.6; }

    .controls { display: flex; gap: 2rem; align-items: center; }

    .nav-button {
      background: rgba(255, 255, 255, 0.95); border: none;
      width: 60px; height: 60px; border-radius: 50%;
      font-size: 1.8rem; color: #667eea; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .nav-button:disabled { opacity: 0.3; cursor: not-allowed; }

    .counter {
      font-size: 1.3rem; font-weight: 700; color: #ffffff;
      background: rgba(255, 255, 255, 0.2); padding: 0.8rem 2rem;
      border-radius: 30px; backdrop-filter: blur(10px);
    }

    .error { color: #ff6b6b; background: white; padding: 2rem; border-radius: 15px; text-align: center; }
  </style>
 </head>
 <body>

  <main class="flashcard-container">
   <div class="header-section">
     <h1 class="title">Flashcard Cinese</h1>
     <select id="group-select" class="group-select" style="display: none;"></select>
   </div>
   <div id="content">Caricamento...</div>
  </main>

  <script>
    let allData = {};       // Conterrà tutto il JSON raggruppato
    let flashcards = [];    // Conterrà solo le carte del gruppo selezionato
    let currentIndex = 0;
    let isFlipped = false;

    // Funzione per parlare
    function speak(text, lang) {
      window.speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(text);
      msg.lang = lang;
      msg.rate = 0.8;
      window.speechSynthesis.speak(msg);
    }

    async function loadFlashcards() {
      try {
        const response = await fetch('flashcards.json');
        if (!response.ok) throw new Error(`Errore: ${response.status}`);
        
        allData = await response.json();
        const groupSelect = document.getElementById('group-select');
        
        // Popola il menu a tendina con le chiavi del JSON
        for (const groupName in allData) {
          const option = document.createElement('option');
          option.value = groupName;
          option.textContent = groupName;
          groupSelect.appendChild(option);
        }

        // Mostra il selettore e imposta il primo gruppo come attivo
        groupSelect.style.display = 'block';
        const initialGroup = Object.keys(allData)[0];
        flashcards = allData[initialGroup];

        // Event listener per quando l'utente cambia gruppo
        groupSelect.addEventListener('change', (e) => {
          const selectedGroup = e.target.value;
          flashcards = allData[selectedGroup];
          currentIndex = 0;   // Resetta l'indice per il nuovo gruppo
          isFlipped = false;
          renderFlashcards();
        });

        renderFlashcards();

      } catch (error) {
        document.getElementById('content').innerHTML = `
          <div class="error">
            <strong>⚠️ Errore</strong><br>${error.message}<br>
            Controlla che il file flashcards.json sia formattato correttamente.
          </div>`;
      }
    }

    function renderFlashcards() {
      const content = document.getElementById('content');
      
      if (!flashcards || flashcards.length === 0) {
        content.innerHTML = `<div class="error">Nessuna flashcard presente in questo gruppo.</div>`;
        return;
      }

      content.innerHTML = `
        <div class="card-wrapper">
          <div class="card" id="card">
            <div class="card-face card-front">
              <div class="ideogram">${flashcards[currentIndex].ideogramma}</div>
              <button class="audio-btn" id="btn-audio-zh">Ascolta 🔊</button>
              <div class="flip-hint">Clicca la carta per girare</div>
            </div>
            <div class="card-face card-back">
              <div class="pinyin">${flashcards[currentIndex].pinyin}</div>
              <div class="explanation">${flashcards[currentIndex].spiegazione}</div>
              <button class="audio-btn" id="btn-audio-it">Ascolta 🔊</button>
            </div>
          </div>
        </div>

        <div class="controls">
          <button class="nav-button" id="prevBtn" title="Precedente">←</button>
          <div class="counter" id="counter">${currentIndex + 1} / ${flashcards.length}</div>
          <button class="nav-button" id="nextBtn" title="Successiva">→</button>
        </div>
      `;

      // Gestione del click per ruotare la carta
      document.getElementById('card').onclick = (e) => {
        if (!e.target.classList.contains('audio-btn')) {
          isFlipped = !isFlipped;
          document.getElementById('card').classList.toggle('flipped');
        }
      };

      // Gestione audio
      document.getElementById('btn-audio-zh').onclick = () => speak(flashcards[currentIndex].ideogramma, 'zh-CN');
      document.getElementById('btn-audio-it').onclick = () => speak(flashcards[currentIndex].spiegazione, 'it-IT');
      
      // Gestione navigazione
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      
      prevBtn.onclick = previousCard;
      nextBtn.onclick = nextCard;

      // Disabilita i bottoni quando siamo agli estremi
      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === flashcards.length - 1;
    }

    function previousCard() {
      if (currentIndex > 0) {
        currentIndex--;
        isFlipped = false;
        renderFlashcards();
      }
    }

    function nextCard() {
      if (currentIndex < flashcards.length - 1) {
        currentIndex++;
        isFlipped = false;
        renderFlashcards();
      }
    }

    window.addEventListener('DOMContentLoaded', loadFlashcards);
  </script>
 </body>
</html>
