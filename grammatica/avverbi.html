<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manuale Tecnico Grammatica Cinese</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --slate-900: #0f172a;
            --slate-800: #1e293b;
            --slate-100: #f1f5f9;
            --indigo-600: #4f46e5;
            --blue-500: #3b82f6;
            --border: #e2e8f0;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            color: var(--slate-900);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Nav */
        nav {
            width: 300px;
            background: white;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            flex-shrink: 0;
        }

        .nav-header { font-weight: 700; font-size: 1.1rem; margin-bottom: 2rem; display: flex; align-items: center; gap: 10px; }
        
        .nav-item {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 0.5rem;
            transition: 0.2s;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--slate-800);
            border: 1px solid transparent;
        }

        .nav-item:hover { background: var(--slate-100); }
        .nav-item.active { background: #eff6ff; color: var(--blue-500); border-color: #dbeafe; }

        /* Main Content */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 3rem;
            background: white;
        }

        .content-wrapper { max-width: 750px; margin: 0 auto; }

        h1 { font-size: 2.25rem; margin-bottom: 1rem; letter-spacing: -0.02em; }
        h2 { font-size: 1.5rem; margin: 2rem 0 1rem; border-bottom: 2px solid var(--slate-100); padding-bottom: 0.5rem; }
        h3 { font-size: 1.1rem; margin: 1.5rem 0 0.75rem; color: var(--indigo-600); }

        p { margin-bottom: 1.25rem; line-height: 1.6; color: #475569; }

        /* Fix per tabelle che non tagliano il testo */
        .table-container { width: 100%; overflow-x: auto; margin: 1.5rem 0; }
        .tech-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            min-width: 500px; /* Impedisce il collasso eccessivo */
        }

        .tech-table th, .tech-table td {
            border: 1px solid var(--border);
            padding: 0.75rem;
            text-align: left;
            line-height: 1.5;
        }

        .tech-table th { background: var(--slate-100); font-weight: 600; }

        .code-block {
            background: var(--slate-900);
            color: #e2e8f0;
            padding: 1.25rem;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            margin: 1rem 0;
            overflow-x: auto;
            white-space: pre-wrap; /* Manda a capo il testo lungo nei blocchi neri */
        }

        .alert-error {
            background: #fff1f2;
            border-left: 4px solid #f43f5e;
            padding: 1rem;
            margin: 1.5rem 0;
            font-size: 0.9rem;
        }

        .check-list { list-style: none; margin-bottom: 1.5rem; }
        .check-list li { margin-bottom: 0.5rem; display: flex; align-items: flex-start; gap: 8px; font-size: 0.9rem; }
        .check-list i { color: var(--success); flex-shrink: 0; margin-top: 3px; }

        @media (max-width: 850px) {
            body { flex-direction: column; }
            nav { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
            main { padding: 1.5rem; }
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-header"><i data-lucide="languages"></i> Grammatica Cinese</div>
    <div id="nav-items"></div>
</nav>

<main id="content-area">
    <div class="content-wrapper" id="content"></div>
</main>

<script>
const documentation = [
    {
        id: "sezione-1",
        title: "1. Determinati di tempo e 一起",
        content: `
            <h1>I determinati di tempo con l'uso di 一起</h1>
            <p>Nella grammatica cinese, <strong>一起 (yìqǐ)</strong> è un avverbio che significa "insieme" e si usa per indicare che un'azione viene compiuta insieme ad altre persone. L'uso di 一起 per esprimere il tempo dipende dalla posizione nella frase e dal verbo che segue; infatti, 一起 precede sempre il verbo o la locuzione verbale.</p>
            
            <h3>La struttura tipica</h3>
            <div class="code-block">Soggetto + 一起 + verbo + oggetto</div>

            <div class="table-container">
                <table class="tech-table">
                    <tr><th>Esempi</th><th>Traduzione</th></tr>
                    <tr><td>我们一起学习中文 (Wǒmen yìqǐ xuéxí zhōngwén)</td><td>Noi studiamo cinese insieme.</td></tr>
                    <tr><td>他们一起去上大学 (Tāmen yìqǐ qù shàng dàxué)</td><td>Loro vanno all'università insieme.</td></tr>
                </table>
            </div>

            <p>Per indicare un'azione insieme nel tempo, 一起 si combina con gli avverbi o indicatori di tempo che di solito si posizionano all'inizio della frase o immediatamente prima del verbo principale, mantenendo l'ordine: <strong>avverbio di tempo + soggetto + 一起 + verbo</strong>.</p>

            <div class="alert-error">
                <strong>Nota sul tempo:</strong> In cinese i verbi non si coniugano. Si usano avverbi (ieri, oggi) o particelle come 了 (le) per indicare se l'azione è completata.
            </div>

            <h3>Riassunto Regole</h3>
            <ul class="check-list">
                <li><i data-lucide="check"></i> 一起 si mette sempre prima del verbo.</li>
                <li><i data-lucide="check"></i> Avverbio di tempo + soggetto + 一起 + verbo + oggetto.</li>
                <li><i data-lucide="check"></i> Il verbo non cambia forma.</li>
            </ul>
        `
    },
    {
        id: "sezione-2",
        title: "2. Posizionamento Avverbi",
        content: `
            <h1>Come posizionare avverbi di tempo con 一起</h1>
            <p>Gli avverbi di tempo in cinese generalmente si collocano precedendo il soggetto o immediatamente prima di 一起, mantenendo la struttura: <strong>Avverbio di tempo + soggetto + 一起 + verbo + oggetto</strong>.</p>
            
            <p>L'avverbio di tempo indica "quando" e si posiziona all'inizio della frase o prima di 一起 per specificare il momento dell'azione senza interrompere la relazione verbale con 一起. Non si mette mai l'avverbio di tempo tra 一起 e il verbo.</p>

            <h3>Esempi pratici: Ieri, Oggi, Domani</h3>
            <div class="table-container">
                <table class="tech-table">
                    <tr><th>Cinese + Pinyin</th><th>Traduzione</th></tr>
                    <tr><td>昨天我们一起去了电影院 (Zuótiān wǒmen yìqǐ qùle diànyǐngyuàn)</td><td>Ieri siamo andati insieme al cinema.</td></tr>
                    <tr><td>今天我们一起学习汉语 (Jīntiān wǒmen yìqǐ xuéxí hànyǔ)</td><td>Oggi studiamo cinese insieme.</td></tr>
                    <tr><td>明天我们一起去爬山 (Míngtiān wǒmen yìqǐ qù páshān)</td><td>Domani andremo insieme a fare escursioni.</td></tr>
                </table>
            </div>
        `
    },
    {
        id: "sezione-3",
        title: "3. Analisi Frase 明天晚上",
        content: `
            <h1>Analisi della proposta</h1>
            <p>Chiarimenti per la frase: <strong>"明天晚上我们一起去看电影好吗?"</strong> (Domani sera andiamo insieme a vedere un film, va bene?)</p>
            
            <ul class="check-list">
                <li><i data-lucide="clock"></i> <strong>明天晚上:</strong> "domani sera" (tempo all'inizio).</li>
                <li><i data-lucide="user"></i> <strong>我们:</strong> "noi" (soggetto).</li>
                <li><i data-lucide="users"></i> <strong>一起:</strong> "insieme" (avverbio prima del verbo).</li>
                <li><i data-lucide="play"></i> <strong>去看电影:</strong> "vedere un film" (azione).</li>
                <li><i data-lucide="help-circle"></i> <strong>好吗?:</strong> "va bene?" (proposta finale).</li>
            </ul>

            <h3>Glossario Avverbi di Tempo</h3>
            <div class="table-container">
                <table class="tech-table">
                    <tr><td>昨天 (ieri)</td><td>今天 (oggi)</td><td>明天 (domani)</td></tr>
                    <tr><td>现在 (adesso)</td><td>早上 (mattina)</td><td>晚上 (sera)</td></tr>
                    <tr><td>刚才 (poco fa)</td><td>已经 (già)</td><td>将来 (in futuro)</td></tr>
                </table>
            </div>

            <div class="alert-error">
                <strong>Regola di priorità:</strong> Se ci sono più avverbi di tempo, seguono un ordine logico dall'avverbio più generale a quello più specifico (es. Oggi -> Pomeriggio -> Ore 3).
            </div>
        `
    }
];

let activeId = documentation[0].id;

function init() {
    renderNav();
    renderContent();
}

function renderNav() {
    const nav = document.getElementById('nav-items');
    nav.innerHTML = '';
    documentation.forEach(item => {
        const div = document.createElement('div');
        div.className = `nav-item ${item.id === activeId ? 'active' : ''}`;
        div.innerText = item.title;
        div.onclick = () => {
            activeId = item.id;
            renderNav();
            renderContent();
        };
        nav.appendChild(div);
    });
}

function renderContent() {
    const container = document.getElementById('content');
    const data = documentation.find(d => d.id === activeId);
    container.innerHTML = data.content;
    lucide.createIcons();
    document.getElementById('content-area').scrollTop = 0;
}

init();
</script>

</body>
</html>
