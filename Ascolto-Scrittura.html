<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Ascolto - Versione Definitiva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap');
        body { font-family: 'Nunito', sans-serif; background-color: #f3f4f6; margin: 0; padding: 10px; }
        .manga-style { border: 3px solid #1f2937; border-radius: 16px; box-shadow: 4px 4px 0px #1f2937; }
        .manga-button { border: 2px solid #1f2937; box-shadow: 2px 2px 0px #1f2937; transition: all 0.1s; }
        .manga-button:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 0px 0px 0px #1f2937; }
        .manga-button:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center bg-purple-100">

    <div class="w-full max-w-xl mx-auto manga-style bg-white p-5">
        
        <div class="text-center mb-4">
            <h1 class="text-2xl font-black text-gray-800 uppercase">Ascolto Attivo</h1>
        </div>

        <!-- SELEZIONE VOCE MANUALE (Risolve il problema Android) -->
        <div class="mb-4 bg-blue-50 p-3 rounded-lg border-2 border-blue-200">
            <label class="text-xs font-bold text-blue-800 uppercase block mb-1"><i class="fas fa-volume-up"></i> 1. Scegli la voce del tuo telefono</label>
            <select id="languageSelect" class="w-full p-2 border border-blue-300 rounded font-bold text-sm bg-white"></select>
        </div>

        <!-- CARICAMENTO DATI -->
        <div class="mb-6 bg-yellow-50 p-3 rounded-lg border-2 border-yellow-200" id="setupArea">
            <label class="text-xs font-bold text-yellow-800 uppercase block mb-2"><i class="fas fa-file-code"></i> 2. Carica i Dati (JSON)</label>
            
            <!-- Opzione A: Fetch da Vercel -->
                    <!-- SELEZIONE LEZIONE (Per gli studenti) -->
        <div class="mb-6 bg-yellow-50 p-4 rounded-lg border-2 border-yellow-300" id="setupArea">
            <label class="text-sm font-black text-yellow-800 uppercase block mb-3"><i class="fas fa-book-open"></i> 2. Scegli la Lezione</label>
            
            <select id="lessonSelect" class="w-full p-3 border-2 border-yellow-400 rounded-lg font-bold text-gray-800 bg-white mb-4 manga-style focus:outline-none focus:ring-4 focus:ring-yellow-200">
                <option value="" disabled selected>-- Seleziona un argomento --</option>
                <option value="json/test_cinese.json">🇨🇳 Test Cinese (Vocabolario)</option>
                <option value="mulan.json">🇨🇳 Storia di Mulan</option>
                <option value="test_coreano.json">🇰🇷 Test Coreano (Basi)</option>
            </select>
            
            <button id="startLessonBtn" class="w-full manga-button bg-yellow-400 hover:bg-yellow-500 text-black font-black py-3 rounded-lg text-lg uppercase transition-colors hidden">
                Inizia Esercizio <i class="fas fa-play ml-2"></i>
            </button>
        </div>
            
            <!-- Opzione B: Upload dal telefono (Funziona sempre) -->
            <input id="jsonUpload" type="file" class="w-full text-xs font-bold text-gray-600 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-yellow-400 file:text-black manga-style p-1" accept=".json" />
        </div>

        <!-- STATUS BAR -->
        <div class="flex justify-between items-center mb-4 border-b-2 border-gray-200 pb-2">
            <div class="font-bold text-purple-600">Punti: <span id="scoreDisplay">0</span></div>
            <div class="font-bold text-gray-500 text-sm">Parola <span id="currentCount">0</span>/<span id="totalCount">0</span></div>
        </div>

        <!-- AREA ESERCIZIO -->
        <div id="exerciseArea" class="hidden flex-col items-center space-y-4 py-2">
            <button id="playBtn" class="manga-button w-20 h-20 rounded-full bg-blue-500 text-white text-3xl">
                <i class="fas fa-play"></i>
            </button>
            <div class="text-xs font-bold text-gray-500">Ascolti rimasti: <span id="listenBadge" class="text-pink-500 text-lg">3</span></div>
            
            <input type="text" id="answerInput" class="w-full manga-style p-3 text-lg font-bold text-center" placeholder="Scrivi in pinyin o caratteri..." autocomplete="off">
            <button id="checkBtn" class="w-full manga-button bg-green-500 text-white font-black py-3 rounded-lg text-lg uppercase">Controlla</button>
        </div>

        <!-- AREA RISULTATO -->
        <div id="resultArea" class="hidden flex-col items-center text-center space-y-3 py-2">
            <div id="resultIcon" class="text-5xl"></div>
            <h2 id="resultTitle" class="text-xl font-black uppercase"></h2>
            
            <div class="bg-gray-100 p-4 w-full rounded border border-gray-200">
                <p id="correctAnswer" class="text-3xl font-black text-gray-800 mb-1"></p>
                <p id="pinyinDisplay" class="text-md font-bold text-indigo-600 bg-indigo-50 inline-block px-2 rounded"></p>
                <p id="translation" class="text-sm text-gray-600 mt-1 italic"></p>
            </div>
            <button id="nextBtn" class="w-full manga-button bg-blue-500 text-white font-black py-3 rounded-lg uppercase">Avanti</button>
        </div>

        <!-- AREA FINE -->
        <div id="endArea" class="hidden flex-col items-center text-center space-y-4 py-4">
            <div class="text-6xl">🏆</div>
            <h2 class="text-2xl font-black uppercase">Finito!</h2>
            <button id="restartBtn" class="w-full manga-button bg-pink-500 text-white font-black py-3 rounded-lg uppercase">Ricomincia</button>
        </div>

    </div>

    <script>
        let exerciseData = [];
        let currentIndex = 0;
        let score = 0;
        let listensLeft = 3; 
        let voices = [];
        let synth = window.speechSynthesis;

        // Inizializza Voci
        function populateVoiceList() {
            voices = synth.getVoices();
            const languageSelect = document.getElementById('languageSelect');
            languageSelect.innerHTML = '';
            voices.forEach(voice => {
                const option = document.createElement('option');
                option.textContent = `${voice.name} (${voice.lang})`;
                option.setAttribute('data-lang', voice.lang);
                option.setAttribute('data-name', voice.name);
                languageSelect.appendChild(option);
            });
        }
        populateVoiceList();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoiceList;
        }

        // CARICAMENTO DA URL VERCEL/GITHUB        // Gestione Menù a Tendina
        const lessonSelect = document.getElementById('lessonSelect');
        const startLessonBtn = document.getElementById('startLessonBtn');
        let selectedLessonUrl = "";

        lessonSelect.addEventListener('change', (e) => {
            selectedLessonUrl = e.target.value;
            if(selectedLessonUrl) {
                startLessonBtn.classList.remove('hidden'); // Mostra il bottone "Inizia"
            }
        });

        // Quando lo studente clicca "Inizia Esercizio"
        startLessonBtn.addEventListener('click', () => {
            startLessonBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Caricamento...';
            
            // Il percorso su Vercel (se hai messo i JSON nella cartella /json/)
            const url = `/json/${selectedLessonUrl}`;
            
            fetch(url)
                .then(res => {
                    if(!res.ok) throw new Error("Errore " + res.status + ": File non trovato sul server.");
                    return res.json();
                })
                .then(data => {
                    loadExerciseData(data);
                })
                .catch(err => {
                    startLessonBtn.innerHTML = 'Inizia Esercizio <i class="fas fa-play ml-2"></i>';
                    alert("Impossibile caricare la lezione. Assicurati di aver caricato il file " + selectedLessonUrl + " nella cartella /json/ su GitHub/Vercel.");
                });
        });
        
                    return res.json();
                })
                .then(data => {
                    document.getElementById('loadUrlBtn').textContent = "Carica URL";
                    loadExerciseData(data);
                })
                .catch(err => {
                    document.getElementById('loadUrlBtn').textContent = "Carica URL";
                    alert("Impossibile caricare il JSON:\
" + err.message);
                });
        });

        // CARICAMENTO MANUALE DAL TELEFONO (Funziona 100%)
        document.getElementById('jsonUpload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    try { loadExerciseData(JSON.parse(evt.target.result)); } 
                    catch (error) { alert("Il file non è un JSON valido!"); }
                };
                reader.readAsText(file);
            }
        });

        function loadExerciseData(data) {
            if (data && data.length > 0) {
                exerciseData = data;
                document.getElementById('totalCount').textContent = data.length;
                document.getElementById('setupArea').classList.add('hidden'); // Nasconde menu caricamento
                
                // Cerca di selezionare la lingua in automatico
                if(data[0].lang) {
                    const select = document.getElementById('languageSelect');
                    for (let i = 0; i < select.options.length; i++) {
                        if (select.options[i].getAttribute('data-lang').includes(data[0].lang.split('-')[0])) {
                            select.selectedIndex = i;
                            break;
                        }
                    }
                }
                startExercise();
            }
        }

        function startExercise() {
            currentIndex = 0;
            score = 0;
            document.getElementById('scoreDisplay').textContent = score;
            nextRound();
        }

        function nextRound() {
            document.getElementById('exerciseArea').classList.remove('hidden');
            document.getElementById('resultArea').classList.add('hidden');
            document.getElementById('endArea').classList.add('hidden');
            
            document.getElementById('currentCount').textContent = currentIndex + 1;
            document.getElementById('answerInput').value = '';
            
            listensLeft = 3; 
            document.getElementById('playBtn').disabled = false;
            document.getElementById('listenBadge').textContent = listensLeft;
        }

        document.getElementById('playBtn').addEventListener('click', () => {
            if(listensLeft > 0 && !synth.speaking) {
                const currentItem = exerciseData[currentIndex];
                const utterThis = new SpeechSynthesisUtterance(currentItem.text);
                
                // FORZATURA LINGUA
                utterThis.lang = currentItem.lang;

                const select = document.getElementById('languageSelect');
                if(select.selectedOptions.length > 0) {
                    const voiceName = select.selectedOptions[0].getAttribute('data-name');
                    const selectedVoice = voices.find(v => v.name === voiceName);
                    if(selectedVoice) utterThis.voice = selectedVoice;
                }
                
                utterThis.rate = 0.9; 
                synth.speak(utterThis);
                
                listensLeft--;
                document.getElementById('listenBadge').textContent = listensLeft;
                if(listensLeft === 0) document.getElementById('playBtn').disabled = true;
            }
        });

        document.getElementById('checkBtn').addEventListener('click', () => {
            const currentItem = exerciseData[currentIndex];
            const userAnswer = document.getElementById('answerInput').value.trim().toLowerCase();
            
            // Accetta sia il pinyin che i caratteri cinesi!
            const cleanExpectedChar = currentItem.text.toLowerCase().replace(/[.,!?。，！？、 ]/g, '');
            const cleanExpectedPinyin = (currentItem.pinyin || '').toLowerCase().replace(/[.,!?。，！？、 ]/g, '');
            const cleanUser = userAnswer.replace(/[.,!?。，！？、 ]/g, '');

            const isCorrect = (cleanUser === cleanExpectedChar) || (cleanUser !== '' && cleanExpectedPinyin !== '' && cleanUser === cleanExpectedPinyin);

            document.getElementById('exerciseArea').classList.add('hidden');
            document.getElementById('resultArea').classList.remove('hidden');

            document.getElementById('correctAnswer').textContent = currentItem.text;
            document.getElementById('pinyinDisplay').textContent = currentItem.pinyin || '';
            document.getElementById('translation').textContent = currentItem.translation || '';
            
            const icon = document.getElementById('resultIcon');
            const title = document.getElementById('resultTitle');

            if (isCorrect) {
                score++;
                document.getElementById('scoreDisplay').textContent = score;
                icon.textContent = '🎉';
                title.textContent = 'Corretto!';
                title.className = 'text-xl font-black uppercase text-green-500';
            } else {
                icon.textContent = '📝';
                title.textContent = 'Quasi...';
                title.className = 'text-xl font-black uppercase text-blue-500';
            }
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            currentIndex++;
            if (currentIndex < exerciseData.length) {
                nextRound();
            } else {
                document.getElementById('resultArea').classList.add('hidden');
                document.getElementById('endArea').classList.remove('hidden');
            }
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            document.getElementById('setupArea').classList.remove('hidden');
            document.getElementById('endArea').classList.add('hidden');
        });
    </script>
</body>
</html>
