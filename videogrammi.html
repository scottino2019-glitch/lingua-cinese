     <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Cerchiamo l'input di testo usando i suoi attributi generici, visto che non ha un id
            const searchInput = document.querySelector('input[type="text"]');
            
            // Selezioniamo tutte le card. Nel tuo layout, sono i tag <a> dentro l'elemento con classe grid
            const cards = document.querySelectorAll('.grid > a');

            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    const searchTerm = e.target.value.toLowerCase();

                    cards.forEach(card => {
                        // Estrae tutto il testo dalla card e lo converte in minuscolo
                        const cardText = card.textContent.toLowerCase();
                        
                        // Se il testo cercato è presente nella card, la mostra, altrimenti la nasconde
                        if (cardText.includes(searchTerm)) {
                            card.style.display = 'block';
                        } else {
                            card.style.display = 'none';
                        }
                    });
                });
            }
        });
    </script>
