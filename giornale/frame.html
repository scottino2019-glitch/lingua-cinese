<div class="giornale-wrapper">
  <div class="giornale-container">
    <iframe 
      id="giornale-iframe"
      src="giornale.html" 
      title="L'Eco del Tempo - Giornale Sfogliabile"
      loading="lazy"
      allowfullscreen>
    </iframe>
  </div>
</div>

<style>
  .giornale-wrapper {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 10px;
    box-sizing: border-box;
  }

  .giornale-container {
    position: relative;
    width: 100%;
    background: #170d07;
    border-radius: 12px;
    box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
    overflow: hidden;
  }

  /* Aspect Ratio proporzionale */
  .giornale-container::before {
    content: "";
    display: block;
    padding-top: 65%; /* Proporzione orizzontale ideale per Desktop (2 pagine) */
  }

  .giornale-container iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
  }

  /* FORZATURA MOBILE: Cambia la proporzione del box per ospitare la pagina singola verticale */
  @media (max-width: 767px) {
    .giornale-container::before {
      padding-top: 145%; /* Più alto in verticale per contenere bene la singola pagina */
    }
  }
</style>

<script>
  (function() {
    const iframe = document.getElementById('giornale-iframe');

    function inviaFormato() {
      if (!iframe || !iframe.contentWindow) return;
      
      // Controlla la vera larghezza dello schermo del telefono dell'utente
      const isMobileSize = window.innerWidth < 768;
      
      // Invia un messaggio sicuro all'interno dell'iframe per impostare la modalità corretta
      iframe.contentWindow.postMessage({
        tipo: 'CAMBIA_FORMATO',
        forzaMobile: isMobileSize
      }, '*');
    }

    // Invia la configurazione quando l'iframe ha finito di caricarsi
    iframe.addEventListener('load', inviaFormato);

    // Aggiorna se l'utente ruota il telefono o ridimensiona lo schermo
    window.addEventListener('resize', inviaFormato);
  })();
</script>
