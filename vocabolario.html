<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabolario Cinese</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); min-height: 100vh; }
        .container { max-width: 1100px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 20px; }
        
        /* Filtri e Ricerca */
        .filter-section { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .category-buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; justify-content: center; }
        .cat-btn { padding: 8px 15px; border: 2px solid #ff9a9e; border-radius: 20px; background: white; cursor: pointer; transition: 0.3s; font-weight: bold; color: #ff9a9e; }
        .cat-btn.active, .cat-btn:hover { background: #ff9a9e; color: white; }
        .search-box { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; }

        /* Grid */
        .vocab-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .vocab-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 12px; position: relative; }
        
        /* Badge Categoria */
        .category-badge { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.2); padding: 3px 10px; border-radius: 10px; font-size: 0.7em; text-transform: uppercase; }

        .chinese-char { font-size: 2.2em; text-align: center; font-weight: bold; margin-top: 10px; }
        .pinyin { text-align: center; font-style: italic; opacity: 0.9; margin-bottom: 10px; }
        .translation { text-align: center; font-size: 1.1em; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px; }
        .examples { font-size: 0.9em; line-height: 1.4; }
        .example-item { margin-bottom: 5px; }

        @media (max-width: 600px) { .vocab-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header"><h1>🇨🇳 Vocabolario</h1></div>

    <div class="filter-section">
        <div id="categoryContainer" class="category-buttons">
            </div>
        <input type="text" id="searchInput" class="search-box" placeholder="Cerca parola..." oninput="applicaFiltri()">
    </div>

    <div id="vocabContainer" class="vocab-grid"></div>
</div>

<script>
    let dati = [];
    let categoriaCorrente = "Tutte";

    async function inizializza() {
        try {
            const res = await fetch('vocabolario.json');
            dati = await res.json();
            creaBottoniCategoria();
            applicaFiltri();
        } catch (e) { console.error("Errore:", e); }
    }

    function creaBottoniCategoria() {
        const container = document.getElementById('categoryContainer');
        // Estrae categorie uniche dal JSON
        const categorie = ["Tutte", ...new Set(dati.map(item => item.category))];
        
        container.innerHTML = categorie.map(cat => `
            <button class="cat-btn ${cat === 'Tutte' ? 'active' : ''}" onclick="setCategoria('${cat}', this)">${cat}</button>
        `).join('');
    }

    function setCategoria(cat, btn) {
        categoriaCorrente = cat;
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        applicaFiltri();
    }

    function applicaFiltri() {
        const ricerca = document.getElementById('searchInput').value.toLowerCase();
        
        const filtrati = dati.filter(item => {
            const matchCategoria = (categoriaCorrente === "Tutte" || item.category === categoriaCorrente);
            const matchRicerca = item.chinese.includes(ricerca) || 
                                 item.pinyin.toLowerCase().includes(ricerca) || 
                                 item.translation.toLowerCase().includes(ricerca);
            return matchCategoria && matchRicerca;
        });

        renderizza(filtrati);
    }

    function renderizza(lista) {
    const container = document.getElementById('vocabContainer');
    container.innerHTML = lista.map(item => `
        <div class="vocab-card">
            <div class="category-badge">${item.category}</div>
            <div class="chinese-char" 
                 onclick="parla('${item.chinese}')" 
                 style="cursor: pointer; transition: transform 0.1s;"
                 onmousedown="this.style.transform='scale(0.9)'"
                 onmouseup="this.style.transform='scale(1)'"
                 title="Clicca per ascoltare">
                 ${item.chinese}
            </div>
            <div class="pinyin">${item.pinyin}</div>
            <div class="translation">${item.translation}</div>
            <div class="examples">
                ${item.spiegazione.map(s => `<div class="example-item">${s}</div>`).join('')}
            </div>
        </div>
    `).join('');
}

// Ecco la funzione che attiva la voce
function parla(testo) {
    // Rimuoviamo eventuali parentesi o pinyin se presenti nel campo chinese
    const pulito = testo.split('(')[0].trim(); 
    
    const messaggio = new SpeechSynthesisUtterance(pulito);
    messaggio.lang = 'zh-CN'; // Imposta la lingua su Cinese Mandarino
    messaggio.rate = 0.8;      // Velocità leggermente ridotta per capire meglio
    window.speechSynthesis.speak(messaggio);
}

    window.onload = inizializza;
</script>
</body>
</html>
