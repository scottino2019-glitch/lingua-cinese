<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcard Vocabolario Cinese</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: radial-gradient(circle at top left, red, yellow);
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
     -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f9fafb;
    
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: #2d3748;
      margin-bottom: 20px;
      font-size: 2.2rem;
    }

    .add-form {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .add-form input {
      flex: 1 1 150px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #cbd5e0;
      font-size: 0.95rem;
    }

    .add-form button {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      background: #667eea;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .add-form button:hover {
      background: #5a67d8;
    }

    .flashcard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px 0;
    }

    .flashcard {
      background: linear-gradient(135deg, #ffffff 0%, #f2f2f2 100%);
      border-radius: 20px;
      padding: 20px 15px;
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      position: relative;
      overflow: hidden;
      border: 4px solid #f6b26b;
    }

    .flashcard:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }

    .flashcard.flipped {
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      border-color: #11998e;
    }

    .card-content {
      color: #1a202c;
      font-size: 1.4rem;
      font-weight: bold;
      text-align: center;
      line-height: 1.4;
      width: 100%;
    }

    .flashcard.flipped .card-content {
      color: white;
      font-size: 1.6rem;
    }

    .card-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 10px;
    }

    .pinyin {
      font-size: 1rem;
      margin-bottom: 4px;
    }

    .hanzi {
      font-size: 1.8rem;
    }

    .card-image {
      max-width: 80%;
      max-height: 140px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }

    @media (max-width: 768px) {
      .flashcard-grid {
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
      }

      h1 {
        font-size: 2rem;
      }

      .card-content {
        font-size: 1.2rem;
      }
    }
header {
  background: #333; color: white; padding: 1rem 2rem; 
  display: flex; align-items: center; gap: 1rem;
}

.logo-container {
  width: 60px; height: 60px; /* Piccola per header */
  position: relative; overflow: hidden;
}

.logo-piece {
  position: absolute; width: 100%; height: 100%;
  animation: logoBuild 3s ease-out infinite;
}

.logo-piece-1 { clip-path: inset(0 50% 50% 0); animation-delay: 0s; }
.logo-piece-2 { clip-path: inset(0 0 50% 50%); animation-delay: 0.75s; }
.logo-piece-3 { clip-path: inset(50% 50% 0 0); animation-delay: 1.5s; }
.logo-piece-4 { clip-path: inset(50% 0 0 50%); animation-delay: 2.25s; }

@keyframes logoBuild {
  0% { opacity: 0; transform: scale(0.3); }
  30% { opacity: 1; transform: scale(1); }
  100% { opacity: 1; transform: scale(1); }
}

  </style>
</head>
<body>
<header>
  <div class="logo-container">
    <img src="https://images.unsplash.com/photo-1736607618767-b35f1230174d?crop=entropy&cs=srgb&fm=jpg&ixid=M3w4MDc1Mjd8MHwxfHNlYXJjaHwxfHxDYXJkJTIwY2luZXNlfGVufDB8fHx8MTc2NTQ3NzM3MHww&ixlib=rb-4.1.0&q=85 " class="logo-piece logo-piece-1">
    <img src="https://images.unsplash.com/photo-1736607618767-b35f1230174d?crop=entropy&cs=srgb&fm=jpg&ixid=M3w4MDc1Mjd8MHwxfHNlYXJjaHwxfHxDYXJkJTIwY2luZXNlfGVufDB8fHx8MTc2NTQ3NzM3MHww&ixlib=rb-4.1.0&q=85 " class="logo-piece logo-piece-2">
    <img src="https://images.unsplash.com/photo-1736607618767-b35f1230174d?crop=entropy&cs=srgb&fm=jpg&ixid=M3w4MDc1Mjd8MHwxfHNlYXJjaHwxfHxDYXJkJTIwY2luZXNlfGVufDB8fHx8MTc2NTQ3NzM3MHww&ixlib=rb-4.1.0&q=85 " class="logo-piece logo-piece-3">
    <img src="https://images.unsplash.com/photo-1736607618767-b35f1230174d?crop=entropy&cs=srgb&fm=jpg&ixid=M3w4MDc1Mjd8MHwxfHNlYXJjaHwxfHxDYXJkJTIwY2luZXNlfGVufDB8fHx8MTc2NTQ3NzM3MHww&ixlib=rb-4.1.0&q=85 "  class="logo-piece logo-piece-4">
  </div>
<h1>Flashcard Vocabolario Cinese</h1>
</header>
  <div class="container">
 <!-- Form per aggiungere nuove flashcard personali -->
    <div class="add-form">
      <input id="pinyin-input" type="text" placeholder="Pinyin (es. pí jiǔ)">
      <input id="hanzi-input" type="text" placeholder="Caratteri (es. 啤酒)">
      <input id="trad-input" type="text" placeholder="Traduzione (es. birra)">
      <input id="img-input" type="text" placeholder="URL immagine (es. img/beer.jpg)">
      <button onclick="handleAddCard()">Aggiungi flashcard</button>
    </div>

    <div class="flashcard-grid" id="flashcard-grid">
      <!-- CARD STATICHE, uguali per tutti -->
      <div
        class="flashcard"
        onclick="flipCard(this)"
        data-hanzi="啤酒"
        data-pinyin="pí jiǔ"
        data-back="birra"
        data-img="img/beer.jpg"
      >
        <div class="card-content">
          <div class="card-top">
            <div class="pinyin">pí jiǔ</div>
            <div class="hanzi">啤酒</div>
          </div>
          <img src="img/beer.jpg" alt="birra" class="card-image">
        </div>
      </div>

      <div class="flashcard" onclick="flipCard(this)"
           data-hanzi="你好" data-pinyin="nǐ hǎo" data-back="ciao">
        <div class="card-content">
          <div class="card-top">
            <div class="pinyin">nǐ hǎo</div>
            <div class="hanzi">你好</div>
          </div>
        </div>
      </div>
    </div>
  </div>
<button class="inline-flex items-center justify-center rounded-md px-4 py-2 text-base text-white font-semibold shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all duration-200 bg-gradient-to-r from-red-500 to-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 active:transform active:scale-95">
  <a href="index.html">  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
</svg></a>
</button>
  <script>
    const STORAGE_KEY = 'flashcards_personali_v1';

    function renderFront(cardElement) {
      const content = cardElement.querySelector('.card-content');
      const hanzi = cardElement.dataset.hanzi || '';
      const pinyin = cardElement.dataset.pinyin || '';
      const imgSrc = cardElement.dataset.img || '';

      if (imgSrc || pinyin) {
        content.innerHTML = `
          <div class="card-top">
            ${pinyin ? `<div class="pinyin">${pinyin}</div>` : ''}
            ${hanzi ? `<div class="hanzi">${hanzi}</div>` : ''}
          </div>
          ${imgSrc ? `<img src="${imgSrc}" alt="${hanzi || pinyin}" class="card-image">` : ''}
        `;
      } else {
        content.textContent = hanzi;
      }
    }

    function flipCard(cardElement) {
      const content = cardElement.querySelector('.card-content');
      const isFlipped = cardElement.classList.contains('flipped');

      cardElement.classList.toggle('flipped');

      if (isFlipped) {
        renderFront(cardElement);
      } else {
        const back = cardElement.dataset.back || '';
        content.textContent = back;
      }
    }

    function addNewCard(pinyin, hanzi, traduzione, imgUrl) {
      const grid = document.getElementById('flashcard-grid');
      const newCard = document.createElement('div');
      newCard.className = 'flashcard';
      newCard.setAttribute('data-hanzi', hanzi);
      newCard.setAttribute('data-pinyin', pinyin);
      newCard.setAttribute('data-back', traduzione);
      if (imgUrl) {
        newCard.setAttribute('data-img', imgUrl);
      }
      newCard.onclick = function () {
        flipCard(this);
      };

      const content = document.createElement('div');
      content.className = 'card-content';
      newCard.appendChild(content);
      renderFront(newCard);

      grid.appendChild(newCard);
    }

    function loadFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const cards = JSON.parse(raw);
        if (!Array.isArray(cards)) return;

        cards.forEach(card => {
          addNewCard(card.pinyin, card.hanzi, card.traduzione, card.imgUrl);
        });
      } catch (e) {
        console.error('Errore lettura localStorage', e);
      }
    }

    function saveToStorage(cardObj) {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const cards = raw ? JSON.parse(raw) : [];
        cards.push(cardObj);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
      } catch (e) {
        console.error('Errore salvataggio localStorage', e);
      }
    }

        function handleAddCard() {
      const pinyinInput = document.getElementById('pinyin-input');
      const hanziInput = document.getElementById('hanzi-input');
      const tradInput = document.getElementById('trad-input');
      const imgInput = document.getElementById('img-input');

      const pinyin = pinyinInput.value.trim();
      const hanzi = hanziInput.value.trim();
      const traduzione = tradInput.value.trim();
      const imgUrl = imgInput.value.trim();

      if (!hanzi || !traduzione) {
        alert('Compila almeno i caratteri e la traduzione.');
        return;
      }

      const cardObj = { pinyin, hanzi, traduzione, imgUrl };
      addNewCard(pinyin, hanzi, traduzione, imgUrl);
      saveToStorage(cardObj);

      pinyinInput.value = '';
      hanziInput.value = '';
      tradInput.value = '';
      imgInput.value = '';
      hanziInput.focus();
    }

    // carica le card personali salvate all'apertura della pagina
    window.addEventListener('DOMContentLoaded', loadFromStorage);
  </script>
</body>
</html>
  </script>
</body>
</html>
