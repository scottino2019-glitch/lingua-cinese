<!doctype html>
<html lang="it">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcard Ideogrammi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&amp;family=Quicksand:wght@500;700&amp;display=swap" rel="stylesheet">
  <style>
    body {
      box-sizing: border-box;
    }
    
    *, *::before, *::after {
      box-sizing: inherit;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .flashcard-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
    }

    .title {
      font-size: 2.5rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 2rem;
      text-align: center;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    .card-wrapper {
      perspective: 1000px;
      width: 100%;
      max-width: 500px;
      height: 400px;
      margin-bottom: 2rem;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
      cursor: pointer;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }

    .card-front {
      background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
    }

    .card-back {
      background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
      transform: rotateY(180deg);
    }

    .ideogram {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 8rem;
      font-weight: 700;
      color: #2d3436;
      margin-bottom: 1rem;
    }

    .pinyin {
      font-size: 2rem;
      color: #2d3436;
      font-weight: 700;
      margin-bottom: 1.5rem;
      letter-spacing: 0.05em;
    }

    .explanation {
      font-size: 1.5rem;
      color: #2d3436;
      text-align: center;
      line-height: 1.6;
      font-weight: 500;
    }

    .flip-hint {
      font-size: 1rem;
      color: #636e72;
      margin-top: 1rem;
      opacity: 0.7;
    }

    .controls {
      display: flex;
      gap: 2rem;
      align-items: center;
    }

    .nav-button {
      background: rgba(255, 255, 255, 0.95);
      border: none;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      font-size: 1.8rem;
      color: #667eea;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      font-weight: 700;
    }

    .nav-button:hover {
      transform: scale(1.1);
      background: #ffffff;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }

    .nav-button:active {
      transform: scale(0.95);
    }

    .nav-button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: scale(1);
    }

    .counter {
      font-size: 1.3rem;
      font-weight: 700;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.2);
      padding: 0.8rem 2rem;
      border-radius: 30px;
      min-width: 120px;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .loading {
      color: #ffffff;
      font-size: 1.5rem;
      text-align: center;
    }

    .error {
      color: #ff6b6b;
      background: rgba(255, 255, 255, 0.95);
      padding: 2rem;
      border-radius: 15px;
      font-size: 1.2rem;
      text-align: center;
      max-width: 500px;
    }

    @media (max-width: 768px) {
      .title {
        font-size: 1.8rem;
        margin-bottom: 1.5rem;
      }

      .card-wrapper {
        height: 350px;
        max-width: 90%;
      }

      .ideogram {
        font-size: 5rem;
      }

      .pinyin {
        font-size: 1.5rem;
      }

      .explanation {
        font-size: 1.2rem;
      }

      .nav-button {
        width: 50px;
        height: 50px;
        font-size: 1.5rem;
      }

      .counter {
        font-size: 1.1rem;
        padding: 0.6rem 1.5rem;
      }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="/_sdk/element_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
 </head>
 <body>
  <main class="flashcard-container" role="main">
   <h1 class="title">Flashcard Ideogrammi Giapponesi</h1>
   <div id="content" class="loading">
    Caricamento flashcard...
   </div>
  </main>
  <script>
    let flashcards = [];
    let currentIndex = 0;
    let isFlipped = false;

    async function loadFlashcards() {
      try {
        const response = await fetch('flashcards.json');
        if (!response.ok) {
          throw new Error(`Impossibile caricare le flashcard (${response.status})`);
        }
        flashcards = await response.json();
        
        if (!Array.isArray(flashcards) || flashcards.length === 0) {
          throw new Error('Nessuna flashcard trovata nel file JSON');
        }
        
        renderFlashcards();
      } catch (error) {
        document.getElementById('content').innerHTML = `
          <div class="error">
            <strong>⚠️ Errore nel caricamento</strong><br><br>
            ${error.message}<br><br>
            Assicurati che il file <code>flashcards.json</code> esista nella stessa cartella.
          </div>
        `;
      }
    }

    function renderFlashcards() {
      const content = document.getElementById('content');
      
      content.innerHTML = `
        <div class="card-wrapper">
          <div class="card" id="card">
            <div class="card-face card-front">
              <div class="ideogram" id="ideogram">${flashcards[currentIndex].ideogramma}</div>
              <div class="flip-hint">Clicca per girare</div>
            </div>
            <div class="card-face card-back">
              <div class="pinyin" id="pinyin">${flashcards[currentIndex].pinyin}</div>
              <div class="explanation" id="explanation">${flashcards[currentIndex].spiegazione}</div>
            </div>
          </div>
        </div>

        <div class="controls">
          <button class="nav-button" id="prevBtn" aria-label="Precedente">←</button>
          <div class="counter" id="counter">${currentIndex + 1} di ${flashcards.length}</div>
          <button class="nav-button" id="nextBtn" aria-label="Successiva">→</button>
        </div>
      `;

      // Event listeners
      const card = document.getElementById('card');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');

      card.addEventListener('click', flipCard);
      prevBtn.addEventListener('click', previousCard);
      nextBtn.addEventListener('click', nextCard);

      // Keyboard navigation
      document.addEventListener('keydown', handleKeyboard);

      updateButtons();
    }

    function handleKeyboard(e) {
      if (e.key === 'ArrowLeft') {
        previousCard();
      } else if (e.key === 'ArrowRight') {
        nextCard();
      } else if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        flipCard();
      }
    }

    function flipCard() {
      const card = document.getElementById('card');
      isFlipped = !isFlipped;
      card.classList.toggle('flipped');
    }

    function previousCard() {
      if (currentIndex > 0) {
        currentIndex--;
        resetCard();
        updateCard();
      }
    }

    function nextCard() {
      if (currentIndex < flashcards.length - 1) {
        currentIndex++;
        resetCard();
        updateCard();
      }
    }

    function resetCard() {
      const card = document.getElementById('card');
      if (isFlipped) {
        card.classList.remove('flipped');
        isFlipped = false;
      }
    }

    function updateCard() {
      document.getElementById('ideogram').textContent = flashcards[currentIndex].ideogramma;
      document.getElementById('pinyin').textContent = flashcards[currentIndex].pinyin;
      document.getElementById('explanation').textContent = flashcards[currentIndex].spiegazione;
      document.getElementById('counter').textContent = `${currentIndex + 1} di ${flashcards.length}`;
      updateButtons();
    }

    function updateButtons() {
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      
      if (prevBtn && nextBtn) {
        prevBtn.disabled = currentIndex === 0;
        nextBtn.disabled = currentIndex === flashcards.length - 1;
      }
    }

    // Load flashcards when page loads
    window.addEventListener('DOMContentLoaded', loadFlashcards);
  </script>

</html>
