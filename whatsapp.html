<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cinese Storie</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- HEADER --- */
    .app-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 20px 20px 4px 20px;
      background: #181825;
    }

    .app-header .header-icon {
      font-size: 26px;
    }

    .app-header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #cdd6f4;
      letter-spacing: 0.5px;
    }

    /* Container delle mini-card con SCROLL ORIZZONTALE */
    .card-nav {
      display: flex;
      gap: 12px;
      padding: 16px 20px;
      background: #181825;
      border-bottom: 2px solid #313244;
      
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none; 
    }

    .card-nav::-webkit-scrollbar {
      display: none; 
    }

    /* Stile base delle mini card */
    .mini-card {
      flex: 0 0 auto; 
      width: 85px;
      height: 85px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: #313244;
      border: 2px solid transparent;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 6px rgba(0,0,0,0.15);
      user-select: none;
    }

    .mini-card:hover {
      transform: translateY(-4px);
    }

    .mini-card .icon {
      font-size: 26px;
      margin-bottom: 6px;
      transition: transform 0.2s;
    }

    .mini-card:active .icon {
      transform: scale(0.9);
    }

    .mini-card .title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* --- COLORI TEMATICI (Originali + Nuovi) --- */
    .card-study { border-color: #89b4fa; color: #89b4fa; }
    .card-study.active { background: #89b4fa; color: #11111b; box-shadow: 0 8px 15px rgba(137, 180, 250, 0.3); }

    .card-fight { border-color: #f38ba8; color: #f38ba8; }
    .card-fight.active { background: #f38ba8; color: #11111b; box-shadow: 0 8px 15px rgba(243, 139, 168, 0.3); }

    .card-gym { border-color: #a6e3a1; color: #a6e3a1; }
    .card-gym.active { background: #a6e3a1; color: #11111b; box-shadow: 0 8px 15px rgba(166, 227, 161, 0.3); }

    /* NUOVI COLORI */
    /* Scuola (Verde Acqua) */
    .card-school { border-color: #94e2d5; color: #94e2d5; }
    .card-school.active { background: #94e2d5; color: #11111b; box-shadow: 0 8px 15px rgba(148, 226, 213, 0.3); }

       /* Scuola (Verde Acqua) */
    .card-school2 { border-color: #94e2d5; color: #94e2d5; }
    .card-school2.active { background: #94e2d5; color: #11111b; box-shadow: 0 8px 15px rgba(148, 226, 213, 0.3); }

    
    /* Hotel (Lavanda) */
    .card-hotel { border-color: #b4befe; color: #b4befe; }
    .card-hotel.active { background: #b4befe; color: #11111b; box-shadow: 0 8px 15px rgba(180, 190, 254, 0.3); }

    /* Bar (Rosso Mattone/Pesca scuro) */
    .card-bar { border-color: #eba0ac; color: #eba0ac; }
    .card-bar.active { background: #eba0ac; color: #11111b; box-shadow: 0 8px 15px rgba(235, 160, 172, 0.3); }

    /* Telefono (Azzurro Cielo) */
    .card-phone { border-color: #89dceb; color: #89dceb; }
    .card-phone.active { background: #89dceb; color: #11111b; box-shadow: 0 8px 15px rgba(137, 220, 235, 0.3); }

    /* Incontro (Rosa Fenicottero) */
    .card-meeting { border-color: #f2cdcd; color: #f2cdcd; }
    .card-meeting.active { background: #f2cdcd; color: #11111b; box-shadow: 0 8px 15px rgba(242, 205, 205, 0.3); }

    /* Shopping (Rosa/Fucsia chiaro) */
    .card-shop { border-color: #f5c2e7; color: #f5c2e7; }
    .card-shop.active { background: #f5c2e7; color: #11111b; box-shadow: 0 8px 15px rgba(245, 194, 231, 0.3); }

    .card-food { border-color: #fab387; color: #fab387; }
    .card-food.active { background: #fab387; color: #11111b; box-shadow: 0 8px 15px rgba(250, 179, 135, 0.3); }

    .card-work { border-color: #cba6f7; color: #cba6f7; }
    .card-work.active { background: #cba6f7; color: #11111b; box-shadow: 0 8px 15px rgba(203, 166, 247, 0.3); }



    /* Area degli Iframe */
    .frame-wrapper {
      flex: 1;
      position: relative;
      background: #1e1e2e;
    }

    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      transform: translateY(10px);
    }

    iframe.visible {
      opacity: 1;
      pointer-events: all;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-icon">💬</div>
    <h1>Cinese Storie</h1>
  </header>

  <nav class="card-nav" id="tabs"></nav>
  <div class="frame-wrapper" id="frames"></div>

  <script>
    const dialogues = [
      // Le tue 3 chat originali
      { label: "Libreria", icon: "📚", colorClass: "card-study", src: "dialoghi/libreria.html" },
      { label: "La Sfida", icon: "⚔️", colorClass: "card-fight", src: "dialoghi/la-sfida.html" },
      { label: "Palestra", icon: "🏋️", colorClass: "card-gym", src: "dialoghi/palestra.html" },
      
      // Le NUOVE card richieste (ricorda di cambiare i nomi dei file 'src' quando li crei!)
      { label: "Scuola",   icon: "🏫", colorClass: "card-school",  src: "dialoghi/scuola.html" },
      { label: "Scuola2",   icon: "🏫", colorClass: "card-school2",  src: "dialoghi/scuola2.html" },
      { label: "Hotel",    icon: "🏨", colorClass: "card-hotel",   src: "dialoghi/hotel.html" },
      { label: "Bar",      icon: "☕", colorClass: "card-bar",     src: "dialoghi/bar.html" },
      { label: "Telefono", icon: "📱", colorClass: "card-phone",   src: "dialoghi/telefono.html" },
      { label: "Incontro", icon: "🤝", colorClass: "card-meeting", src: "dialoghi/incontro.html" },
      { label: "Cena", icon: "🍜", colorClass: "card-food", src: "dialoghi/cena.html" },
      { label: "Lavoro", icon: "💼", colorClass: "card-work", src: "dialoghi/lavoro.html" },
      { label: "Shopping", icon: "🛍️", colorClass: "card-shop",    src: "dialoghi/shopping.html" }
    ];

    const nav = document.getElementById('tabs');
    const frames = document.getElementById('frames');

    dialogues.forEach((d, index) => {
      // Creazione Mini Card
      const card = document.createElement('div');
      card.className = `mini-card ${d.colorClass}`;
      if (index === 0) card.classList.add('active');
      
      card.innerHTML = `
        <div class="icon">${d.icon}</div>
        <div class="title">${d.label}</div>
      `;
      
      card.addEventListener('click', () => {
        switchTab(index);
        card.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      });
      nav.appendChild(card);

      // Creazione Iframe
      const iframe = document.createElement('iframe');
      iframe.src = d.src;
      if (index === 0) iframe.classList.add('visible');
      frames.appendChild(iframe);
    });

    function switchTab(selectedIndex) {
      const cards = nav.querySelectorAll('.mini-card');
      cards.forEach((card, i) => card.classList.toggle('active', i === selectedIndex));

      const allFrames = frames.querySelectorAll('iframe');
      allFrames.forEach((frame, i) => frame.classList.toggle('visible', i === selectedIndex));
    }
  </script>

</body>
</html>
