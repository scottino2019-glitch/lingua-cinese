<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoToon - Impara il Cinese</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* Variabili stile Webtoon */
        :root {
            --wt-green: #00dc64;
            --wt-green-dark: #00b350;
            --dark: #1a1a1a;
            --bg-color: #f5f6f8;
            --panel-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
        }

        body {
            margin: 0;
            background-color: #e9ecef;
            color: var(--dark);
            display: flex;
            justify-content: center;
        }

        /* Contenitore stile App Mobile */
        .app-container {
            width: 100%;
            max-width: 500px;
            background: var(--bg-color);
            min-height: 100vh;
            box-shadow: 0 0 25px rgba(0,0,0,0.15);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Header / Navbar */
        .header {
            background: var(--panel-bg);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 2px solid #eee;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--wt-green);
            margin: 0;
            letter-spacing: -0.5px;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--dark);
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 5px;
        }

        /* VISTA 1: Lista Episodi */
        #episode-list {
            padding: 15px;
            flex: 1;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .episode-card {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
        }

        .episode-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.05);
            border-color: var(--wt-green);
        }

        .ep-thumb {
            width: 100px;
            height: 70px;
            background: linear-gradient(135deg, var(--wt-green), #00a64c);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            flex-shrink: 0;
            box-shadow: inset 0 -3px 0 rgba(0,0,0,0.1);
        }

        .ep-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .ep-number {
            font-size: 0.8rem;
            color: var(--wt-green);
            font-weight: 800;
            margin-bottom: 4px;
        }

        .ep-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 0;
            line-height: 1.2;
        }

        /* VISTA 2: Reader (Video + Quiz) */
        #reader-view {
            display: none;
            flex-direction: column;
            padding-bottom: 40px;
        }

        .video-wrapper {
            width: 100%;
            background: #000;
            position: sticky;
            top: 61px; /* Altezza dell'header */
            z-index: 9;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        video {
            width: 100%;
            display: block;
            max-height: 300px;
        }

        .reader-content {
            padding: 20px;
        }

        .reader-title {
            font-size: 1.5rem;
            font-weight: 900;
            margin: 0 0 20px 0;
            text-align: center;
        }

        /* Stile Fumetto per il Quiz */
        .comic-panel {
            background: var(--panel-bg);
            border: 3px solid var(--dark);
            border-radius: 16px;
            padding: 25px 20px;
            position: relative;
            box-shadow: 6px 6px 0px var(--dark);
            text-align: center;
            margin-bottom: 30px;
        }

        /* Coda della nuvoletta di testo */
        .comic-panel::after {
            content: '';
            position: absolute;
            top: -15px;
            left: 30px;
            border-width: 0 15px 15px 0;
            border-style: solid;
            border-color: transparent var(--dark) transparent transparent;
            display: block;
            width: 0;
        }

        #progress {
            display: inline-block;
            background: var(--dark);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        #question-text {
            font-size: 1.3rem;
            font-weight: 800;
            margin: 0 0 20px 0;
            line-height: 1.4;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ccc;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            outline: none;
            transition: 0.2s;
            text-align: center;
        }

        input:focus {
            border-color: var(--wt-green);
            box-shadow: 0 0 0 4px rgba(0, 220, 100, 0.2);
        }

        .btn {
            background: var(--wt-green);
            color: white;
            border: 2px solid var(--dark);
            padding: 15px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            box-shadow: 3px 3px 0px var(--dark);
        }

        .btn:hover {
            background: var(--wt-green-dark);
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px var(--dark);
        }

        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--dark);
        }

        #msg {
            margin-top: 20px;
            font-weight: 800;
            font-size: 1.2rem;
            min-height: 28px;
        }

        /* Feedback Animation */
        @keyframes pop {
            0% { transform: scale(0.9); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-anim {
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- Navbar -->
    <header class="header">
        <button class="back-btn" id="back-btn" onclick="appManager.showHome()">
            ⬅️ Episodi
        </button>
        <h1 class="logo" id="logo-text">LingoToon</h1>
        <div style="width: 24px;"></div> <!-- Spaziatore per centrare il logo -->
    </header>

    <!-- Lista Episodi -->
    <main id="episode-list">
        <div class="section-title">Nuovi Episodi</div>
        <div id="playlist">
            <!-- Generato dinamicamente -->
        </div>
    </main>

    <!-- Vista Reader (Video + Quiz) -->
    <main id="reader-view">
        <div class="video-wrapper">
            <video id="player" controls playsinline></video>
        </div>
        
        <div class="reader-content">
            <h2 class="reader-title" id="current-title">Titolo Episodio</h2>
            
            <div id="quiz-box" class="comic-panel" style="display: none;">
                <div id="quiz-content">
                    <div id="progress">1 / 4</div>
                    <h3 id="question-text">Domanda...</h3>
                    
                    <div class="input-group">
                        <input type="text" id="answer-input" placeholder="La tua risposta qui..." autocomplete="off">
                        <button class="btn" onclick="quizManager.check()">Invia Risposta</button>
                    </div>
                </div>
                <div id="msg"></div>
            </div>
        </div>
    </main>

</div>

<script>
// I tuoi dati originali intatti
const lezioni = [
    { 
        title: "Giorni della settimana", 
        path: "video/XRecorder_20251116_01.mp4", 
        icon: "📅",
        questions: [
            { q: "Come si dice 'Lunedì?'", a: "星期一" },
            { q: "Come si traduce '星期 三？'", a: "Mercoledì" },
            { q: "Come si dice 'Giovedì'?", a: "星期四" },
            { q: "Come si dice 'Sabato'?", a: "星期六" }
        ] 
    },
    { 
        title: "Paesi", 
        path: "video/paesi.mp4", 
        icon: "🌍",
        questions: [
            { q: "Come si dice 'America'?", a: "美国" },
            { q: "Che vuol dire '法国'?", a: "Francia" },
            { q: "Come si dice 'Inghilterra'?", a: "英国" },
            { q: "Che vuol dire '韩国'?", a: "Sud Corea" },
            { q: "Come si dice 'Giappone'?", a: "日本" }
        ] 
    },
    {
        title: "Famiglia",
        path: "video/family.mp4",
        icon: "👨‍👩‍👧",
        questions: [
            { q: "Come si dice 'Papà'?", a: "爸爸" },
            { q: "Come si dice 'Figlio'?", a: "儿子" },
            { q: "Che vuol dire '女儿'?", a: "figlia" }
        ]
    },
    {
        title: "Amici nel mondo",
        path: "video/paesi2.mp4",
        icon: "🤝",
        questions: [ 
            { q: "马克来自哪个国家？", a: "美国" },
            { q: "汉斯会说什么语言？", a: "德语" },
            { q: "阿贾尼喜欢什么？", a: "自己的国家"}, 
            { q: "谁来自墨西哥？", a: "纳耶利" } 
        ]
    },
    { 
        title: "Presentazioni", 
        path: "video/presentazioni.mp4", 
        icon: "👋",
        questions: [
            { q: "Come si dice 'Mi chiamo...'?", a: "我叫" },
            { q: "Come si traduce '中国人'?", a: "Cinese" }, /* Modificato leggermente per facilitare la validazione testuale */
            { q: "Come si dice 'Stati Uniti'?", a: "美国" },
            { q: "Come si traduce '韩国人'?", a: "Coreano" },
            { q: "Qual è il verbo per dire 'Essere' (es. Io sono...)?", a: "是" },
            { q: "Come si dice 'Noi'?", a: "我们" }
        ] 
    }
];

// GESTORE DELL'APP (Navigazione)
const appManager = {
    init() {
        const plContainer = document.getElementById('playlist');
        lezioni.forEach((lez, i) => {
            const card = document.createElement('div');
            card.className = 'episode-card';
            card.onclick = () => this.openEpisode(i);
            
            card.innerHTML = `
                <div class="ep-thumb">${lez.icon}</div>
                <div class="ep-info">
                    <div class="ep-number">EPISODIO ${i + 1}</div>
                    <h3 class="ep-title">${lez.title}</h3>
                </div>
            `;
            plContainer.appendChild(card);
        });
    },

    openEpisode(idx) {
        const l = lezioni[idx];
        
        // UI Switch
        document.getElementById('episode-list').style.display = 'none';
        document.getElementById('reader-view').style.display = 'flex';
        document.getElementById('back-btn').style.display = 'flex';
        document.getElementById('logo-text').style.display = 'none';
        
        // Imposta Dati
        document.getElementById('current-title').innerText = `Ep. ${idx + 1} - ${l.title}`;
        const player = document.getElementById('player');
        player.src = l.path;
        
        // Avvia Quiz e Video
        quizManager.setup(l.questions);
        player.play().catch(e => console.log("Autoplay bloccato dal browser"));
        
        // Scrolla in cima
        window.scrollTo(0, 0);
    },

    showHome() {
        // UI Switch
        document.getElementById('episode-list').style.display = 'block';
        document.getElementById('reader-view').style.display = 'none';
        document.getElementById('back-btn').style.display = 'none';
        document.getElementById('logo-text').style.display = 'block';
        
        // Ferma il video
        const player = document.getElementById('player');
        player.pause();
        player.src = "";
    }
};

// GESTORE DEL QUIZ
const quizManager = {
    data: [],
    index: 0,

    setup(questions) {
        this.data = questions;
        this.index = 0;
        document.getElementById('quiz-box').style.display = 'block';
        document.getElementById('quiz-content').style.display = 'block';
        document.getElementById('msg').className = '';
        document.getElementById('msg').innerText = '';
        this.render();
    },

    render() {
        const current = this.data[this.index];
        document.getElementById('progress').innerText = `${this.index + 1} / ${this.data.length}`;
        document.getElementById('question-text').innerText = current.q;
        
        const input = document.getElementById('answer-input');
        input.value = "";
        input.disabled = false;
        
        document.getElementById('msg').innerText = "";
        document.getElementById('msg').className = '';
    },

    check() {
        const inputEl = document.getElementById('answer-input');
        const userAns = inputEl.value.trim().toLowerCase();
        
        // Per gestire la tolleranza sulle risposte esatte "Cinese (persona cinese)" -> "cinese"
        const correctAns = this.data[this.index].a.toLowerCase().split(" (")[0]; 
        
        const feedback = document.getElementById('msg');
        
        // Rimuove l'animazione precedente per poterla riapplicare
        feedback.classList.remove('pop-anim');
        void feedback.offsetWidth; // trigger reflow

        if (userAns === correctAns) {
            feedback.innerText = "💥 ESATTO! 💥";
            feedback.style.color = "#00dc64";
            feedback.classList.add('pop-anim');
            inputEl.disabled = true;
            
            this.index++;
            
            if (this.index < this.data.length) {
                setTimeout(() => this.render(), 1500);
            } else {
                setTimeout(() => {
                    document.getElementById('quiz-content').style.display = 'none';
                    feedback.innerText = "🏆 EPISODIO COMPLETATO! 🏆";
                    feedback.style.color = "var(--dark)";
                    feedback.classList.add('pop-anim');
                }, 1200);
            }
        } else {
            feedback.innerText = "💢 Ops, riprova! 💢";
            feedback.style.color = "#ff4b4b";
            feedback.classList.add('pop-anim');
            inputEl.focus();
        }
    }
};

// Inizializza l'app al caricamento
appManager.init();

// Permette di usare il tasto INVIO per rispondere
document.getElementById('answer-input').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') quizManager.check();
});
</script>
</body>
</html>
