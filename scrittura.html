<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Pergamena Classica</title>
  <script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Milonga&family=Yuji+Mai&display=swap" rel="stylesheet">
  <style>
    .font-serif-custom { font-family: 'Milonga', serif;}
    .font-sans-custom { font-family:  "Yuji Mai", serif;}
  </style>
</head>
<body class="min-h-screen w-full flex items-center justify-center p-4 md:p-8 bg-cover bg-center font-sans-custom select-none" style="background-image: url('https://images.unsplash.com/photo-1707051571727-d96d14da3318?crop=entropy&cs=srgb&fm=jpg&ixid=M3w4MDc1Mjd8MHwxfHNlYXJjaHwyMnx8cGVubmVsbG8lMjBzY3JpdHR1cmElMjBjaW5lc2V8ZW58MHx8fHwxNzgyODQxOTU3fDA&ixlib=rb-4.1.0&q=85');">
  <div class="fixed inset-0 bg-black/40 pointer-events-none"></div>
  
  <div class="relative z-10 w-full max-w-[600px] shadow-2xl rounded-sm overflow-hidden my-4" style="background-color: #f4e4bc; background-image: url('https://images.unsplash.com/photo-1727019820331-dc4b82ea27d2?crop=entropy&cs=srgb&fm=jpg&ixid=M3w4MDc1Mjd8MHwxfHNlYXJjaHwyNXx8Y2FydGElMjBkaSUyMHJpc298ZW58MHx8fHwxNzgyODQxODcyfDA&ixlib=rb-4.1.0&q=85'); background-size: cover; background-blend-mode: multiply;">
    <div class="p-10 border-l-4 border-r-4 border-amber-900/10 min-h-[600px] flex flex-col items-center">
      <div class="mb-6 opacity-20 transform scale-150 text-4xl">🈸</div>
      
      <h1 class="text-4xl font-serif-custom text-amber-950 mb-10 border-b border-amber-900/20 pb-4 tracking-tight uppercase text-center font-bold">
        Pdf di scrittura
      </h1>

      <div class="space-y-12 w-full">
        <div class="text-center">
          <div class="text-2xl font-bold text-slate-900 mb-2 font-sans-custom">1 猫狗鱼</div>
          <div class="text-sm italic text-slate-700 font-serif-custom">Māo gǒu yú</div>
          <div class="text-sm font-semibold text-slate-800 mt-2 font-serif-custom">Gatti, cani e pesci</div>
        
<button onclick="stampaPDF()">Stampa PDF</button>

<iframe id="mioPDF" src="scrittura/animali.pdf" style="display:none;"></iframe>
</div>

        <div class="text-center">
          <div class="text-3xl font-bold text-slate-900 mb-2 font-serif-custom">2 你会说中文吗?</div>
          <div class="text-xl italic text-slate-700 font-serif-custom">Nǐ huì shuō Zhōngwén ma?</div>
          <div class="text-lg font-semibold text-slate-800 mt-2">Parli cinese?</div>

        </div>

        <div class="text-center">
          <div class="text-3xl font-bold text-slate-900 mb-2 font-serif-custom">3 你周末做什么?</div>
          <div class="text-xl italic text-slate-700 font-serif-custom">Nǐ zhōumò zuò shénme?</div>
          <div class="text-lg font-semibold text-slate-800 mt-2">Cosa fai nel weekend?</div>
        </div>
      </div>

      <div class="mt-auto pt-10 text-center">
        <div class="text-xl font-serif-custom text-amber-900/60 font-bold">China 🇨🇳</div>
      </div>
    </div>
    
    <!-- Paper texture overlay -->
    <div class="absolute inset-0 opacity-10 pointer-events-none bg-[url('https://www.transparenttextures.com/patterns/old-paper.png')]"></div>
  </div>
<script>
function stampaPDF() {
  const iframe = document.getElementById('mioPDF');
  iframe.contentWindow.focus();
  iframe.contentWindow.print();
}
</script>
</body>
</html>
