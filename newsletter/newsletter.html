<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter - Stile Cinese</title>
    <style>
        :root {
            --china-red: #c8102e;
            --gold: #f4c20d;
            --rice-paper: #fdf6e3;
            --ink-black: #2b2b2b;
        }

        body {
            background-color: #eaddcf;
            background-image: radial-gradient(#d3c5b3 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .contact-card {
            background-color: var(--rice-paper);
            border: 4px solid var(--china-red);
            border-radius: 8px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        .contact-card::before {
            content: "囍"; 
            position: absolute;
            top: -20px;
            right: -10px;
            color: rgba(200, 16, 46, 0.08);
            font-size: 150px;
            font-family: "Kaiti", "STKaiti", serif;
            z-index: 0;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 1;
        }

        h2 {
            text-align: center;
            color: var(--china-red);
            margin-top: 0;
            font-size: 24px;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .subtitle {
            text-align: center;
            color: var(--ink-black);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            color: var(--ink-black);
            margin-bottom: 5px;
            font-size: 15px;
        }

        .cn-label {
            color: var(--china-red);
            font-size: 13px;
            margin-left: 5px;
            font-family: "Kaiti", "STKaiti", serif;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #fff;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--china-red);
        }

        .submit-btn {
            display: block;
            width: 100%;
            border: none;
            padding: 14px;
            background-color: var(--china-red);
            color: var(--gold);
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s, opacity 0.3s;
        }

        .submit-btn:hover {
            background-color: #a30c25;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="contact-card">
        <div class="content">
            <h2>Newsletter <span style="font-family: 'Kaiti', serif;">通讯</span></h2>
            <p class="subtitle">Iscriviti per ricevere aggiornamenti e lezioni</p>
            
            <form id="form">
                <input type="hidden" name="access_key" value="c894ddfc-fd23-4a31-9da9-ec9419f75687">
                <input type="hidden" name="subject" value="Nuova iscrizione alla Newsletter Lingua Cinese">

                <div class="form-group">
                    <label for="name">Nome <span class="cn-label">姓名</span></label>
                    <input type="text" id="name" name="name" required placeholder="Il tuo nome">
                </div>

                <div class="form-group">
                    <label for="email">Email <span class="cn-label">电子邮件</span></label>
                    <input type="email" id="email" name="email" required placeholder="La tua email">
                </div>

                <button type="submit" class="submit-btn">Iscriviti / 订阅</button>
            </form>
        </div>
    </div>

    <script>
     const form = document.getElementById('form');
const submitBtn = form.querySelector('button[type="submit"]');

form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const formData = new FormData(form);
    const originalText = submitBtn.textContent;

    submitBtn.textContent = "Invio in corso... / 发送中...";
    submitBtn.disabled = true;

    try {
        const response = await fetch("https://api.web3forms.com/submit", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        if (response.ok) {
            // Reindirizza l'utente alla pagina di ringraziamento
            window.location.href = "grazie.html";
        } else {
            alert("Errore: " + data.message);
            submitBtn.textContent = originalText;
            submitBtn.disabled = false;
        }

    } catch (error) {
        alert("Si è verificato un errore. Riprova più tardi.");
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
    }
});
    </script>
    
</body>
</html>
