<!doctype html>
<html lang="it">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traduttore PDF Multilingua</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    body {
      box-sizing: border-box;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    .app-wrapper {
      width: 100%;
      min-height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .main-container {
      width: 100%;
      max-width: 1200px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    header {
      background: #5a67d8;
      color: white;
      padding: 24px 32px;
      text-align: center;
    }

    .app-title {
      font-size: 28px;
      font-weight: 700;
      margin: 0;
    }

    main {
      padding: 32px;
    }

    .upload-section {
      background: #f7fafc;
      border: 2px dashed #cbd5e0;
      border-radius: 12px;
      padding: 32px;
      text-align: center;
      margin-bottom: 24px;
      transition: all 0.3s ease;
    }

    .upload-section:hover {
      border-color: #5a67d8;
      background: #edf2f7;
    }

    .upload-label {
      display: inline-block;
      background: #5a67d8;
      color: white;
      padding: 12px 32px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 16px;
      transition: background 0.3s ease;
    }

    .upload-label:hover {
      background: #4c51bf;
    }

    .file-input {
      display: none;
    }

    .file-name {
      margin-top: 12px;
      color: #4a5568;
      font-size: 14px;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      margin-top: 24px;
    }

    .pdf-section {
      background: #f7fafc;
      border-radius: 12px;
      padding: 24px;
      height: 400px;
      display: flex;
      flex-direction: column;
    }

    .translator-section {
      background: #f7fafc;
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panel-title {
      font-size: 18px;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pdf-viewer {
      flex: 1;
      background: white;
      border-radius: 8px;
      overflow-y: auto;
      padding: 16px;
      border: 1px solid #e2e8f0;
    }

    #pdf-text {
      font-size: 14px;
      line-height: 1.6;
      color: #2d3748;
      white-space: pre-wrap;
      word-wrap: break-word;
      user-select: text;
      cursor: text;
    }

    .translator-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .text-column {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .language-selector {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .language-selector label {
      font-weight: 600;
      color: #4a5568;
      font-size: 14px;
    }

    .language-select {
      width: 100%;
      padding: 10px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      background: white;
      cursor: pointer;
      transition: border-color 0.3s ease;
    }

    .language-select:focus {
      outline: none;
      border-color: #5a67d8;
    }

    .text-area {
      width: 100%;
      height: 250px;
      padding: 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      line-height: 1.6;
    }

    .text-area:focus {
      outline: none;
      border-color: #5a67d8;
    }

    .translate-button {
      background: #48bb78;
      color: white;
      border: none;
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease;
      align-self: center;
      margin-top: 12px;
    }

    .translate-button:hover {
      background: #38a169;
    }

    .translate-button:disabled {
      background: #cbd5e0;
      cursor: not-allowed;
    }

    .char-count {
      font-size: 12px;
      color: #718096;
      text-align: right;
    }

    .icon {
      width: 20px;
      height: 20px;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #a0aec0;
      text-align: center;
      padding: 32px;
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #5a67d8;
      font-weight: 600;
    }

    @media (max-width: 968px) {
      .translator-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .app-wrapper {
        padding: 16px 12px;
      }

      main {
        padding: 20px;
      }

      .app-title {
        font-size: 24px;
      }

      .pdf-section {
        height: 300px;
      }

      .text-area {
        height: 200px;
      }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
 </head>
 <body>
  <div class="app-wrapper">
   <div class="main-container">
    <header>
     <h1 class="app-title">Traduttore PDF Multilingua</h1>
    </header>
    <main>
     <section class="upload-section"><label for="pdf-upload" class="upload-label">📄 Carica PDF</label> <input type="file" id="pdf-upload" class="file-input" accept=".pdf" aria-label="Carica file PDF">
      <div class="file-name" id="file-name"></div>
     </section>
     <div class="content-grid"><!-- PDF Viewer Section -->
      <div class="pdf-section">
       <h2 class="panel-title">
        <svg class="icon" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path> <polyline points="14 2 14 8 20 8"></polyline> <line x1="16" y1="13" x2="8" y2="13"></line> <line x1="16" y1="17" x2="8" y2="17"></line> <polyline points="10 9 9 9 8 9"></polyline>
        </svg> Visualizzatore PDF</h2>
       <div class="pdf-viewer">
        <div class="empty-state" id="pdf-empty">
         <svg viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path> <polyline points="14 2 14 8 20 8"></polyline>
         </svg>
         <p>Carica un PDF per consultare il contenuto</p>
        </div>
        <div id="pdf-text" style="display: none;"></div>
       </div>
      </div><!-- Translator Section -->
      <div class="translator-section">
       <h2 class="panel-title">
        <svg class="icon" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 8 6 6"></path> <path d="m4 14 6-6 2-3"></path> <path d="M2 5h12"></path> <path d="M7 2h1"></path> <path d="m22 22-5-10-5 10"></path> <path d="M14 18h6"></path>
        </svg> Traduttore</h2>
       <div class="translator-grid">
        <div class="text-column">
         <div class="language-selector"><label for="source-lang">Lingua di origine:</label> <select id="source-lang" class="language-select" aria-label="Lingua di origine"> <option value="auto">Rileva automaticamente</option> <option value="it">Italiano</option> <option value="en">Inglese</option> <option value="es">Spagnolo</option> <option value="fr">Francese</option> <option value="de">Tedesco</option> <option value="pt">Portoghese</option> <option value="ru">Russo</option> <option value="zh">Cinese</option> <option value="ja">Giapponese</option> <option value="ar">Arabo</option> </select>
         </div><textarea id="source-text" class="text-area" placeholder="Copia qui il testo dal PDF da tradurre..." aria-label="Testo da tradurre"></textarea>
         <div class="char-count" id="source-count">
          0 caratteri
         </div>
        </div>
        <div class="text-column">
         <div class="language-selector"><label for="target-lang">Lingua di destinazione:</label> <select id="target-lang" class="language-select" aria-label="Lingua di destinazione"> <option value="it">Italiano</option> <option value="en">Inglese</option> <option value="es">Spagnolo</option> <option value="fr">Francese</option> <option value="de">Tedesco</option> <option value="pt">Portoghese</option> <option value="ru">Russo</option> <option value="zh">Cinese</option> <option value="ja">Giapponese</option> <option value="ar">Arabo</option> </select>
         </div><textarea id="translated-text" class="text-area" placeholder="La traduzione apparirà qui..." readonly aria-label="Testo tradotto"></textarea>
         <div class="char-count" id="target-count">
          0 caratteri
         </div>
        </div>
       </div><button id="translate-btn" class="translate-button" aria-label="Traduci testo"> 🌐 Traduci Testo </button>
      </div>
     </div>
    </main>
   </div>
  </div>
<button class="inline-flex items-center justify-center rounded-md px-4 py-2 text-base text-red font-semibold shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all duration-200 bg-gradient-to-r from-red-500 to-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 active:transform active:scale-95"><a href="https://scottino2019-glitch.github.io/lingua-cinese/utility.html"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
</svg> Indietro </a></button>
  <script>
    const defaultConfig = {
      app_title: "Traduttore PDF Multilingua",
      upload_label: "📄 Carica PDF",
      translate_button_text: "🌐 Traduci Testo",
      primary_color: "#5a67d8",
      surface_color: "#f7fafc",
      text_color: "#2d3748",
      action_color: "#48bb78",
      background_color: "#667eea",
      font_family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial",
      font_size: 16
    };

    let pdfText = '';

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    async function onConfigChange(config) {
      const appTitle = config.app_title || defaultConfig.app_title;
      const uploadLabel = config.upload_label || defaultConfig.upload_label;
      const translateButtonText = config.translate_button_text || defaultConfig.translate_button_text;
      const primaryColor = config.primary_color || defaultConfig.primary_color;
      const surfaceColor = config.surface_color || defaultConfig.surface_color;
      const textColor = config.text_color || defaultConfig.text_color;
      const actionColor = config.action_color || defaultConfig.action_color;
      const backgroundColor = config.background_color || defaultConfig.background_color;
      const customFont = config.font_family || defaultConfig.font_family;
      const baseSize = config.font_size || defaultConfig.font_size;

      document.querySelector('.app-title').textContent = appTitle;
      document.querySelector('.upload-label').textContent = uploadLabel;
      document.getElementById('translate-btn').textContent = translateButtonText;

      document.querySelector('.app-wrapper').style.background = `linear-gradient(135deg, ${backgroundColor} 0%, ${primaryColor} 100%)`;
      document.querySelector('header').style.background = primaryColor;
      document.querySelector('.upload-label').style.background = primaryColor;
      document.querySelector('.translate-button').style.background = actionColor;
      
      document.querySelectorAll('.pdf-section, .translator-section').forEach(panel => {
        panel.style.background = surfaceColor;
      });
      
      document.querySelectorAll('.panel-title, #pdf-text, .empty-state').forEach(el => {
        el.style.color = textColor;
      });
      
      document.querySelectorAll('.language-selector label').forEach(el => {
        el.style.color = textColor;
      });

      const fontStack = `${customFont}, sans-serif`;
      document.querySelector('.app-title').style.fontFamily = fontStack;
      document.querySelector('.app-title').style.fontSize = `${baseSize * 1.75}px`;
      document.querySelector('.upload-label').style.fontFamily = fontStack;
      document.querySelector('.upload-label').style.fontSize = `${baseSize}px`;
      document.querySelectorAll('.panel-title').forEach(el => {
        el.style.fontFamily = fontStack;
        el.style.fontSize = `${baseSize * 1.125}px`;
      });
      document.querySelectorAll('#pdf-text, .text-area, .language-select').forEach(el => {
        el.style.fontFamily = fontStack;
        el.style.fontSize = `${baseSize * 0.875}px`;
      });
      document.querySelector('.translate-button').style.fontFamily = fontStack;
      document.querySelector('.translate-button').style.fontSize = `${baseSize}px`;
      document.querySelectorAll('.language-selector label').forEach(el => {
        el.style.fontFamily = fontStack;
      });
    }

    document.getElementById('pdf-upload').addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      document.getElementById('file-name').textContent = `File: ${file.name}`;
      document.getElementById('pdf-empty').style.display = 'none';
      document.getElementById('pdf-text').style.display = 'block';
      document.getElementById('pdf-text').innerHTML = '<div class="loading">📄 Caricamento PDF...</div>';

      try {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let fullText = '';

        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const textContent = await page.getTextContent();
          const pageText = textContent.items.map(item => item.str).join(' ');
          fullText += pageText + '\n\n';
        }

        pdfText = fullText.trim();
        document.getElementById('pdf-text').textContent = pdfText;
        document.getElementById('translate-btn').disabled = false;
      } catch (error) {
        document.getElementById('pdf-text').innerHTML = '<div style="color: #e53e3e;">❌ Errore nel caricamento del PDF</div>';
        pdfText = '';
        document.getElementById('translate-btn').disabled = true;
      }
    });

    // Character counter for source text
    document.getElementById('source-text').addEventListener('input', (e) => {
      const count = e.target.value.length;
      document.getElementById('source-count').textContent = `${count} caratteri`;
    });

    // Translation function
    document.getElementById('translate-btn').addEventListener('click', async () => {
      const sourceText = document.getElementById('source-text').value.trim();
      
      if (!sourceText) {
        return;
      }

      const sourceLang = document.getElementById('source-lang').value;
      const targetLang = document.getElementById('target-lang').value;
      
      const translatedTextArea = document.getElementById('translated-text');
      translatedTextArea.value = '🔄 Traduzione in corso...';
      document.getElementById('translate-btn').disabled = true;

      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(sourceText)}`;
        const response = await fetch(url);
        const data = await response.json();
        
        const translatedText = data[0].map(item => item[0]).join('');
        translatedTextArea.value = translatedText;
        document.getElementById('target-count').textContent = `${translatedText.length} caratteri`;
      } catch (error) {
        translatedTextArea.value = '❌ Errore nella traduzione. Riprova.';
      } finally {
        document.getElementById('translate-btn').disabled = false;
      }
    });

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities: (config) => ({
          recolorables: [
            {
              get: () => config.background_color || defaultConfig.background_color,
              set: (value) => {
                config.background_color = value;
                window.elementSdk.setConfig({ background_color: value });
              }
            },
            {
              get: () => config.surface_color || defaultConfig.surface_color,
              set: (value) => {
                config.surface_color = value;
                window.elementSdk.setConfig({ surface_color: value });
              }
            },
            {
              get: () => config.text_color || defaultConfig.text_color,
              set: (value) => {
                config.text_color = value;
                window.elementSdk.setConfig({ text_color: value });
              }
            },
            {
              get: () => config.primary_color || defaultConfig.primary_color,
              set: (value) => {
                config.primary_color = value;
                window.elementSdk.setConfig({ primary_color: value });
              }
            },
            {
              get: () => config.action_color || defaultConfig.action_color,
              set: (value) => {
                config.action_color = value;
                window.elementSdk.setConfig({ action_color: value });
              }
            }
          ],
          borderables: [],
          fontEditable: {
            get: () => config.font_family || defaultConfig.font_family,
            set: (value) => {
              config.font_family = value;
              window.elementSdk.setConfig({ font_family: value });
            }
          },
          fontSizeable: {
            get: () => config.font_size || defaultConfig.font_size,
            set: (value) => {
              config.font_size = value;
              window.elementSdk.setConfig({ font_size: value });
            }
          }
        }),
        mapToEditPanelValues: (config) => new Map([
          ["app_title", config.app_title || defaultConfig.app_title],
          ["upload_label", config.upload_label || defaultConfig.upload_label],
          ["translate_button_text", config.translate_button_text || defaultConfig.translate_button_text]
        ])
      });
      
      onConfigChange(window.elementSdk.config);
    } else {
      onConfigChange(defaultConfig);
    }
  </script>
