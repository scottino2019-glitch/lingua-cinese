<!doctype html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizzatore PDF - FUNZIONANTE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&family=Noto+Sans+KR:wght@100..900&family=Noto+Sans+SC:wght@100..900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  
    <style>
        * { box-sizing: border-box; margin: 0; }
        body { 
            font-family: system-ui, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }
        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
            background: white; 
            border-radius: 20px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        .header { 
            background: linear-gradient(135deg, #10b981, #059669);
            color: white; 
            padding: 2rem; 
            text-align: center;
            font-size: 2.2rem; 
            font-weight: 800;
        }
        .file-zone { 
            padding: 3rem; 
            border: 3px dashed #d1d5db; 
            border-radius: 16px; 
            text-align: center; 
            margin: 2rem; 
            cursor: pointer;
            transition: all 0.3s;
        }
        .file-zone:hover { 
            border-color: #10b981; 
            background: #ecfdf5;
        }
        .file-zone input { display: none; }
        .file-label { 
            font-size: 1.3rem; 
            font-weight: 700; 
            color: #374151;
        }
        .toolbar { 
            display: flex; 
            gap: 1rem; 
            padding: 1.5rem 2rem; 
            background: #f8fafc;
            flex-wrap: wrap;
            align-items: center;
        }
        .btn { 
            padding: 0.75rem 1.5rem; 
            border: none; 
            border-radius: 10px; 
            font-weight: 700; 
            font-size: 1rem; 
            cursor: pointer; 
            transition: all 0.2s;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-copy { 
            background: linear-gradient(135deg, #10b981, #059669) !important;
            color: white !important;
            padding: 1rem 2rem !important;
            font-size: 1.1rem !important;
            display: flex !important;
            align-items: center !important;
            gap: 0.5rem !important;
            box-shadow: 0 5px 15px rgba(16,185,129,0.4);
        }
        .btn-copy:hover:not(:disabled) { 
            transform: translateY(-2px); 
            box-shadow: 0 10px 25px rgba(16,185,129,0.5);
        }
        .btn-nav { background: #6b7280; color: white; }
        .btn-nav:hover:not(:disabled) { background: #4b5563; }
        .page-info { 
            padding: 0.75rem 1.5rem; 
            background: #e5e7eb; 
            border-radius: 10px; 
            font-weight: 700;
        }
        .display { 
            min-height: 600px; 
            padding: 3rem; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 2rem;
        }
        canvas { 
            max-width: 100%; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border-radius: 12px;
        }
        .text-output { 
            width: 100%; 
            padding: 1.5rem; 
            background: #f1f5f9; 
            border: 2px solid #e2e8f0; 
            border-radius: 12px; 
            font-size: 15px; 
            line-height: 1.6; 
            white-space: pre-wrap; 
            max-height: 400px; 
            overflow-y: auto;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
        }
        .placeholder { 
            color: #9ca3af; 
            font-size: 1.2rem; 
            text-align: center; 
            padding: 3rem;
        }
        .alert { 
            position: fixed; 
            bottom: 2rem; 
            left: 50%; 
            transform: translateX(-50%) translateY(100px); 
            background: #10b981; 
            color: white; 
            padding: 1rem 2rem; 
            border-radius: 12px; 
            font-weight: 700; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.25); 
            transition: all 0.3s; 
            z-index: 9999;
        }
        .alert.show { transform: translateX(-50%) translateY(0); }
        .copy-icon { width: 20px; height: 20px; fill: currentColor; }

  font-family: "Noto Sans JP", sans-serif;
  font-optical-sizing: auto;

}

.noto-sans-kr-<uniquifier> {
  font-family: "Noto Sans KR", sans-serif;
  font-optical-sizing: auto;
  font-weight: <weight>;
  font-style: normal;
}

.noto-sans-sc-<uniquifier> {
  font-family: "Noto Sans SC", sans-serif;
  font-optical-sizing: auto;

 .container2 { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 120px; padding: 15px; border: 2px solid #e9ecef; border-radius: 8px; font-size: 16px; resize: vertical; box-sizing: border-box; }
        textarea:focus { border-color: #007bff; outline: none; box-shadow: 0 0 0 3px rgba(0,123,255,0.1); }
        .btn { background: #28a745; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
        .btn:hover { background: #218838; transform: translateY(-1px); }
        .btn-copy { background: #17a2b8; margin-left: 10px; padding: 12px 16px; font-size: 14px; }
        .btn-copy:hover { background: #138496; }
        .controls { display: flex; gap: 10px; margin: 20px 0; flex-wrap: wrap; align-items: center; }
        
    </style>
</head>
<body>
    <div class="container">
        <h1 class="header">📄 Visualizzatore PDF PRO</h1>
        
        <div class="file-zone" onclick="document.getElementById('file').click()">
            <input type="file" id="file" accept=".pdf">
            <div class="file-label">🔽 Clicca qui o trascina un PDF</div>
        </div>

        <div class="toolbar">
            <button class="btn btn-copy" id="copy">
                <svg class="copy-icon" viewBox="0 0 24 24">
                    <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                </svg>
                COPIA TESTO
            </button>
            <button class="btn btn-nav" id="prev">◀️ PREC</button>
            <span class="page-info" id="info">Carica PDF</span>
            <button class="btn btn-nav" id="next">SUCC ➡️</button>
        </div>

        <div class="display" id="display">
            <div class="placeholder">Carica un PDF per vedere magia...</div>
        </div>         
    </div>

    <div class="alert" id="alert">✅ Testo copiato negli appunti!</div>
<br>
<br>
<br>
  <div class="container2">
    <h1>🗣️ Traduttore Lingue Asiatiche</h1>
    
    <textarea id="inputText" placeholder="Scrivi testo italiano... (es. Ciao mondo)"></textarea>
    
    <div class="controls">
        <select id="targetLang">
            <option value="en">🇺🇸 Inglese</option>
            <option value="zh">🇨🇳 Cinese</option>
            <option value="ja">🇯🇵 Giapponese</option>
            <option value="ko">🇰🇷 Coreano</option>
        </select>
        <button class="btn" onclick="translateText()">🔄 Traduci</button>
        <button class="btn-copy" onclick="copyOutput()">📋 Copia</button>
    </div>
    
    <textarea id="outputText" class="output" placeholder="Traduzione qui..." readonly></textarea>
</div>
    <script>

let isTranslated = false;

async function translateText() {
    const input = document.getElementById('inputText').value;
    if (!input) return;
    
    const lang = document.getElementById('targetLang').value;
    const output = document.getElementById('outputText');
    output.value = '⏳ Traducendo...';
    
    try {
        // API gratuita e affidabile
        const response = await fetch(
            `https://api.mymemory.translated.net/get?q=${encodeURIComponent(input)}&langpair=it|${lang}`
        );
        const data = await response.json();
        
        if (data.responseStatus === 200) {
            output.value = data.responseData.translatedText;
        } else {
            output.value = '❌ Limite API raggiunto, riprova tra 1h';
        }
        isTranslated = true;
    } catch (error) {
        output.value = '❌ Errore connessione';
        console.error(error);
    }
}

function copyOutput() {
    const output = document.getElementById('outputText');
    if (isTranslated && output.value && output.value !== '⏳ Traducendo...' && !output.value.includes('❌')) {
        navigator.clipboard.writeText(output.value).then(() => {
            const btn = event.target;
            const original = btn.innerHTML;
            btn.innerHTML = '✅ Copiato!';
            btn.style.background = '#28a745';
            setTimeout(() => {
                btn.innerHTML = original;
                btn.style.background = '#17a2b8';
            }, 2000);
        });
    }
}

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let pdfDocument = null;
        let currentPage = 1;
        let totalPages = 0;
        let extractedText = '';

        // ELEMENTI DOM
        const fileInput = document.getElementById('file');
        const display = document.getElementById('display');
        const info = document.getElementById('info');
        const prevBtn = document.getElementById('prev');
        const nextBtn = document.getElementById('next');
        const copyBtn = document.getElementById('copy');
        const alert = document.getElementById('alert');

        function updateControls() {
            const hasDoc = pdfDocument !== null;
            prevBtn.disabled = !hasDoc || currentPage <= 1;
            nextBtn.disabled = !hasDoc || currentPage >= totalPages;
            copyBtn.disabled = !hasDoc || !extractedText;
            info.textContent = hasDoc ? `Pagina ${currentPage} di ${totalPages}` : 'Carica PDF';
        }

        async function renderPage(num) {
            const page = await pdfDocument.getPage(num);
            const viewport = page.getViewport({ scale: 1.5 });
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = viewport.width;
            canvas.height = viewport.height;

            // Estrai TESTO dalla pagina corrente
            const textContent = await page.getTextContent();
            const pageText = textContent.items.map(item => item.str).join(' ');

            display.innerHTML = '';
            display.appendChild(canvas);

            if (pageText.trim()) {
                const textDiv = document.createElement('div');
                textDiv.className = 'text-output';
                textDiv.textContent = pageText;
                display.appendChild(textDiv);
            }

            await page.render({ canvasContext: ctx, viewport }).promise;
            currentPage = num;
            updateControls();
        }

        async function extractAllText() {
            extractedText = '';
            for (let i = 1; i <= totalPages; i++) {
                const page = await pdfDocument.getPage(i);
                const content = await page.getTextContent();
                const text = content.items.map(item => item.str).join(' ');
                extractedText += `
--- PAGINA ${i} ---
${text}
`;
            }
        }

        // CARICAMENTO PDF - SEMPLICE E STABILE
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            try {
                display.innerHTML = '<div class="placeholder">⏳ Caricando...</div>';
                
                const arrayBuffer = await file.arrayBuffer();
                pdfDocument = await pdfjsLib.getDocument(arrayBuffer).promise;
                
                totalPages = pdfDocument.numPages;
                currentPage = 1;
                
                await extractAllText();
                await renderPage(1);
                
            } catch (error) {
                console.error(error);
                display.innerHTML = '<div class="placeholder" style="color: #ef4444;">❌ Errore: ' + error.message + '</div>';
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentPage > 1) renderPage(currentPage - 1);
        });

        nextBtn.addEventListener('click', () => {
            if (currentPage < totalPages) renderPage(currentPage + 1);
        });

        copyBtn.addEventListener('click', async () => {
            await navigator.clipboard.writeText(extractedText);
            alert.classList.add('show');
            setTimeout(() => alert.classList.remove('show'), 2000);
        });

        updateControls();


    </script>
</body>
</html>
