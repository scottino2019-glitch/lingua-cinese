<!doctype html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizzatore PDF - FUNZIONANTE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&family=Noto+Sans+KR:wght@100..900&family=Noto+Sans+SC:wght@100..900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <style>
        * { box-sizing: border-box; margin: 0; }
        body { 
            font-family: system-ui, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }
        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
            background: white; 
            border-radius: 20px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        .header { 
            background: linear-gradient(135deg, #10b981, #059669);
            color: white; 
            padding: 2rem; 
            text-align: center;
            font-size: 2.2rem; 
            font-weight: 800;
        }
        .file-zone { 
            padding: 3rem; 
            border: 3px dashed #d1d5db; 
            border-radius: 16px; 
            text-align: center; 
            margin: 2rem; 
            cursor: pointer;
            transition: all 0.3s;
        }
        .file-zone:hover { 
            border-color: #10b981; 
            background: #ecfdf5;
        }
        .file-zone input { display: none; }
        .file-label { 
            font-size: 1.3rem; 
            font-weight: 700; 
            color: #374151;
        }
        .toolbar { 
            display: flex; 
            gap: 1rem; 
            padding: 1.5rem 2rem; 
            background: #f8fafc;
            flex-wrap: wrap;
            align-items: center;
        }
        .btn { 
            padding: 0.75rem 1.5rem; 
            border: none; 
            border-radius: 10px; 
            font-weight: 700; 
            font-size: 1rem; 
            cursor: pointer; 
            transition: all 0.2s;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-copy { 
            background: linear-gradient(135deg, #10b981, #059669) !important;
            color: white !important;
            padding: 1rem 2rem !important;
            font-size: 1.1rem !important;
            display: flex !important;
            align-items: center !important;
            gap: 0.5rem !important;
            box-shadow: 0 5px 15px rgba(16,185,129,0.4);
        }
        .btn-copy:hover:not(:disabled) { 
            transform: translateY(-2px); 
            box-shadow: 0 10px 25px rgba(16,185,129,0.5);
        }
        .btn-nav { background: #6b7280; color: white; }
        .btn-nav:hover:not(:disabled) { background: #4b5563; }
        .page-info { 
            padding: 0.75rem 1.5rem; 
            background: #e5e7eb; 
            border-radius: 10px; 
            font-weight: 700;
        }
        .display { 
            min-height: 600px; 
            padding: 3rem; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 2rem;
        }
        canvas { 
            max-width: 100%; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border-radius: 12px;
        }
        .text-output { 
            width: 100%; 
            padding: 1.5rem; 
            background: #f1f5f9; 
            border: 2px solid #e2e8f0; 
            border-radius: 12px; 
            font-size: 15px; 
            line-height: 1.6; 
            white-space: pre-wrap; 
            max-height: 400px; 
            overflow-y: auto;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
        }
        .placeholder { 
            color: #9ca3af; 
            font-size: 1.2rem; 
            text-align: center; 
            padding: 3rem;
        }
        .alert { 
            position: fixed; 
            bottom: 2rem; 
            left: 50%; 
            transform: translateX(-50%) translateY(100px); 
            background: #10b981; 
            color: white; 
            padding: 1rem 2rem; 
            border-radius: 12px; 
            font-weight: 700; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.25); 
            transition: all 0.3s; 
            z-index: 9999;
        }
        .alert.show { transform: translateX(-50%) translateY(0); }
        .copy-icon { width: 20px; height: 20px; fill: currentColor; }


.noto-sans-jp-<uniquifier> {
  font-family: "Noto Sans JP", sans-serif;
  font-optical-sizing: auto;
  font-weight: <weight>;
  font-style: normal;
}

.noto-sans-kr-<uniquifier> {
  font-family: "Noto Sans KR", sans-serif;
  font-optical-sizing: auto;
  font-weight: <weight>;
  font-style: normal;
}

.noto-sans-sc-<uniquifier> {
  font-family: "Noto Sans SC", sans-serif;
  font-optical-sizing: auto;

}
 .container2 { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h1 { color: #333; text-align: center; margin-bottom: 30px; }
textarea { 
            width: 100%; height: 250px; margin: 15px 0; padding: 20px; 
            font-size: 16px; font-family: inherit; border: 2px solid #e0e0e0; 
            border-radius: 8px; resize: vertical; box-sizing: border-box; 
            transition: border-color 0.3s; 
        }
        textarea:focus { border-color: #4285f4; outline: none; box-shadow: 0 0 0 3px rgba(66,133,244,0.1); }
        #tradotto { background: #f8f9fa; border-color: #4285f4; }
        .controls { 
            display: flex; flex-wrap: wrap; gap: 15px; margin: 25px 0; align-items: center; 
            justify-content: center; 
        }
        select { 
            padding: 12px 16px; font-size: 16px; border: 2px solid #e0e0e0; 
            border-radius: 8px; background: white; min-width: 140px; 
        }
        button { 
            padding: 12px 24px; font-size: 16px; border: none; border-radius: 8px; 
            cursor: pointer; font-weight: 500; transition: all 0.2s; 
        }
        .btn-traduci { background: #4285f4; color: white; }
        .btn-traduci:hover { background: #3367d6; transform: translateY(-1px); }
        .btn-copia { background: #34a853; color: white; }
        .btn-copia:hover { background: #2d8e44; transform: translateY(-1px); }
        .btn-svuota { background: #ea4335; color: white; }
        .btn-svuota:hover { background: #c5221f; transform: translateY(-1px); }
        .shortcut { font-size: 14px; color: #666; margin-left: 10px; font-style: italic; }
        .status { text-align: center; padding: 10px; border-radius: 6px; margin: 10px 0; font-weight: 500; }
        .loading { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="header">📄 Visualizzatore PDF PRO</h1>
        
        <div class="file-zone" onclick="document.getElementById('file').click()">
            <input type="file" id="file" accept=".pdf">
            <div class="file-label">🔽 Clicca qui o trascina un PDF</div>
        </div>

        <div class="toolbar">
            <button class="btn btn-copy" id="copy">
                <svg class="copy-icon" viewBox="0 0 24 24">
                    <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                </svg>
                COPIA TESTO
            </button>
            <button class="btn btn-nav" id="prev">◀️ PREC</button>
            <span class="page-info" id="info">Carica PDF</span>
            <button class="btn btn-nav" id="next">SUCC ➡️</button>
        </div>

        <div class="display" id="display">
            <div class="placeholder">Carica un PDF per vedere magia...</div>
        </div>         
    </div>

    <div class="alert" id="alert">✅ Testo copiato negli appunti!</div>
<br>
<br>
<br>
  <div class="container2">
        <h1>🧠 Editor con Google Translate</h1>
        
        <textarea id="editor" placeholder="Scrivi o incolla qui il testo da tradurre... Usa Ctrl+Enter per tradurre velocemente!">Hello world! This is a test for the new Google Translate integration.</textarea>
        
        <div class="controls">
            <select id="linguaA">
                <option value="it">🇮🇹 Italiano</option>
                <option value="en">🇺🇸 English</option>
                <option value="es">🇪🇸 Spagnolo</option>
                <option value="fr">🇫🇷 Francese</option>
                <option value="de">🇩🇪 Tedesco</option>
                <option value="zh">🇨🇳 Cinese</option>
                <option value="ja">🇯🇵 Giapponese</option>
                <option value="ko">🇰🇷 Coreano</option>
            </select>
            
            <button class="btn-traduci" onclick="traduciConGoogle()">🔄 Traduci</button>
            <span class="shortcut">o Ctrl+Enter</span>
            
            <button class="btn-copia" onclick="copiaTradotto()">📋 Copia</button>
            <button class="btn-svuota" onclick="svuotaTodo()">🗑️ Svuota</button>
        </div>
        
        <h3>📄 Traduzione:</h3>
        <textarea id="tradotto" placeholder="La traduzione Google apparirà qui..." readonly></textarea>
        <div id="status"></div>
        
        <div id="google_translate_element" style="display:none;"></div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let pdfDocument = null;
        let currentPage = 1;
        let totalPages = 0;
        let extractedText = '';

        // ELEMENTI DOM
        const fileInput = document.getElementById('file');
        const display = document.getElementById('display');
        const info = document.getElementById('info');
        const prevBtn = document.getElementById('prev');
        const nextBtn = document.getElementById('next');
        const copyBtn = document.getElementById('copy');
        const alert = document.getElementById('alert');

        function updateControls() {
            const hasDoc = pdfDocument !== null;
            prevBtn.disabled = !hasDoc || currentPage <= 1;
            nextBtn.disabled = !hasDoc || currentPage >= totalPages;
            copyBtn.disabled = !hasDoc || !extractedText;
            info.textContent = hasDoc ? `Pagina ${currentPage} di ${totalPages}` : 'Carica PDF';
        }

        async function renderPage(num) {
            const page = await pdfDocument.getPage(num);
            const viewport = page.getViewport({ scale: 1.5 });
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = viewport.width;
            canvas.height = viewport.height;

            // Estrai TESTO dalla pagina corrente
            const textContent = await page.getTextContent();
            const pageText = textContent.items.map(item => item.str).join(' ');

            display.innerHTML = '';
            display.appendChild(canvas);

            if (pageText.trim()) {
                const textDiv = document.createElement('div');
                textDiv.className = 'text-output';
                textDiv.textContent = pageText;
                display.appendChild(textDiv);
            }

            await page.render({ canvasContext: ctx, viewport }).promise;
            currentPage = num;
            updateControls();
        }

        async function extractAllText() {
            extractedText = '';
            for (let i = 1; i <= totalPages; i++) {
                const page = await pdfDocument.getPage(i);
                const content = await page.getTextContent();
                const text = content.items.map(item => item.str).join(' ');
                extractedText += `
--- PAGINA ${i} ---
${text}
`;
            }
        }

        // CARICAMENTO PDF - SEMPLICE E STABILE
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            try {
                display.innerHTML = '<div class="placeholder">⏳ Caricando...</div>';
                
                const arrayBuffer = await file.arrayBuffer();
                pdfDocument = await pdfjsLib.getDocument(arrayBuffer).promise;
                
                totalPages = pdfDocument.numPages;
                currentPage = 1;
                
                await extractAllText();
                await renderPage(1);
                
            } catch (error) {
                console.error(error);
                display.innerHTML = '<div class="placeholder" style="color: #ef4444;">❌ Errore: ' + error.message + '</div>';
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentPage > 1) renderPage(currentPage - 1);
        });

        nextBtn.addEventListener('click', () => {
            if (currentPage < totalPages) renderPage(currentPage + 1);
        });

        copyBtn.addEventListener('click', async () => {
            await navigator.clipboard.writeText(extractedText);
            alert.classList.add('show');
            setTimeout(() => alert.classList.remove('show'), 2000);
        });

        updateControls();

// Inizializza Google Translate (invisibile)
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'it',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                autoDisplay: false
            }, 'google_translate_element');
        }

        // Mostra status
        function mostraStatus(messaggio, tipo = 'neutral') {
            const status = document.getElementById('status');
            status.textContent = messaggio;
            status.className = `status ${tipo}`;
        }

        // Traduzione principale con Google
        async function traduciConGoogle() {
            const editor = document.getElementById('editor');
            const tradotto = document.getElementById('tradotto');
            const lingua = document.getElementById('linguaA').value;
            
            const testo = editor.value.trim();
            if (!testo) {
                mostraStatus('Scrivi prima qualcosa da tradurre!', 'neutral');
                return;
            }
            
            mostraStatus('🔄 Traducendo con Google...', 'loading');
            tradotto.value = 'Traducendo...';
            
            try {
                // Usa Google Translate mobile (funziona senza API key)
                const url = `https://translate.google.com/m?sl=auto&tl=${lingua}&q=${encodeURIComponent(testo)}&op=translate`;
                const response = await fetch(url);
                const html = await response.text();
                
                // Parsa HTML per estrarre traduzione
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const risultato = doc.querySelector('.result-container');
                
                if (risultato && risultato.textContent.trim()) {
                    tradotto.value = risultato.textContent.trim();
                    mostraStatus('✅ Traduzione completata!', 'success');
                } else {
                    throw new Error('Risultato non trovato');
                }
            } catch (error) {
                console.error('Errore traduzione:', error);
                tradotto.value = 'Errore: Prova con Ctrl+Enter o controlla connessione';
                mostraStatus('❌ Errore traduzione. Riprova!', 'loading');
            }
        }

        // Copia traduzione negli appunti
        function copiaTradotto() {
            const testo = document.getElementById('tradotto').value;
            if (testo && testo !== 'Traducendo...' && !testo.includes('Errore')) {
                navigator.clipboard.writeText(testo).then(() => {
                    mostraStatus('📋 Copiato negli appunti!', 'success');
                    setTimeout(() => mostraStatus(''), 2000);
                }).catch(() => {
                    alert('Copia manualmente il testo');
                });
            } else {
                mostraStatus('Niente da copiare!', 'neutral');
            }
        }

        // Svuota tutto
        function svuotaTodo() {
            document.getElementById('editor').value = '';
            document.getElementById('tradotto').value = '';
            document.getElementById('status').textContent = '';
            mostraStatus('🧹 Tutto svuotato!', 'success');
            document.getElementById('editor').focus();
        }

        // Event listener per Ctrl+Enter
        document.addEventListener('DOMContentLoaded', function() {
            const editor = document.getElementById('editor');
            editor.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.key === 'Enter') {
                    e.preventDefault();
                    traduciConGoogle();
                }
            });
            
            // Focus automatico
            editor.focus();
        });

        // Auto-traduci al cambio lingua (opzionale)
        document.getElementById('linguaA').addEventListener('change', function() {
            if (document.getElementById('tradotto').value && !document.getElementById('tradotto').value.includes('Errore')) {
                traduciConGoogle();
            }
        });
    </script>
</body>
</html>
