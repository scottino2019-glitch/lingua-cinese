<!doctype html>
<html lang="it">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lettore PDF con Editor Ideogrammi</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
        body {
            box-sizing: border-box;
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100%;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 2.2em;
            font-weight: 300;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 0;
            min-height: 600px;
        }

        .pdf-section {
            padding: 25px;
            border-right: 2px solid #ecf0f1;
        }

        .pdf-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .pdf-button {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .pdf-button:hover {
            background: linear-gradient(135deg, #2980b9, #1f5f8b);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }

        .pdf-viewer {
            border: 2px solid #bdc3c7;
            border-radius: 10px;
            background: #f8f9fa;
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
        }

        .pdf-canvas {
            max-width: 100%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .pdf-placeholder {
            text-align: center;
            color: #7f8c8d;
            font-size: 18px;
        }

        .editor-section {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            padding: 25px;
        }

        .editor-title {
            color: #d84315;
            margin: 0 0 20px 0;
            font-size: 1.6em;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(216, 67, 21, 0.2);
        }

        .text-editor {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .editor-textarea {
            width: 100%;
            height: 400px;
            border: none;
            outline: none;
            font-size: 18px;
            font-family: 'Courier New', monospace;
            line-height: 24px;
            padding: 0;
            margin: 0;
            resize: none;
            background: linear-gradient(
                transparent 23px,
                #e0e0e0 23px,
                #e0e0e0 24px,
                transparent 24px
            );
            background-size: 100% 24px;
            background-attachment: local;
            color: #333;
        }

        .editor-controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .editor-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .editor-btn:hover {
            background: linear-gradient(135deg, #5a67d8, #6b46c1);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .editor-btn.clear {
            background: linear-gradient(135deg, #ff6b6b, #ee5a52);
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }

        .editor-btn.clear:hover {
            background: linear-gradient(135deg, #ff5252, #d32f2f);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
        }

        .editor-btn.save {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .editor-btn.save:hover {
            background: linear-gradient(135deg, #45a049, #3d8b40);
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.4);
        }

        .char-counter {
            color: #666;
            font-size: 12px;
            margin-top: 10px;
            text-align: right;
        }

        .navigation-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 15px;
        }

        .nav-button {
            background: #34495e;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .nav-button:hover {
            background: #2c3e50;
        }

        .nav-button:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }

        .page-info {
            color: #7f8c8d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .pdf-section {
                border-right: none;
                border-bottom: 2px solid #ecf0f1;
            }
            
            .character-grid {
                grid-template-columns: repeat(6, 1fr);
            }
            
            .grid-cell {
                width: 30px;
                height: 30px;
                font-size: 18px;
            }
        }
    </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>

  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
 </head>
 <body>
  <div class="container">
   <div class="header">
    <h1>📚 Lettore PDF con Editor Ideogrammi 🈯</h1>
   </div>
   <div class="main-content">
    <div class="pdf-section">
     <div class="pdf-controls"><button class="pdf-button" onclick="loadPDF('pdf/grammatica-cinese-I.pdf')"> 📄 Grammatica cinese</button> 
     </div>
     <div class="pdf-controls"><button class="pdf-button" onclick="loadPDF('pdf/caratteri.pdf')">🉐 Caratteri</button>
</div>
 <input type="file" id="fileInput" accept=".pdf" style="display: none;" onchange="handleFileSelect(event)"> <button class="pdf-button" onclick="document.getElementById('fileInput').click()"> 📁 Carica PDF Locale </button>
</div>
     
     <div class="pdf-viewer" id="pdfViewer">
      <div class="pdf-placeholder">
       <p>🔍 Seleziona un PDF per iniziare la lettura</p>
       <p style="font-size: 14px; color: #95a5a6;">Puoi tradurre, copiare il testo scritto in Ideogrammi con la selezione.Salvare il testo in scrittura romana </p>
      </div>
     </div>
     <div class="navigation-controls"><button class="nav-button" id="prevPage" onclick="previousPage()" disabled>◀ Precedente</button> <button class="nav-button" id="nextPage" onclick="nextPage()" disabled>Successiva ▶</button> <span class="page-info" id="pageInfo">Pagina - di -</span>
     </div>
    </div>
    <div class="editor-section">
     <h2 class="editor-title">✍️ Editor di Testo a Quadrettoni</h2>
     <div class="text-editor"><textarea class="editor-textarea" id="textEditor" placeholder="Inizia a scrivere qui... Ogni riga è allineata ai righi per una scrittura ordinata!" oninput="updateCharCounter()"></textarea>
      <div class="editor-controls"><button class="editor-btn save" onclick="saveText()">💾 Salva Testo</button> <button class="editor-btn" onclick="insertSample()">📝 Testo di Esempio</button> <button class="editor-btn clear" onclick="clearEditor()">🗑️ Pulisci</button>
      </div>
      <div class="char-counter" id="charCounter">
       0 caratteri
      </div>
     </div>
    </div>
   </div>
  </div>
  <script>
        // PDF.js setup
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        
        let currentPDF = null;
        let currentPage = 1;
        let totalPages = 0;

        // Text editor functions
        function updateCharCounter() {
            const editor = document.getElementById('textEditor');
            const counter = document.getElementById('charCounter');
            const charCount = editor.value.length;
            counter.textContent = `${charCount} caratteri`;
        }

        function saveText() {
            const editor = document.getElementById('textEditor');
            const text = editor.value;
            
            if (!text.trim()) {
                showMessage('Non c\'è testo da salvare!');
                return;
            }
            
            // Create download link
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'testo_quadrettoni.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showMessage('Testo salvato con successo!');
        }

        function insertSample() {
            const editor = document.getElementById('textEditor');
            const sampleText = `Questo è un esempio di testo scritto nell'editor a righe.

Ogni riga è perfettamente allineata grazie alle linee guida.

Puoi scrivere:
- Note personali
- Appunti di studio
- Lettere e messaggi
- Qualsiasi testo tu voglia!

L'editor mantiene l'allineamento perfetto per una scrittura ordinata e professionale.

Prova a scrivere il tuo testo qui sotto...`;
            
            editor.value = sampleText;
            updateCharCounter();
            showMessage('Testo di esempio inserito!');
        }

        function clearEditor() {
            const editor = document.getElementById('textEditor');
            editor.value = '';
            updateCharCounter();
            showMessage('Editor pulito!');
        }

        // PDF loading functions
        async function loadPDF(url) {
            try {
                showMessage('Caricamento PDF in corso...');
                
                const loadingTask = pdfjsLib.getDocument(url);
                currentPDF = await loadingTask.promise;
                totalPages = currentPDF.numPages;
                currentPage = 1;
                
                await renderPage(currentPage);
                updateNavigationControls();
                showMessage('PDF caricato con successo!');
                
            } catch (error) {
                console.error('Errore nel caricamento del PDF:', error);
                showMessage('Errore: Impossibile caricare il PDF. Verifica che il file esista nel percorso "pdf/"');
                
                // Show error in viewer
                const viewer = document.getElementById('pdfViewer');
                viewer.innerHTML = `
                    <div class="pdf-placeholder">
                        <p style="color: #e74c3c;">❌ Errore nel caricamento del PDF</p>
                        <p style="font-size: 14px; color: #7f8c8d;">Verifica che il file esista in: ${url}</p>
                    </div>
                `;
            }
        }

        async function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file || file.type !== 'application/pdf') {
                showMessage('Seleziona un file PDF valido!');
                return;
            }
            
            const fileURL = URL.createObjectURL(file);
            await loadPDF(fileURL);
        }

        async function renderPage(pageNum) {
            if (!currentPDF) return;
            
            try {
                const page = await currentPDF.getPage(pageNum);
                const scale = 1.2;
                const viewport = page.getViewport({ scale });
                
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                canvas.className = 'pdf-canvas';
                
                const renderContext = {
                    canvasContext: context,
                    viewport: viewport
                };
                
                await page.render(renderContext).promise;
                
                const viewer = document.getElementById('pdfViewer');
                viewer.innerHTML = '';
                viewer.appendChild(canvas);
                
            } catch (error) {
                console.error('Errore nel rendering della pagina:', error);
                showMessage('Errore nel rendering della pagina');
            }
        }

        function previousPage() {
            if (currentPage > 1) {
                currentPage--;
                renderPage(currentPage);
                updateNavigationControls();
            }
        }

        function nextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                renderPage(currentPage);
                updateNavigationControls();
            }
        }

        function updateNavigationControls() {
            const prevBtn = document.getElementById('prevPage');
            const nextBtn = document.getElementById('nextPage');
            const pageInfo = document.getElementById('pageInfo');
            
            prevBtn.disabled = currentPage <= 1;
            nextBtn.disabled = currentPage >= totalPages;
            pageInfo.textContent = `Pagina ${currentPage} di ${totalPages}`;
        }

        function showMessage(message) {
            // Create temporary message element
            const messageEl = document.createElement('div');
            messageEl.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: #2c3e50;
                color: white;
                padding: 12px 20px;
                border-radius: 8px;
                z-index: 1000;
                font-size: 14px;
                box-shadow: 0 5px 15px rgba(0,0,0,0.2);
                animation: slideIn 0.3s ease;
            `;
            messageEl.textContent = message;
            
            document.body.appendChild(messageEl);
            
            setTimeout(() => {
                messageEl.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => {
                    if (messageEl.parentNode) {
                        messageEl.parentNode.removeChild(messageEl);
                    }
                }, 300);
            }, 3000);
        }

        // Add CSS animations
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
            @keyframes slideOut {
                from { transform: translateX(0); opacity: 1; }
                to { transform: translateX(100%); opacity: 0; }
            }
        `;
        document.head.appendChild(style);

        // Initialize the app
        document.addEventListener('DOMContentLoaded', function() {
            updateCharCounter();
        });
    </script>
