      <h3>Il Drago Cinese</h3>
      <p>Tra mito e leggende</p>
      <img src="https://images.unsplash.com/photo-1708052490237-3cba97e12ef8?q=80&w=1074&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D">
      <p>Il drago cinese simboleggia potere, autorità e fortuna, ma è soprattutto una creatura benevola che porta prosperità, saggezza e protezione.<br> Rappresenta la forza, ma anche l'armonia e l'equilibrio, ed è associato all'acqua, alla pioggia e alla fertilità.<br>È anche un elemento chiave dello zodiaco cinese, con persone nate sotto questo segno considerate energiche, intelligenti e determinate. <br><strong>Significati principali</strong><br>
<strong>Potere e autorità:</strong> Storicamente, il drago era il simbolo dell'imperatore cinese, rappresentando il suo potere supremo e il suo diritto divino di governare.<br><strong>Fortuna e prosperità:</strong> È considerato un portatore di buona fortuna, prosperità e ricchezza.<br><strong>Saggezza e intelligenza:</strong>A Avolte viene raffigurato con una perla, che simboleggia la saggezza, l'illuminazione e la conoscenza.<br><strong>Armonia ed equilibrio:</strong> In quanto creatura legata all'acqua, rappresenta l'importanza dell'armonia e dell'equilibrio, incarnando concetti come lo Yin e lo Yang.<br><strong>Protezione:</strong> È visto come un animale protettore, non un mostro, e si crede porti felicità.<br><strong>Fertilità:</strong> È associato all'acqua e quindi alla pioggia, alla fertilità e al nutrimento per piante e animali. <br><strong>Nel folklore e nella cultura</strong><br><strong>Le cinque qualità umane:</strong><br>Il corpo del drago è considerato simbolo delle cinque qualità umane: la testa rappresenta la virtù, le ali l'ubbidienza, la schiena il comportamento corretto, il petto la benevolenza e lo stomaco l'affidabilità.<br><strong>La perla:</strong> La perla che a volte tiene in bocca o sotto il collo rappresenta la precisione del pensiero e la saggezza.<br><strong>Nelle celebrazioni:</strong> La danza del drago è una tradizione tipica delle celebrazioni del Capodanno cinese per celebrare la buona sorte.<br><strong>Zodiaco cinese:</strong> Il drago è uno dei dodici animali dello zodiaco cinese e le persone nate sotto questo segno sono spesso considerate energetiche, intelligenti, tenaci e determinate.

    <div class="canvas-content">
     <h3>L'Oroscopo Cinese</h3>
     <p>Le origini e le leggende</p>
      <img src="https://www.scaffalecinese.it/wp-content/uploads/2021/02/zodiaco-cinese.png">
<p>
Lo zodiaco cinese è composto da dodici animali. Per determinare il quadro astrologico completo, bisogna considerare i cosiddetti <strong>Quattro Pilastri del Destino,</strong> i principi di <em> Yin e Yang e i Cinque elementi.</em>
<br>
Mentre in Occidente il segno zodiacale dipende dal mese di nascita, in Cina dall’anno, che è uno dei Quattro Pilastri del Destino, insieme al mese, al giorno e all’ora in cui si è nati. Per determinare il quadro astrologico completo, infatti, bisogna considerare tutti e quattro questi elementi, ad ognuno dei quali è possibile associare uno dei dodici animali che compongono lo zodiaco cinese.<strong> L’anno, il mese, il giorno e l’ora di nascita determinano rispettivamente l’animale annuale, l’animale interno, l’animale vero e infine l’animale segreto.</strong>

Inoltre, gli anni sono poi messi in relazione ai principi di Yin e Yang e ai Cinque elementi.

La legenda racconta che il Buddha, sentendo che stava per terminare la sua vita terrena, chiamò a sé tutti gli animali, ma soltanto dodici lo ascoltarono e andarono a porgergli il loro saluto. Per premiare la loro fedeltà, decise di chiamare ogni anno dei dodici anni del ciclo lunare con il nome di uno dei dodici animali che avevano risposto alla sua chiamata. <br> Per stabilire l’ordine, organizzò una gara tra i dodici animali, che avrebbero dovuto sfidarsi attraversando un fiume. Il primo ad arrivare fu il topo che, per battere gli altri, si arrampicò sul dorso del bue e, una volta giunto di fronte a Buddha, saltò giù, così da salutarlo per primo. Dopo il topo, quindi, arrivò il bue, seguito via via da tigre, coniglio, drago, serpente, cavallo, capra, scimmia, gallo, cane e maiale.

<strong>IL SEGNO ANNUALE</strong><br>
Il primo dei Quattro Pilastri del Destino è determinato dall’anno di nascita. Ad ogni anno è assegnato uno dei dodici animali dello zodiaco cinese, secondo cicli di dodici anni che iniziano con il topo e si concludono con il maiale.<br>

Stabilire il proprio segno zodiacale cinese, quindi, è piuttosto semplice, l’unica accortezza di cui è importante tenere conto, in particolare se si è nati in gennaio o febbraio, è che non va considerato il calendario gregoriano ma il calendario lunare, i cui mesi sono scanditi dai noviluni. Quindi, l’inizio del primo mese varia di anno in anno e coincide con il secondo novilunio dopo il solstizio d’inverno.<br>

Per capire meglio, prendendo come riferimento il calendario gregoriano, l’anno lunare inizia in un giorno compreso tra il 21 gennaio e il 19 febbraio. Ecco perché se si è nati nei primi venti giorni di gennaio si appartiene al segno cinese dell’anno precedente, mentre se si è nati nei giorni in cui può cadere il Capodanno cinese bisogna controllare la data d’inizio dell’anno lunare nel proprio anno di nascita per stabilire quale segno prendere in considerazione.<br>

A questo punto non resta che stabilire il proprio segno zodiacale! Ecco un piccolo schema per scoprilo:
<img src="https://www.trolleygirl.it/wp-content/uploads/2014/05/tabella_anni_cina_trolleygirl.jpg">
Ecco le “curiosità + mini‑profilo” per tutti i 12 segni:<br>

_Mini‑profilo_: sei sveglio, socievole e un vero “cacciatore di opportunità”. Ama i soldi e sa come farli fruttare, ma a volte può sembrare un po’ avido o troppo calcolatore. La tua energia è contagiosa, ma ricordati di ascoltare anche gli altri.<br>

 rappresenta il potere celeste e la pioggia benefica.<br>

La tua diffidenza verso gli estranei è naturale, ma una volta che ti fidi, sei un compagno per la vita.<br>

*🐖 Maiale*<br>
_Curiosità_: il Maiale è legato al benessere e alla prosperità; <br>
nella cultura contadina è considerato un segno di abbondanza.<br>
_Mini‑profilo_: generoso, sincero e amante del comfort.<br>
 Sei ottimista, socievole e ti piace godere delle piccole giozze della vita.<br> Attenzione a non lasciarti andare all’indulgenza o alla pigrità.
<br>
</p>
</div>

    <div class="canvas-content">
     <h3>🎑 Chang’\e</h3>
     <p>La leggenda di Chang’e e Houyi  </p>
      <img src="https://images.unsplash.com/photo-1681341550330-f2c99b4a213b?crop=entropy&cs=srgb&fm=jpg&ixid=M3w4MDc1Mjd8MHwxfHNlYXJjaHwzfHxMYSUyMGRlYSUyMGRlbGxhJTIwbHVuYXxlbnwwfHx8fDE3NjU4MTY4NTh8MA&ixlib=rb-4.1.0&q=85">
<p>
 <strong>Chang’e</strong>, é la dea della luna, è una delle figure più amate della mitologia cinese.<bt> La versione più diffusa,é quella che viene raccontata durante la Festa di Medio Autunno (中秋节 Zhōngqiū Jié).<br>
<br>
✨🌕✨🌕✨🌕✨🌕✨🌕✨🌕✨🌕✨🌕✨🌕
<br>
🌕 Tanto tempo fa, nel periodo della dinastia Xia, c’erano dieci soli che bruciavano la terra. Il popolo soffriva sotto il calore incessante, così l’arciere divino *Houyi* fu incaricato di scoccare le frecce e abbattere i soli. Con la sua abilità impeccabile, ne fece cadere nove, lasciandone uno solo perché il mondo potesse avere luce.
<br>
Come ricompensa, gli dèi gli donarono una *pietra dell’immortalità*. Ma Houyi, essendo un uomo di cuore, decise di non usarla subito: voleva condividerla con la sua amata moglie, *Chang’e*.
<br>
Un giorno, mentre Houyi era fuori a caccia, un perfido alchimista arrivò al villaggio e, sapendo del potere della pietra, tentò di rubarla.<br>
 Chang’e, per proteggere il dono, prese la pietra e la ingaltò tutta intera. Immediatamente, il suo corpo si fece leggero e cominciò a fluttuare verso il cielo. In un attimo, si trovò sulla luna, dove divenne la dea lunare.
<br>
Houyi, tornato a casa e trovando la moglie sparita, corse fuori e, guardando verso il cielo, vide una figura bianca sulla luna. <br>
Con il cuore spezzato, iniziò a offrire frutti e dolci sotto l’albero di cassia (桂 guì) che, secondo la leggenda, cresce sulla luna. <br>
Da allora, ogni anno, nella notte del 15° giorno dell’ottavo mese lunare, le famiglie cinesi preparano *mooncakes* (月饼 yuèbīng) e li offrono a Chang’e, sperando che la sua luce porti prosperità e armonia.
<br>
✨🌕✨🌕✨🌕✨🌕✨🌕✨🌕✨🌕✨🌕✨🌕
<br>
<strong>Curiosità</strong>
<br>
- La luna è chiamata “*月宫*” (Yuè Gōng, “Palazzo della Luna”) e si dice che Chang’e viva in un palazzo di giada, accompagnata da un coniglio di giada (玉兔 Yùtù) che pesta l’erba della vita.<br>
- Il nome *Chang’e* è spesso usato per le missioni lunari cinesi (ad esempio la sonda Chang’e‑5) in omaggio alla dea.<br>
- Nella poesia classica, Chang’e è associata alla bellezza e<br> alla solitudine: “*举头望明月，低头思故乡*” (Jǔ tóu wàng míngyuè, dītóu sī gùxiāng) – “Alzo lo sguardo alla luna luminosa, abbasso la testa pensando al mio paese”.✨
</p>
</div>

'item2-1': `
    <div class="canvas-content">
      <h3>春节 - Capodanno Cinese</h3>
      <p>L\'Arrivo della Primavera</p>
      <img src="https://images.unsplash.com/photo-1587971363995-fd1761cf2229?q=80&w=735&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D">
<p>
<h2 dir="ltr">​🏮 L'Arrivo della Primavera: Il Capodanno Cinese</h2>
<p dir="ltr">​Immagina che la festa più importante dell'anno stia per arrivare: è il <b>Festival di Primavera</b>, il tradizionale Capodanno cinese!</p>
<p dir="ltr">​Anche se la Cina usa ormai il calendario "occidentale" (gregoriano), l'inizio di questa festa è ancora fissato dall'antico <b>calendario lunare</b>. Per questo, ogni anno, la data cambia, ma di solito cade verso l'inizio della primavera, a <b>febbraio</b>.</p>
<h3 dir="ltr">​🍎 Preparativi e Festeggiamenti</h3>
<p dir="ltr">​Il Festival di Primavera è un po' come il Natale per noi: è il momento in cui tutti vogliono stare insieme. Chi vive lontano torna a casa per riunirsi con la <b>famiglia</b>.</p>
<p dir="ltr">​Prima che la festa inizi, c'è un gran da fare. È tempo di "mettere ordine" nella vita: tutti i debiti vengono saldati, i conti vengono chiusi, e le case subiscono una <b>pulizia profonda</b>. È un modo per dire addio al vecchio anno e accogliere il nuovo con una tabula rasa.</p>
<p dir="ltr">​Poi inizia l'addobbo! Case, negozi e strade si riempiono di decorazioni rosse e vivaci. Il <b>rosso</b> non è scelto a caso: è il colore della fortuna e serve, per tradizione, a scacciare gli spiriti maligni.</p>
<p dir="ltr">​Durante il Festival si fanno principalmente due cose: si <b>mangia</b> e si <b>gioca</b> (e i bambini, in particolare, sono felicissimi per i vestiti nuovi e le prelibatezze!). Si preparano tantissimi piatti deliziosi e diversi.</p>
<p dir="ltr">​È anche il momento dei doni. Le persone si scambiano regali, spesso avvolti in carta rossa. Il regalo più comune è l'<b><i>hong bao</i></b>: piccole buste rosse contenenti denaro, che simboleggiano prosperità. Anche alcuni cibi hanno un significato speciale, come i datteri rossi (che augurano che "la prosperità arrivi presto") e i mandarini (simbolo di fortuna).</p>
<h3 dir="ltr">​🧧 Il Giorno del <b>Bainian</b></h3>
<p dir="ltr">​La mattina del Capodanno, dopo essersi scambiati gli auguri tra i membri della stessa famiglia, si inizia a fare il giro di visite: è il rito chiamato <b><i>Bainian</i></b>.</p>
<p dir="ltr">​È un momento molto formale ma affettuoso. I <b>giovani</b> vanno a trovare gli <b>anziani</b> per primi. Poi si visitano parenti stretti, amici, vicini, insegnanti e colleghi. Un tempo ci si inchinava, ma oggi ci si scambia semplicemente i migliori auguri di buona fortuna e prosperità.</p>
<p dir="ltr">​C'è un'usanza molto amata: quando un giovane visita un anziano, quest'ultimo gli dona del denaro come regalo, chiamato "denaro per l'età aggiunta" (simboleggia l'augurio di una vita lunga e felice).</p>
<p dir="ltr">​In sintesi, il Festival di Primavera è un periodo di <b>riunione</b>, di <b>feste gioiose</b>, di <b>pulizia spirituale</b> e di speranza per un anno nuovo pieno di <b>fortuna e prosperità</b>.</p>
<p dir="ltr">​Ti piacerebbe che approfondissi un particolare aspetto del Festival di Primavera, come le tradizioni culinarie o la storia della festa?</p><p dir="ltr">🧧 L'Hongbao: La Magia della Busta Rossa</p><p dir="ltr">Durante il Capodanno cinese, c'è un regalo che fa sognare ogni bambino: l'Hongbao.</p><p dir="ltr">Cosa sono gli Hongbao? Sono delle semplici ma speciali buste di carta rosse che contengono dei soldi.</p><p dir="ltr">Non è solo una questione di denaro: è un gesto che simboleggia l'augurio di fortuna e ricchezza per l'anno nuovo. Il colore rosso, come sempre, è di buon auspicio!</p><p dir="ltr">Chi li dà e a chi?</p><p dir="ltr">Questa tradizione vede le generazioni più anziane (genitori, nonni, zii e persino amici di famiglia o vicini stretti) donare gli Hongbao alle generazioni più giovani.</p><p dir="ltr">È un modo affettuoso per augurare ai più piccoli (e in generale ai non sposati) un futuro prospero e fortunato. Ricevere un Hongbao è un segno che si è amati e che si spera il meglio per la propria vita nell'anno che inizia!</p><p dir="ltr"><br></p>
                
</p>
</div>

'item2-2': `
    <div class="canvas-content">
      <h3>元宵节 - Il Festival delle lanterne</h3>
      <p>Una notte speciale</p>
      <img src="https://images.unsplash.com/photo-1706602890105-d8838a12886c?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D">
<p>
  <h2 dir="ltr">​🏮 Una Notte Luminosa: Il Festival delle Lanterne</h2>
<p dir="ltr">​Quando il Capodanno cinese finisce, la festa non è ancora finita! Quindici giorni dopo, alla prima <b>luna piena</b> del nuovo anno, i cinesi celebrano il <b>Festival delle Lanterne</b>.</p>
<p dir="ltr">​È una notte speciale, illuminata dalla luna piena, che segna la fine del periodo delle feste.</p><img src="https://images.unsplash.com/photo-1661166849666-5925c3d8fc16?q=80&w=688&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"><br>
<h3 dir="ltr">​🥟 Il Piatto della Riunione: Yuanxiao</h3>
<p dir="ltr">​La tradizione più importante di questa sera è riunirsi in famiglia per mangiare gli <b><i>Yuanxiao</i></b>.</p>
<p dir="ltr">​Cosa sono? Sono dei piccoli gnocchetti tondi e dolci, fatti con farina di riso glutinoso e serviti in una zuppa calda. La loro forma rotonda è fondamentale, perché simboleggia la <b>riunione</b> della famiglia e l'augurio di <b>felicità e fortuna</b> per tutti i mesi a venire.</p>
<p dir="ltr">​Oggi, gli Yuanxiao sono diventati così popolari che si trovano in molti modi: i ripieni tradizionali (zucchero, sesamo, noci) sono ancora i preferiti, ma qualcuno sperimenta anche con carne, verdure o, pensate, persino cioccolato!</p>
<h3 dir="ltr">​💡 L'Arte di Fare le Lanterne</h3>
<p dir="ltr">​Il Festival prende il nome dalle <b>lanterne</b> che vengono appese ovunque, creando un'atmosfera magica.</p>
<p dir="ltr">​Il modo in cui vengono realizzate cambia molto a seconda della regione. Ad esempio, nel nord, nella provincia dello Shaanxi, la gente di campagna usa gli steli secchi del sorgo per costruire l'intelaiatura, che poi viene ricoperta con carta rossa. In questo modo creano lanterne con le forme più strane: a zucca, a caco, o a pecora.</p>
<p dir="ltr">​Usano anche le patate! Le intagliano a forma di piccola ciotola, ci mettono l'olio come combustibile, un piccolo stoppino e le coprono con un paralume di carta rossa. Queste lanterne illuminano gli ingressi delle case.</p>
<p dir="ltr">​Addirittura, gli alberi come i salici vengono decorati con carta colorata e lanterne rosse, tanto da essere chiamati "alberi lanterna" o "alberi scintillanti".</p><img src="https://images.unsplash.com/photo-1725354785215-efb82b0208aa?q=80&w=1074&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"><br>
<h3 dir="ltr">​👑 L'Origine e la Leggenda</h3>
<p dir="ltr">​Questa festa ha una storia che dura da oltre <b>2.000 anni</b>!</p>
<p dir="ltr">​Si dice che tutto sia iniziato durante la dinastia Han, quando un Imperatore ordinò a tutti di accendere delle lampade in questa notte per onorare il Buddha. Da lì, la tradizione si diffuse. Col tempo, la festa si allungò sempre di più: da una sola notte, arrivò a durare anche <b>dieci notti</b> consecutive durante la dinastia Qing!</p>
<p dir="ltr">​Un'altra storia, legata proprio agli Yuanxiao, parla della dea della luna, Chang'e. Suo marito, Houyi, si ammalò di nostalgia per lei. Così, la dea mandò una fata a dirgli di preparare delle polpette di riso rotonde (come la luna), metterle sul tavolo e chiamare il suo nome. Così facendo, lei sarebbe tornata da lui.</p>
<p dir="ltr">​Oggi, in ogni città, i parchi e le piazze si riempiono di lanterne bellissime (come quelle a forma di palazzo o con cavalli in corsa), creando uno spettacolo di luci che attira tutti a godersi la notte più luminosa dell'anno.</p>
                
</p>
</div>
