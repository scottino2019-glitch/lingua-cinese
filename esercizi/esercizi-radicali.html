<!doctype html>
<html lang="it" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radicali Cinesi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="/_sdk/data_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
  <style>
    body {
      box-sizing: border-box;
    }
    .font-chinese {
      font-family: 'Noto Sans SC', sans-serif;
    }
    .font-display {
      font-family: 'Playfair Display', serif;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(220, 38, 38, 0.3); }
      50% { box-shadow: 0 0 40px rgba(220, 38, 38, 0.5); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
    @keyframes bounce-in {
      0% { transform: scale(0.8); opacity: 0; }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-fade-in {
      animation: fadeIn 0.5s ease-out forwards;
    }
    .animate-pulse-glow {
      animation: pulse-glow 2s ease-in-out infinite;
    }
    .animate-shake {
      animation: shake 0.4s ease-in-out;
    }
    .animate-bounce-in {
      animation: bounce-in 0.4s ease-out forwards;
    }
    .radical-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .radical-card:hover {
      transform: translateY(-4px);
    }
    .option-btn {
      transition: all 0.2s ease;
    }
    .option-btn:hover:not(:disabled) {
      transform: scale(1.02);
    }
    .progress-bar {
      transition: width 0.5s ease-out;
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
 </head>
 <body class="h-full font-chinese">
  <div id="app" class="h-full overflow-auto"></div>
  <script>
    const radicals = [
      { char: '人', meaning: 'persona', pinyin: 'rén', examples: '你, 他, 们' },
      { char: '口', meaning: 'bocca', pinyin: 'kǒu', examples: '吃, 喝, 叫' },
      { char: '水', meaning: 'acqua', pinyin: 'shuǐ', examples: '河, 海, 洗' },
      { char: '火', meaning: 'fuoco', pinyin: 'huǒ', examples: '烧, 热, 烤' },
      { char: '木', meaning: 'albero', pinyin: 'mù', examples: '林, 森, 树' },
      { char: '金', meaning: 'metallo/oro', pinyin: 'jīn', examples: '银, 铁, 钱' },
      { char: '土', meaning: 'terra', pinyin: 'tǔ', examples: '地, 场, 坐' },
      { char: '日', meaning: 'sole', pinyin: 'rì', examples: '明, 时, 早' },
      { char: '月', meaning: 'luna', pinyin: 'yuè', examples: '朋, 期, 胖' },
      { char: '心', meaning: 'cuore', pinyin: 'xīn', examples: '想, 忘, 快' },
      { char: '手', meaning: 'mano', pinyin: 'shǒu', examples: '打, 拿, 找' },
      { char: '目', meaning: 'occhio', pinyin: 'mù', examples: '看, 眼, 睡' },
      { char: '女', meaning: 'donna', pinyin: 'nǚ', examples: '好, 妈, 姐' },
      { char: '子', meaning: 'figlio', pinyin: 'zǐ', examples: '学, 字, 孩' },
      { char: '山', meaning: 'montagna', pinyin: 'shān', examples: '岛, 峰, 岸' },
      { char: '雨', meaning: 'pioggia', pinyin: 'yǔ', examples: '雪, 雷, 零' },
      { char: '言', meaning: 'parola', pinyin: 'yán', examples: '说, 话, 语' },
      { char: '食', meaning: 'cibo', pinyin: 'shí', examples: '饭, 饿, 饮' },
      { char: '马', meaning: 'cavallo', pinyin: 'mǎ', examples: '驾, 骑, 验' },
      { char: '鸟', meaning: 'uccello', pinyin: 'niǎo', examples: '鸡, 鸭, 鹅' }
    ];

    const defaultConfig = {
      game_title: 'Radicali Cinesi',
      start_button_text: 'Inizia Quiz',
      background_color: '#1a1a2e',
      surface_color: '#16213e',
      text_color: '#eef2f7',
      primary_action_color: '#dc2626',
      secondary_action_color: '#f59e0b',
      font_family: 'Playfair Display',
      font_size: 16
    };

    let config = { ...defaultConfig };
    let userProgress = [];
    let currentView = 'menu';
    let currentQuestionIndex = 0;
    let score = 0;
    let quizQuestions = [];
    let selectedAnswer = null;
    let showingResult = false;
    let currentFlashcardIndex = 0;
    let flashcardFlipped = false;

    function shuffleArray(array) {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function generateQuizQuestions() {
      const shuffled = shuffleArray(radicals);
      return shuffled.slice(0, 10).map(radical => {
        const wrongAnswers = shuffleArray(
          radicals.filter(r => r.char !== radical.char)
        ).slice(0, 3).map(r => r.meaning);
        
        const options = shuffleArray([radical.meaning, ...wrongAnswers]);
        return { radical, options, correctAnswer: radical.meaning };
      });
    }

    function getRadicalProgress(char) {
      return userProgress.find(p => p.radical === char) || { correct_count: 0, wrong_count: 0 };
    }

    function render() {
      const app = document.getElementById('app');
      const fontStack = `${config.font_family}, Playfair Display, serif`;
      const baseSize = config.font_size;

      app.style.background = `linear-gradient(135deg, ${config.background_color} 0%, ${adjustColor(config.background_color, 20)} 100%)`;
      app.style.color = config.text_color;
      app.style.fontFamily = fontStack;

      if (currentView === 'menu') {
        renderMenu(app, fontStack, baseSize);
      } else if (currentView === 'quiz') {
        renderQuiz(app, fontStack, baseSize);
      } else if (currentView === 'flashcards') {
        renderFlashcards(app, fontStack, baseSize);
      } else if (currentView === 'progress') {
        renderProgress(app, fontStack, baseSize);
      } else if (currentView === 'result') {
        renderResult(app, fontStack, baseSize);
      }
    }

    function adjustColor(hex, amount) {
      const num = parseInt(hex.replace('#', ''), 16);
      const r = Math.min(255, Math.max(0, (num >> 16) + amount));
      const g = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + amount));
      const b = Math.min(255, Math.max(0, (num & 0x0000FF) + amount));
      return `#${(1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1)}`;
    }

    function renderMenu(app, fontStack, baseSize) {
      app.innerHTML = `
        <div class="min-h-full flex flex-col items-center justify-center p-6">
          <div class="text-center animate-fade-in">
            <div class="text-8xl mb-6 animate-pulse-glow inline-block p-4 rounded-full" style="background: ${config.surface_color}">
              🀄
            </div>
            <h1 id="main-title" class="font-display mb-4" style="font-size: ${baseSize * 2.5}px; font-family: ${fontStack}">${config.game_title}</h1>
            <p class="mb-10 opacity-80" style="font-size: ${baseSize}px">Impara i 20 radicali più comuni</p>
            
            <div class="flex flex-col gap-4 max-w-xs mx-auto">
              <button onclick="startQuiz()" class="option-btn px-8 py-4 rounded-xl font-bold shadow-lg" 
                style="background: ${config.primary_action_color}; color: white; font-size: ${baseSize * 1.1}px">
                ${config.start_button_text}
              </button>
              <button onclick="startFlashcards()" class="option-btn px-8 py-4 rounded-xl font-bold shadow-lg"
                style="background: ${config.secondary_action_color}; color: white; font-size: ${baseSize * 1.1}px">
                📚 Flashcards
              </button>
              <button onclick="showProgress()" class="option-btn px-8 py-4 rounded-xl font-bold border-2"
                style="border-color: ${config.text_color}; color: ${config.text_color}; font-size: ${baseSize * 1.1}px">
                📊 I Miei Progressi
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderQuiz(app, fontStack, baseSize) {
      const question = quizQuestions[currentQuestionIndex];
      const progress = ((currentQuestionIndex) / quizQuestions.length) * 100;

      app.innerHTML = `
        <div class="min-h-full flex flex-col p-4 md:p-6">
          <div class="flex items-center justify-between mb-6">
            <button onclick="goToMenu()" class="p-2 rounded-lg opacity-70 hover:opacity-100" style="background: ${config.surface_color}">
              ← Menu
            </button>
            <div class="text-center">
              <span style="font-size: ${baseSize * 0.9}px">Domanda ${currentQuestionIndex + 1}/${quizQuestions.length}</span>
              <span class="ml-4 px-3 py-1 rounded-full" style="background: ${config.secondary_action_color}; font-size: ${baseSize * 0.85}px">
                ⭐ ${score}
              </span>
            </div>
          </div>
          
          <div class="w-full rounded-full h-2 mb-8" style="background: ${config.surface_color}">
            <div class="progress-bar h-2 rounded-full" style="width: ${progress}%; background: ${config.primary_action_color}"></div>
          </div>
          
          <div class="flex-1 flex flex-col items-center justify-center">
            <div class="radical-card p-8 rounded-3xl mb-8 text-center animate-bounce-in" style="background: ${config.surface_color}">
              <div class="text-9xl mb-4 font-chinese">${question.radical.char}</div>
              <div class="opacity-60" style="font-size: ${baseSize * 0.9}px">${question.radical.pinyin}</div>
            </div>
            
            <p class="mb-6 opacity-80" style="font-size: ${baseSize * 1.2}px">Qual è il significato?</p>
            
            <div class="grid grid-cols-2 gap-3 w-full max-w-md">
              ${question.options.map((option, i) => {
                let btnStyle = `background: ${config.surface_color}; color: ${config.text_color}`;
                let extraClass = '';
                
                if (showingResult) {
                  if (option === question.correctAnswer) {
                    btnStyle = 'background: #22c55e; color: white';
                    extraClass = 'animate-bounce-in';
                  } else if (option === selectedAnswer && option !== question.correctAnswer) {
                    btnStyle = 'background: #ef4444; color: white';
                    extraClass = 'animate-shake';
                  }
                }
                
                return `
                  <button onclick="selectAnswer('${option}')" 
                    class="option-btn p-4 rounded-xl font-medium ${extraClass}"
                    style="${btnStyle}; font-size: ${baseSize}px"
                    ${showingResult ? 'disabled' : ''}>
                    ${option}
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderFlashcards(app, fontStack, baseSize) {
      const radical = radicals[currentFlashcardIndex];

      app.innerHTML = `
        <div class="min-h-full flex flex-col p-4 md:p-6">
          <div class="flex items-center justify-between mb-6">
            <button onclick="goToMenu()" class="p-2 rounded-lg opacity-70 hover:opacity-100" style="background: ${config.surface_color}">
              ← Menu
            </button>
            <span style="font-size: ${baseSize * 0.9}px">${currentFlashcardIndex + 1}/${radicals.length}</span>
          </div>
          
          <div class="flex-1 flex flex-col items-center justify-center">
            <div onclick="flipCard()" class="radical-card cursor-pointer p-8 rounded-3xl mb-8 text-center w-full max-w-sm min-h-64 flex flex-col items-center justify-center" 
              style="background: ${config.surface_color}; border: 2px solid ${flashcardFlipped ? config.secondary_action_color : 'transparent'}">
              ${!flashcardFlipped ? `
                <div class="text-9xl font-chinese animate-fade-in">${radical.char}</div>
                <div class="mt-4 opacity-60" style="font-size: ${baseSize}px">${radical.pinyin}</div>
                <div class="mt-6 opacity-40" style="font-size: ${baseSize * 0.85}px">Tocca per girare</div>
              ` : `
                <div class="animate-fade-in">
                  <div class="text-6xl font-chinese mb-4">${radical.char}</div>
                  <div class="font-bold mb-2" style="font-size: ${baseSize * 1.5}px; color: ${config.secondary_action_color}">${radical.meaning}</div>
                  <div class="opacity-60 mb-4" style="font-size: ${baseSize * 0.9}px">${radical.pinyin}</div>
                  <div class="pt-4 border-t" style="border-color: ${config.text_color}30">
                    <div class="opacity-60 mb-1" style="font-size: ${baseSize * 0.8}px">Esempi:</div>
                    <div class="font-chinese" style="font-size: ${baseSize * 1.2}px">${radical.examples}</div>
                  </div>
                </div>
              `}
            </div>
            
            <div class="flex gap-4">
              <button onclick="prevCard()" class="option-btn px-6 py-3 rounded-xl" 
                style="background: ${config.surface_color}; font-size: ${baseSize}px"
                ${currentFlashcardIndex === 0 ? 'disabled style="opacity: 0.5"' : ''}>
                ← Precedente
              </button>
              <button onclick="nextCard()" class="option-btn px-6 py-3 rounded-xl font-bold"
                style="background: ${config.primary_action_color}; color: white; font-size: ${baseSize}px">
                Prossimo →
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderProgress(app, fontStack, baseSize) {
      const totalPracticed = userProgress.length;
      const totalCorrect = userProgress.reduce((sum, p) => sum + p.correct_count, 0);
      const totalWrong = userProgress.reduce((sum, p) => sum + p.wrong_count, 0);
      const accuracy = totalCorrect + totalWrong > 0 ? Math.round((totalCorrect / (totalCorrect + totalWrong)) * 100) : 0;

      app.innerHTML = `
        <div class="min-h-full flex flex-col p-4 md:p-6">
          <div class="flex items-center justify-between mb-6">
            <button onclick="goToMenu()" class="p-2 rounded-lg opacity-70 hover:opacity-100" style="background: ${config.surface_color}">
              ← Menu
            </button>
            <h2 class="font-display" style="font-size: ${baseSize * 1.3}px">I Miei Progressi</h2>
          </div>
          
          <div class="grid grid-cols-3 gap-4 mb-8">
            <div class="p-4 rounded-xl text-center" style="background: ${config.surface_color}">
              <div class="text-3xl mb-1">📚</div>
              <div class="font-bold" style="font-size: ${baseSize * 1.5}px">${totalPracticed}</div>
              <div class="opacity-60" style="font-size: ${baseSize * 0.8}px">Praticati</div>
            </div>
            <div class="p-4 rounded-xl text-center" style="background: ${config.surface_color}">
              <div class="text-3xl mb-1">✅</div>
              <div class="font-bold" style="font-size: ${baseSize * 1.5}px">${totalCorrect}</div>
              <div class="opacity-60" style="font-size: ${baseSize * 0.8}px">Corrette</div>
            </div>
            <div class="p-4 rounded-xl text-center" style="background: ${config.surface_color}">
              <div class="text-3xl mb-1">🎯</div>
              <div class="font-bold" style="font-size: ${baseSize * 1.5}px">${accuracy}%</div>
              <div class="opacity-60" style="font-size: ${baseSize * 0.8}px">Precisione</div>
            </div>
          </div>
          
          <div class="flex-1 overflow-auto">
            <div class="grid grid-cols-4 md:grid-cols-5 gap-3">
              ${radicals.map(radical => {
                const progress = getRadicalProgress(radical.char);
                const total = progress.correct_count + progress.wrong_count;
                const mastery = total > 0 ? progress.correct_count / total : 0;
                let borderColor = config.surface_color;
                if (mastery >= 0.8) borderColor = '#22c55e';
                else if (mastery >= 0.5) borderColor = config.secondary_action_color;
                else if (total > 0) borderColor = '#ef4444';
                
                return `
                  <div class="p-3 rounded-xl text-center" style="background: ${config.surface_color}; border: 2px solid ${borderColor}">
                    <div class="font-chinese text-2xl">${radical.char}</div>
                    <div class="opacity-60 mt-1" style="font-size: ${baseSize * 0.7}px">${total > 0 ? `${progress.correct_count}/${total}` : '-'}</div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
          
          ${userProgress.length > 0 ? `
            <button onclick="resetProgress()" class="mt-6 px-4 py-2 rounded-lg opacity-60 hover:opacity-100" style="font-size: ${baseSize * 0.9}px">
              🗑️ Azzera Progressi
            </button>
          ` : ''}
        </div>
      `;
    }

    function renderResult(app, fontStack, baseSize) {
      const percentage = Math.round((score / quizQuestions.length) * 100);
      let emoji = '😢';
      let message = 'Continua a praticare!';
      if (percentage >= 90) { emoji = '🏆'; message = 'Eccellente!'; }
      else if (percentage >= 70) { emoji = '🎉'; message = 'Ottimo lavoro!'; }
      else if (percentage >= 50) { emoji = '😊'; message = 'Buon progresso!'; }

      app.innerHTML = `
        <div class="min-h-full flex flex-col items-center justify-center p-6">
          <div class="text-center animate-fade-in">
            <div class="text-8xl mb-6">${emoji}</div>
            <h2 class="font-display mb-2" style="font-size: ${baseSize * 2}px">${message}</h2>
            <p class="mb-6 opacity-80" style="font-size: ${baseSize * 1.2}px">Hai ottenuto</p>
            <div class="text-6xl font-bold mb-2" style="color: ${config.secondary_action_color}">${score}/${quizQuestions.length}</div>
            <p class="mb-10 opacity-60" style="font-size: ${baseSize}px">${percentage}% corretto</p>
            
            <div class="flex flex-col gap-4 max-w-xs mx-auto">
              <button onclick="startQuiz()" class="option-btn px-8 py-4 rounded-xl font-bold"
                style="background: ${config.primary_action_color}; color: white; font-size: ${baseSize * 1.1}px">
                🔄 Riprova
              </button>
              <button onclick="goToMenu()" class="option-btn px-8 py-4 rounded-xl font-bold border-2"
                style="border-color: ${config.text_color}; color: ${config.text_color}; font-size: ${baseSize * 1.1}px">
                ← Menu Principale
              </button>
            </div>
          </div>
        </div>
      `;
    }

    window.startQuiz = function() {
      currentView = 'quiz';
      currentQuestionIndex = 0;
      score = 0;
      selectedAnswer = null;
      showingResult = false;
      quizQuestions = generateQuizQuestions();
      render();
    };

    window.startFlashcards = function() {
      currentView = 'flashcards';
      currentFlashcardIndex = 0;
      flashcardFlipped = false;
      render();
    };

    window.showProgress = function() {
      currentView = 'progress';
      render();
    };

    window.goToMenu = function() {
      currentView = 'menu';
      render();
    };

    window.selectAnswer = async function(answer) {
      if (showingResult) return;
      
      selectedAnswer = answer;
      showingResult = true;
      const question = quizQuestions[currentQuestionIndex];
      const isCorrect = answer === question.correctAnswer;
      
      if (isCorrect) score++;

      // Update progress
      const existingProgress = userProgress.find(p => p.radical === question.radical.char);
      if (existingProgress) {
        if (isCorrect) {
          existingProgress.correct_count++;
        } else {
          existingProgress.wrong_count++;
        }
        existingProgress.last_practiced = new Date().toISOString();
        await window.dataSdk.update(existingProgress);
      } else {
        const newProgress = {
          radical: question.radical.char,
          correct_count: isCorrect ? 1 : 0,
          wrong_count: isCorrect ? 0 : 1,
          last_practiced: new Date().toISOString()
        };
        await window.dataSdk.create(newProgress);
      }

      render();

      setTimeout(() => {
        showingResult = false;
        selectedAnswer = null;
        currentQuestionIndex++;
        
        if (currentQuestionIndex >= quizQuestions.length) {
          currentView = 'result';
        }
        render();
      }, 1200);
    };

    window.flipCard = function() {
      flashcardFlipped = !flashcardFlipped;
      render();
    };

    window.nextCard = function() {
      currentFlashcardIndex = (currentFlashcardIndex + 1) % radicals.length;
      flashcardFlipped = false;
      render();
    };

    window.prevCard = function() {
      currentFlashcardIndex = (currentFlashcardIndex - 1 + radicals.length) % radicals.length;
      flashcardFlipped = false;
      render();
    };

    window.resetProgress = async function() {
      const confirmDiv = document.createElement('div');
      confirmDiv.id = 'confirm-modal';
      confirmDiv.className = 'fixed inset-0 flex items-center justify-center z-50';
      confirmDiv.style.background = 'rgba(0,0,0,0.7)';
      confirmDiv.innerHTML = `
        <div class="p-6 rounded-2xl max-w-sm mx-4 text-center" style="background: ${config.surface_color}">
          <p class="mb-6" style="font-size: ${config.font_size * 1.1}px">Vuoi davvero azzerare tutti i progressi?</p>
          <div class="flex gap-3 justify-center">
            <button onclick="confirmReset()" class="px-6 py-2 rounded-lg font-bold" style="background: #ef4444; color: white">Sì, Azzera</button>
            <button onclick="cancelReset()" class="px-6 py-2 rounded-lg" style="background: ${config.background_color}">Annulla</button>
          </div>
        </div>
      `;
      document.body.appendChild(confirmDiv);
    };

    window.confirmReset = async function() {
      document.getElementById('confirm-modal')?.remove();
      for (const progress of userProgress) {
        await window.dataSdk.delete(progress);
      }
    };

    window.cancelReset = function() {
      document.getElementById('confirm-modal')?.remove();
    };

    const dataHandler = {
      onDataChanged(data) {
        userProgress = data;
        render();
      }
    };

    async function init() {
      await window.dataSdk.init(dataHandler);

      window.elementSdk.init({
        defaultConfig,
        onConfigChange: async (newConfig) => {
          config = { ...defaultConfig, ...newConfig };
          render();
        },
        mapToCapabilities: (cfg) => ({
          recolorables: [
            {
              get: () => cfg.background_color || defaultConfig.background_color,
              set: (v) => { cfg.background_color = v; window.elementSdk.setConfig({ background_color: v }); }
            },
            {
              get: () => cfg.surface_color || defaultConfig.surface_color,
              set: (v) => { cfg.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); }
            },
            {
              get: () => cfg.text_color || defaultConfig.text_color,
              set: (v) => { cfg.text_color = v; window.elementSdk.setConfig({ text_color: v }); }
            },
            {
              get: () => cfg.primary_action_color || defaultConfig.primary_action_color,
              set: (v) => { cfg.primary_action_color = v; window.elementSdk.setConfig({ primary_action_color: v }); }
            },
            {
              get: () => cfg.secondary_action_color || defaultConfig.secondary_action_color,
              set: (v) => { cfg.secondary_action_color = v; window.elementSdk.setConfig({ secondary_action_color: v }); }
            }
          ],
          borderables: [],
          fontEditable: {
            get: () => cfg.font_family || defaultConfig.font_family,
