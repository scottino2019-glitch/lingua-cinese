<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esercizi di cinese sui verbi modali</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .chinese-char {
            font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
            font-size: 1.8em; 
            line-height: 1.6;
        }
        .blank {
            color: #ef4444; 
            font-weight: bold;
            text-decoration: underline; 
            margin: 0 5px; 
        }
        input::placeholder {
            font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-lg shadow-xl max-w-2xl w-full">
        <h1 class="text-4xl font-extrabold text-center mb-6 text-indigo-800">Esercizi sui verbi modali</h1>
        <p class="text-gray-700 mb-8 text-center text-lg">
            Completa le frasi inserendo il verbo modale cinese corretto.
        </p>

        <div id="quiz-container">
            <div id="question-container" class="mb-6 bg-indigo-50 p-6 rounded-md border border-indigo-200">
                <p id="question-number" class="text-sm text-indigo-600 mb-3 font-medium tracking-wide">Caricamento...</p>
                <p id="question-text" class="chinese-char text-gray-900 mb-4 leading-relaxed"></p>
                <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                    <input type="text" id="answer-input" class="flex-grow p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 text-lg" placeholder="Scrivi qui (es. 会)">
                    <button id="check-button" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-md transition duration-300 transform hover:scale-105">Controlla</button>
                </div>
            </div>

            <div id="feedback-container" class="mb-6 p-4 rounded-md text-center hidden">
                <p id="feedback-text" class="text-xl font-bold mb-2"></p>
                <p id="correct-answer-info" class="text-gray-700 text-md leading-relaxed"></p>
            </div>

            <div class="flex justify-between items-center mt-6 pt-4 border-t border-gray-200">
                <button id="next-button" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-6 rounded-md transition duration-300 transform hover:scale-105 hidden">Prossima Domanda</button>
                <p id="score-display" class="text-xl font-bold text-indigo-800">Punteggio: 0</p>
            </div>
        </div>

        <div id="quiz-end-screen" class="hidden text-center mt-8 p-6 bg-white rounded-lg">
            <h2 class="text-4xl font-bold text-indigo-700 mb-4">Quiz Completato!</h2>
            <p class="text-xl text-gray-800 mb-6">Il tuo punteggio finale è: <span id="final-score" class="font-bold text-green-700 text-2xl"></span></p>
            <button id="restart-button" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-8 rounded-md transition duration-300 transform hover:scale-105">Ricomincia</button>
        </div>
    </div>
<div id="roji-container" style="position: fixed; bottom: 20px; right: 20px; width: 80px; height: 80px; z-index: 2147483647; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: auto;">
  <iframe 
    id="roji-iframe"
    src="https://roji-tawny.vercel.app/" 
    style="width: 100%; height: 100%; border: none; overflow: hidden; background: transparent;"
    scrolling="no"
    allowtransparency="true">
  </iframe>
</div>

<script>
  window.addEventListener('message', function(event) {
    const container = document.getElementById('roji-container');
    if (!container) return;

    if (event.data && event.data.type === 'roji-toggle') {
      if (event.data.isOpen) {
        // Dimensioni per PC e Mobile
        if (window.innerWidth < 500) {
          container.style.width = '100%';
          container.style.height = '100%';
          container.style.bottom = '0';
          container.style.right = '0';
        } else {
          container.style.width = '380px';
          container.style.height = '600px';
        }
      } else {
        container.style.width = '80px';
        container.style.height = '80px';
        container.style.bottom = '20px';
        container.style.right = '20px';
      }
    }
  });
        const questions = [
            { id: 1, sentence: "我 ___ 说汉语。", answer: "会", pinyin: "huì", translation: "sapere come (abilità acquisita)", correctSentence: "我会说汉语。" },
            { id: 2, sentence: "你 ___ 吃辣的吗？", answer: "想", pinyin: "xiǎng", translation: "volere, desiderare", correctSentence: "你想吃辣的吗？" },
            { id: 3, sentence: "我明天 ___ 去北京。", answer: "要", pinyin: "yào", translation: "volere, avere intenzione di", correctSentence: "我明天要去北京。" },
            { id: 4, sentence: "你 ___ 多休息。", answer: "应该", pinyin: "yīnggāi", translation: "dovere (consiglio)", correctSentence: "你应该多休息。" },
            { id: 5, sentence: "这个房间很安静，你 ___ 在这里学习。", answer: "可以", pinyin: "kěyǐ", translation: "potere, essere permesso", correctSentence: "这个房间很安静，你可以在这里学习。" },
            { id: 6, sentence: "你 ___ 听老师的话。", answer: "必须", pinyin: "bìxū", translation: "dovere (obbligo)", correctSentence: "你必须听老师的话。" },
            { id: 7, sentence: "他 ___ 跑步，但是今天不舒服。", answer: "能", pinyin: "néng", translation: "potere (capacità fisica)", correctSentence: "他能跑步，但是今天不舒服。" },
            { id: 8, sentence: "我 ___ 帮你拿行李吗？", answer: "可以", pinyin: "kěyǐ", translation: "potere (permesso/richiesta)", correctSentence: "我可以帮你拿行李吗？" },
            { id: 9, sentence: "他们 ___ 参加这个会议。", answer: "应该", pinyin: "yīnggāi", translation: "dovere (morale/opportunità)", correctSentence: "他们应该参加这个会议。" },
            { id: 10, sentence: "小孩子 ___ 晚上九点睡觉。", answer: "要", pinyin: "yào", translation: "dovere (necessità)", correctSentence: "小孩子要晚上九点睡觉。" },
            { id: 11, sentence: "这里的菜太贵了，我们 ___ 去别的地方吃。", answer: "可以", pinyin: "kěyǐ", translation: "potere (opzione)", correctSentence: "这里的菜太贵了，我们可以去别的地方吃。" },
            { id: 12, sentence: "我还没学过，所以不 ___ 开车。", answer: "会", pinyin: "huì", translation: "sapere come (non ancora imparato)", correctSentence: "我还没学过，所以不会开车。" },
            { id: 13, sentence: "医生说我 ___ 喝酒。", answer: "不能", pinyin: "bù néng", translation: "non potere (divieto fisico/medico)", correctSentence: "医生说我不能喝酒。" },
            { id: 14, sentence: "如果你感冒了，___ 去看医生。", answer: "得", pinyin: "děi", translation: "dovere (necessità oggettiva)", correctSentence: "如果你感冒了，得去看医生。" },
            { id: 15, sentence: "外面太冷了，我情愿 ___ 在家里打游戏。", answer: "想", pinyin: "xiǎng", translation: "volere (desiderio)", correctSentence: "外面太冷了，我想在家里打游戏。" },
            { id: 16, sentence: "明天有考试，你 ___ 复习一下。", answer: "应当", pinyin: "yīngdāng", translation: "dovresti (formale)", correctSentence: "明天有考试，你应当复习一下。" },
            { id: 17, sentence: "他感冒好了，现在 ___ 打篮球了。", answer: "能", pinyin: "néng", translation: "potere (capacità ripristinata)", correctSentence: "他感冒好了，现在能打篮球了。" },
            { id: 18, sentence: "这里的公车很准时，你不需要 ___ 担心。", answer: "用", pinyin: "yòng", translation: "aver bisogno di (negativo: 不用)", correctSentence: "这里的公车很准时，你不用担心。" },
            { id: 19, sentence: "图书馆里 ___ 大声说话。", answer: "不可以", pinyin: "bù kěyǐ", translation: "non potere (permesso negato)", correctSentence: "图书馆里不可以大声说话。" },
            { id: 20, sentence: "天黑了，我们快 ___ 回家了。", answer: "要", pinyin: "yào", translation: "stare per (imminenza)", correctSentence: "天黑了， we 快要回家了。" }
        ];

        let currentQuestionIndex = 0;
        let score = 0;

        const questionNumberElem = document.getElementById('question-number');
        const questionTextElem = document.getElementById('question-text');
        const answerInput = document.getElementById('answer-input');
        const checkButton = document.getElementById('check-button');
        const nextButton = document.getElementById('next-button');
        const feedbackContainer = document.getElementById('feedback-container');
        const feedbackText = document.getElementById('feedback-text');
        const correctAnswerInfo = document.getElementById('correct-answer-info');
        const scoreDisplay = document.getElementById('score-display');
        const quizContainer = document.getElementById('quiz-container');
        const quizEndScreen = document.getElementById('quiz-end-screen');
        const finalScore = document.getElementById('final-score');
        const restartButton = document.getElementById('restart-button');

        function displayQuestion() {
            if (currentQuestionIndex < questions.length) {
                const q = questions[currentQuestionIndex];
                // Aggiornamento dinamico del numero domanda basato sulla lunghezza dell'array
                questionNumberElem.textContent = `Domanda ${currentQuestionIndex + 1} / ${questions.length}`;
                
                questionTextElem.innerHTML = q.sentence.replace('___', '<span class="blank">___</span>');
                answerInput.value = '';
                feedbackContainer.classList.add('hidden');
                nextButton.classList.add('hidden');
                checkButton.classList.remove('hidden');
                answerInput.disabled = false;
                answerInput.focus();
            } else {
                endQuiz();
            }
        }

        function checkAnswer() {
            const userAnswer = answerInput.value.trim();
            const q = questions[currentQuestionIndex];
            
            feedbackContainer.classList.remove('hidden');
            checkButton.classList.add('hidden');
            nextButton.classList.remove('hidden');
            answerInput.disabled = true;

            if (userAnswer === q.answer) {
                score++;
                feedbackContainer.className = "mb-6 p-4 rounded-md text-center bg-green-100";
                feedbackText.textContent = 'Corretto! 太棒了！';
                feedbackText.className = "text-xl font-bold mb-2 text-green-700";
                correctAnswerInfo.innerHTML = `Frase: <span class="chinese-char font-semibold">${q.correctSentence}</span>`;
            } else {
                feedbackContainer.className = "mb-6 p-4 rounded-md text-center bg-red-100";
                feedbackText.textContent = 'Sbagliato. 加油！';
                feedbackText.className = "text-xl font-bold mb-2 text-red-700";
                correctAnswerInfo.innerHTML = `Risposta corretta: <span class="chinese-char font-semibold">${q.answer}</span> (${q.pinyin})<br>Frase: <span class="chinese-char font-semibold">${q.correctSentence}</span>`;
            }
            scoreDisplay.textContent = `Punteggio: ${score}`;
        }

        function nextQuestion() {
            currentQuestionIndex++;
            displayQuestion();
        }

        function endQuiz() {
            quizContainer.classList.add('hidden');
            quizEndScreen.classList.remove('hidden');
            finalScore.textContent = `${score} / ${questions.length}`;
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            scoreDisplay.textContent = `Punteggio: ${score}`;
            quizContainer.classList.remove('hidden');
            quizEndScreen.classList.add('hidden');
            displayQuestion();
        }

        checkButton.addEventListener('click', checkAnswer);
        nextButton.addEventListener('click', nextQuestion);
        restartButton.addEventListener('click', restartQuiz);
        answerInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (!checkButton.classList.contains('hidden')) checkAnswer();
                else if (!nextButton.classList.contains('hidden')) nextQuestion();
            }
        });

        displayQuestion();
    </script>
</body>
</html>
